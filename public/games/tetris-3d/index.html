  </head>
  <body>
    <div id="game" aria-hidden="true"></div>

    <div id="ui">
      <header id="hud">
        <p id="objective" aria-live="polite">Objective: —</p>
        <nav id="tabs" aria-label="Game panels"></nav>
        <dl id="stats" aria-live="polite"></dl>

        <div id="level" hidden>
          <span id="level-name"></span>
          <div
            id="level-track"
            role="progressbar"
            aria-label="Level progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <span id="level-fill"></span>
          </div>
          <span id="level-hint"></span>
        </div>
      </header>

      <div id="touch" hidden></div>

      <div id="panels"></div>

      <div id="rotate" hidden>
        <p>Rotate your device</p>
        <p class="dim"></p>
      </div>
    </div>
