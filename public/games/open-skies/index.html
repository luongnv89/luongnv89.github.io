function predictImpact(kind) {
  let bx = ac.pos.x, by = ac.pos.y, bz = ac.pos.z;
  let vx, vy, vz, burn = 0;
  if (kind === O_ROCKET) {
    const o = ORD[O_ROCKET];
    _cfwd.set(0, 0, -1).applyQuaternion(ac.quat);
    vx = ac.vel.x + _cfwd.x * o.v0;
    vy = ac.vel.y + _cfwd.y * o.v0;
    vz = ac.vel.z + _cfwd.z * o.v0;
    burn = o.burn;
  } else {
    vx = ac.vel.x; vy = ac.vel.y - 0.6; vz = ac.vel.z;
  }
  const h = 0.05, drag = ORD[O_BOMB].drag, thrust = ORD[O_ROCKET].thrust;
  for (let n = 0; n < 300; n++) {
    if (kind === O_ROCKET) {
      if (burn > 0) {
        const sp = Math.hypot(vx, vy, vz) || 1, a = thrust * h;
        vx += vx / sp * a; vy += vy / sp * a; vz += vz / sp * a;
        burn -= h;
      }
    } else {
      const sp = Math.hypot(vx, vy, vz) || 1, k = drag * sp * h;
      vx -= vx * k; vy -= vy * k; vz -= vz * k;
    }
    vy -= 9.81 * h;
    bx += vx * h; by += vy * h; bz += vz * h;
    // Sampling the ground every other step halves the terrain lookups; at these
    // speeds one step is a few metres, well inside any blast radius.
    if ((n & 1) === 0) {
      const gy = heightAt(bx, bz);
      const surface = gy > 0 ? gy : 0;              // water counts as ground
      if (by <= surface) { _pred.set(bx, surface, bz); return true; }
    }
    if (by < -40) return false;
  }
  return false;
}

/* --- ordnance in flight -------------------------------------------------- */
function launchOrd(kind) {
  let slot = -1;
  for (let i = 0; i < RMAX; i++) { const j = (rCursor + i) % RMAX; if (!rOn[j]) { slot = j; break; } }
  if (slot < 0) return false;
  rCursor = (slot + 1) % RMAX;
  _cfwd.set(0, 0, -1).applyQuaternion(ac.quat);
  // Alternate pylons, and hang them under the wing rather than in the spinner.
  const side = (ac.ordAmmo[kind] & 1) ? 1 : -1;
  _cv1.set(side * (kind === O_BOMB ? 1.5 : 2.2), -0.5, 0.2).applyQuaternion(ac.quat).add(ac.pos);
  rOn[slot] = 1; rKind[slot] = kind;
  rX[slot] = _cv1.x; rY[slot] = _cv1.y; rZ[slot] = _cv1.z;
  if (kind === O_ROCKET) {
    const o = ORD[O_ROCKET];
    rVX[slot] = ac.vel.x + _cfwd.x * o.v0;
    rVY[slot] = ac.vel.y + _cfwd.y * o.v0;
    rVZ[slot] = ac.vel.z + _cfwd.z * o.v0;
    rBurn[slot] = o.burn;
    rT[slot] = o.life;
  } else {
    // A bomb leaves with the aeroplane's velocity and nothing else.
    rVX[slot] = ac.vel.x; rVY[slot] = ac.vel.y - 0.6; rVZ[slot] = ac.vel.z;
    rBurn[slot] = 0;
    rT[slot] = ORD[O_BOMB].life;
  }
  rSmoke[slot] = 0;
  return true;
}

// Area damage. Everything inside the radius takes a share of it, falling off
// linearly — including you, which is what stops a bomb being a free win.
function blast(x, y, z, radius, dmg) {
  boom(x, y, z, clamp(radius / 11, 1.1, 3.2));
  for (let i = 0; i < TARGETS.length; i++) {
    const t = TARGETS[i];
    if (!t.alive) continue;
    const d = Math.hypot(t.x - x, t.y + t.r * 0.4 - y, t.z - z) - t.r;
    if (d > radius) continue;
    t.hp -= dmg * (1 - clamp(d / radius, 0, 1));
    t.hitT = clock;
    if (t.hp <= 0) killTarget(t);
  }
  for (let i = 0; i < EMAX; i++) {
    const f = foes[i];
    if (!f.on) continue;
    const d = f.pos.distanceTo(_cv2.set(x, y, z)) - 6;
    if (d > radius) continue;
    f.hp -= dmg * (1 - clamp(d / radius, 0, 1)) * 0.8;
    sparks(f.pos.x, f.pos.y, f.pos.z, 5);
    if (f.hp <= 0) killFoe(f);
  }
  if (!ac.crashed) {
    const d = ac.pos.distanceTo(_cv2.set(x, y, z));
    if (d < radius * 1.25) {
      hurt(dmg * 0.42 * (1 - clamp(d / (radius * 1.25), 0, 1)), 'CAUGHT IN YOUR OWN BLAST');
      if (clock - WAR.warnT > 2) { WAR.warnT = clock; flash('TOO LOW — YOUR OWN BLAST'); }
    }
  }
}

function stepOrd(dt) {
  for (let i = 0; i < RMAX; i++) {
    if (!rOn[i]) continue;
    rT[i] -= dt;
    const kind = rKind[i];
    if (rT[i] <= 0) { rOn[i] = 0; continue; }
    const px = rX[i], py = rY[i], pz = rZ[i];

    if (kind === O_ROCKET) {
      if (rBurn[i] > 0) {
        // Motor: thrust along the way it is already pointing.
        const sp = Math.hypot(rVX[i], rVY[i], rVZ[i]) || 1;
        const a = ORD[O_ROCKET].thrust * dt;
        rVX[i] += rVX[i] / sp * a; rVY[i] += rVY[i] / sp * a; rVZ[i] += rVZ[i] / sp * a;
        rBurn[i] -= dt;
      }
      rVY[i] -= 9.81 * dt;
    } else {
      const sp = Math.hypot(rVX[i], rVY[i], rVZ[i]) || 1;
      const k = ORD[O_BOMB].drag * sp * dt;
      rVX[i] -= rVX[i] * k; rVY[i] -= rVY[i] * k; rVZ[i] -= rVZ[i] * k;
      rVY[i] -= 9.81 * dt;
    }

    const dx = rVX[i] * dt, dy = rVY[i] * dt, dz = rVZ[i] * dt;
    const nx = px + dx, ny = py + dy, nz = pz + dz;
    let hit = 0;

    // Direct contact with anything solid sets it off.
    for (let g = 0; g < TARGETS.length && !hit; g++) {
      const t = TARGETS[g];
      if (!t.alive) continue;
      if (Math.abs(nx - t.x) > 300 || Math.abs(nz - t.z) > 300) continue;
      const rr = (t.r + 1.5) * (t.r + 1.5);
      if (segMiss(px, py, pz, dx, dy, dz, t.x, t.y + t.r * 0.45, t.z) < rr) hit = 1;
    }
    for (let e = 0; e < EMAX && !hit; e++) {
      const f = foes[e];
      if (!f.on) continue;
      if (segMiss(px, py, pz, dx, dy, dz, f.pos.x, f.pos.y, f.pos.z) < 56) hit = 1;
    }
    let surface = 0;
    if (!hit && ny < 900) {
      const gy = heightAt(nx, nz);
      surface = gy > 0 ? gy : 0;                    // it goes off on the water too
      if (ny <= surface) hit = 1;
    }

    if (hit) {
      const o2 = ORD[kind];
      blast(nx, Math.max(ny, surface), nz, o2.blast, o2.dmg);
      rOn[i] = 0;
      continue;
    }

    rX[i] = nx; rY[i] = ny; rZ[i] = nz;

    // A rocket leaves a thick trail while the motor burns, a thin one after.
    rSmoke[i] -= dt;
    if (rSmoke[i] <= 0) {
      rSmoke[i] = kind === O_ROCKET ? (rBurn[i] > 0 ? 0.02 : 0.09) : 0.16;
      spawnPart(K_SMOKE, nx, ny, nz, (Math.random() - 0.5) * 2, 0.8, (Math.random() - 0.5) * 2,
        kind === O_ROCKET && rBurn[i] > 0 ? 0.7 : 1.1,
        kind === O_ROCKET ? 0.8 + Math.random() * 0.7 : 0.5);
      if (kind === O_ROCKET && rBurn[i] > 0) {
        spawnPart(K_FIRE, nx, ny, nz, 0, 0, 0, 0.07, 0.5);
      }
    }
  }
}

/* --- the fighters -------------------------------------------------------- */
function spawnFoe() {
  let f = null;
  for (let i = 0; i < EMAX; i++) if (!foes[i].on) { f = foes[i]; break; }
  if (!f) return null;
  const z = WAR.zone || ZONES[0];
  const a = Math.random() * TAU, r = 700 + Math.random() * 500;
  const gx = z.x + Math.cos(a) * r, gz = z.z + Math.sin(a) * r;
  const gy = Math.max(heightAt(gx, gz), 0) + 320 + Math.random() * 260;
  f.on = true;
  f.hp = FOE.HP;
  f.pos.set(gx, gy, gz);
  f.spd = 62 + Math.random() * 6;
  f.fwd.set(-Math.sin(a), 0, -Math.cos(a)).normalize();
  f.vel.copy(f.fwd).multiplyScalar(f.spd);
  f.yaw = Math.atan2(-f.fwd.x, -f.fwd.z);
  f.roll = 0;
  f.state = ST_PATROL; f.st = 0;
  f.fireT = 0; f.burst = 0; f.gap = 0; f.smokeT = 0;
  f.ax = z.x; f.az = z.z; f.ay = gy;
  f.pa = a; f.pdir = Math.random() > 0.5 ? 1 : -1;
  f.skill = clamp(0.42 + WAR.wave * 0.08 + Math.random() * 0.12, 0.4, 0.95);
  f.react = 0.55 - f.skill * 0.3;
  f.mesh.visible = true;
  f.mesh.position.copy(f.pos);
  WAR.spawned++;
  return f;
}

function stepFoe(f, dt) {
  const pRange = f.pos.distanceTo(ac.pos);
  const engageable = !ac.crashed && !ac.onGround;

  // --- decide where it wants to point -----------------------------------
  f.st += dt;
  if (f.state === ST_PATROL) {
    // A racetrack over the garrison until you turn up.
    f.pa += f.pdir * dt * 0.055;
    const px = f.ax + Math.cos(f.pa) * 760, pz = f.az + Math.sin(f.pa) * 760;
    _cv1.set(px - f.pos.x, (f.ay - f.pos.y) * 0.6, pz - f.pos.z);
    if (engageable && pRange < 2900) { f.state = ST_ENGAGE; f.st = 0; }
  } else if (f.state === ST_ENGAGE) {
    if (!engageable) { f.state = ST_PATROL; f.st = 0; }
    // Where you will be when the rounds get there.
    // Its gun solution, with a deliberate error in the lead: a fighter that
    // predicts you perfectly is not an opponent, it is a sentence.
    const tof = clamp(pRange / FOE.MUZZLE, 0, 1.4) * (0.68 + f.skill * 0.36);
    f.aim.copy(ac.vel).multiplyScalar(tof).add(ac.pos);
    _cv2.set(0, 0, -1).applyQuaternion(ac.quat);            // your nose
    _cv3.copy(f.pos).sub(ac.pos);
    const offTail = _cv3.length() > 1 ? Math.acos(clamp(_cv3.dot(_cv2) / -_cv3.length(), -1, 1)) : 0;
    // Out in front of you it goes for a point on your tail; once it is behind
    // you it goes for the gun solution.
    if (offTail > 65 * DEG && pRange > 260) {
      _cv1.copy(_cv2).multiplyScalar(-240).add(ac.pos).sub(f.pos);
    } else {
      _cv1.copy(f.aim).sub(f.pos);
    }
    // Head-on and closing fast: break rather than ram.
    if (pRange < 150) { f.state = ST_BREAK; f.st = 0; }
    if (f.spd < 38) { f.state = ST_BREAK; f.st = 0; }            // out of energy
    if (f.hp < 34) { f.state = ST_BREAK; f.st = 0; flash('A FIGHTER IS BREAKING OFF — DAMAGED'); }
  } else if (f.state === ST_BREAK) {
    // Unload, nose down, run for speed.
    _cv1.copy(f.pos).sub(ac.pos).normalize();
    _cv1.y = -0.32;
    if (f.st > 1.5 && (f.spd > 60 && pRange > 700)) {
      if (f.hp < 34) { f.state = ST_BUGOUT; f.st = 0; }
      else { f.state = ST_ENGAGE; f.st = 0; }
    }
    if (f.st > 9) { f.state = f.hp < 34 ? ST_BUGOUT : ST_ENGAGE; f.st = 0; }
  } else {
    // Bugging out: away from the fight, climbing, until it is out of the map.
    _cv1.copy(f.pos).sub(ac.pos).normalize();
    _cv1.y = 0.16;
    if (pRange > 3200) {
      f.on = false; f.mesh.visible = false; WAR.fled++;
      flash('A DAMAGED FIGHTER HAS LEFT THE FIGHT');
      return;
    }
  }

  // Terrain: look ahead and pull up rather than fly into a hill.
  const ahead = heightAt(f.pos.x + f.fwd.x * 320, f.pos.z + f.fwd.z * 320);
  const gy = heightAt(f.pos.x, f.pos.z);
  if (f.pos.y < ahead + 140 || f.pos.y < gy + 110) {
    _cv1.y = Math.abs(_cv1.length()) * 0.7 + 30;
  }
  if (f.pos.y > 2700) _cv1.y = Math.min(_cv1.y, -10);

  const wl = _cv1.length();
  if (wl < 1e-4) _cv1.copy(f.fwd); else _cv1.multiplyScalar(1 / wl);
  f.want.copy(_cv1);

  // --- turn, inside a real load-factor limit -----------------------------
  // n is capped both structurally and by the wing: at low speed it simply
  // cannot pull, which is why zooming a fighter up to the stall beats it.
  const nLift = (f.spd / FOE.VSTALL) * (f.spd / FOE.VSTALL);
  const nMax = Math.max(1, Math.min(FOE.NMAX, nLift));
  const omega = 9.81 * Math.sqrt(Math.max(0, nMax * nMax - 1)) / Math.max(f.spd, 14);
  let dot = clamp(f.fwd.dot(f.want), -1, 1);
  const angle = Math.acos(dot);
  const yaw0 = f.yaw;
  let nUsed = 1;
  if (angle > 1e-4) {
    const turn = Math.min(angle, omega * dt);
    nUsed = 1 + (turn / Math.max(omega * dt, 1e-6)) * (nMax - 1);
    _cv2.crossVectors(f.fwd, f.want);
    const cl = _cv2.length();
    if (cl > 1e-6) {
      _cv2.multiplyScalar(1 / cl);
      _cq.setFromAxisAngle(_cv2, turn);
      f.fwd.applyQuaternion(_cq).normalize();
    }
  }

  // --- energy ------------------------------------------------------------
  // Full power except in close, where it eases off rather than overshoot.
  const thr = (f.state === ST_ENGAGE && pRange < 340 && f.spd > 58) ? 0.7 : 1;
  const acc = FOE.THRUST * thr - FOE.DRAG * f.spd * f.spd - 9.81 * f.fwd.y
    - FOE.BLEED * (nUsed * nUsed - 1);
  f.spd = clamp(f.spd + acc * dt, 16, FOE.VMAX + 14);
  f.vel.copy(f.fwd).multiplyScalar(f.spd);
  f.pos.addScaledVector(f.vel, dt);
  if (f.pos.y < gy + 24) { f.pos.y = gy + 24; if (f.fwd.y < 0) { f.fwd.y = 0.12; f.fwd.normalize(); } }

  // Attitude for drawing: yaw and pitch from the velocity vector, bank from
  // how hard it is turning.
  f.yaw = Math.atan2(-f.fwd.x, -f.fwd.z);
  let dy = f.yaw - yaw0;
  while (dy > Math.PI) dy -= TAU;
  while (dy < -Math.PI) dy += TAU;
  const rollWant = clamp((dy / Math.max(dt, 1e-4)) * 1.35, -1.3, 1.3);
  f.roll += (rollWant - f.roll) * clamp(dt * 5.5, 0, 1);

  // --- guns --------------------------------------------------------------
  f.fireT -= dt;
  f.gap -= dt;
  if (f.state === ST_ENGAGE && engageable && f.st > f.react && pRange < FOE.RANGE && pRange > 70 && f.spd > 42) {
    _cv3.copy(f.aim).sub(f.pos);
    const al = _cv3.length() || 1;
    const off = Math.acos(clamp(_cv3.dot(f.fwd) / al, -1, 1));
    if (off < 3.2 * DEG && f.gap <= 0) {
      if (f.burst <= 0) { f.burst = 0.35 + f.skill * 0.55; }
      if (f.fireT <= 0) {
        f.fireT = FOE.RATE;
        _cv3.multiplyScalar(1 / al);
        fireBullet(f.pos.x + f.fwd.x * 3, f.pos.y + f.fwd.y * 3, f.pos.z + f.fwd.z * 3,
          _cv3.x, _cv3.y, _cv3.z, FOE.MUZZLE, 1, FOE.DMG, 0.050 - f.skill * 0.020,
          1.4, f.vel.x * 0.3, f.vel.y * 0.3, f.vel.z * 0.3);
        audio.gunFar(pRange);
      }
      f.burst -= dt;
      if (f.burst <= 0) f.gap = 1.0 + (1 - f.skill) * 1.4;
    }
  }

  // Damaged fighters trail smoke, which is how you know one is hurt.
  if (f.hp < 58) {
    f.smokeT -= dt;
    if (f.smokeT <= 0) {
      f.smokeT = f.hp < 30 ? 0.05 : 0.11;
      spawnPart(K_SMOKE, f.pos.x, f.pos.y, f.pos.z,
        f.vel.x * 0.1 + (Math.random() - 0.5) * 3, 1.5, f.vel.z * 0.1 + (Math.random() - 0.5) * 3,
        1.1 + Math.random() * 0.9, 1.5 + Math.random() * 1.4);
    }
  }

  // Mid-air: at twelve metres you have both lost.
  if (!ac.crashed && !ac.onGround && pRange < 12) {
    killFoe(f);
    hurt(HULL * 2, 'MID-AIR COLLISION WITH A FIGHTER');
  }
}

/* --- the garrison -------------------------------------------------------- */
function stepGround(dt) {
  const agl = ac.pos.y - heightAt(ac.pos.x, ac.pos.z);
  const shootable = !ac.crashed && !ac.onGround && agl > 22;

  for (let i = 0; i < TARGETS.length; i++) {
    const t = TARGETS[i];
    if (!t.alive) continue;

    if (t.kind === 'tank') {
      // Trundle round the garrison perimeter, following the ground.
      t.orbA += t.orbDir * (t.spd / Math.max(t.orbR, 60)) * dt;
      const nx = t.orbX + Math.cos(t.orbA) * t.orbR, nz = t.orbZ + Math.sin(t.orbA) * t.orbR;
      t.hdg = Math.atan2(nx - t.x, -(nz - t.z));
      t.x = nx; t.z = nz;
      t.y = heightAt(nx, nz);
      t.group.position.set(t.x, t.y, t.z);
      t.group.rotation.y = -t.hdg;
      t.gyaw = -t.hdg;
    }

    const range = Math.hypot(ac.pos.x - t.x, ac.pos.z - t.z, ac.pos.y - (t.y + 2));
    if (t.dish) t.dish.rotation.y += dt * 0.7;

    if (!t.aa) continue;
    if (range > t.range * 1.6) continue;

    // Aim: lead the shot, and point the barrels at it whether firing or not.
    const tof = clamp(range / 620, 0, 2.2);
    _cv1.copy(ac.vel).multiplyScalar(tof).add(ac.pos);
    _cv2.set(_cv1.x - t.x, _cv1.y - (t.y + 2.6), _cv1.z - t.z);
    const flat = Math.hypot(_cv2.x, _cv2.z);
    const yaw = Math.atan2(_cv2.x, -_cv2.z), pitch = Math.atan2(_cv2.y, flat);
    // Local yaw has to undo whatever the parent group is already turned by,
    // which for a tank changes every step as it drives round its circuit.
    if (t.mount) {
      t.mount.rotation.y = -yaw - t.gyaw;
      if (t.barrels) t.barrels.rotation.x = -clamp(pitch, -0.2, 1.35);
    }
    if (t.turret) t.turret.rotation.y = -yaw - t.gyaw;

    if (!shootable || range > t.range) { t.burst = 0; continue; }

    t.fireT -= dt;
    t.think -= dt;
    if (t.think <= 0) {
      t.think = 0.12;
      // Nothing shoots through a hill.
      let blocked = false;
      for (let s = 1; s <= 3; s++) {
        const u = s / 4;
        const sx = t.x + (ac.pos.x - t.x) * u, sz = t.z + (ac.pos.z - t.z) * u;
        if (heightAt(sx, sz) > t.y + 3 + (ac.pos.y - t.y - 3) * u + 12) { blocked = true; break; }
      }
      t.blocked = blocked;
      // A gun that has just picked you up takes a moment to lay on, which is
      // what gives a single diving pass a chance of getting out again.
      if (blocked || range > t.range) t.acq = 0;
      else t.acq = (t.acq || 0) + 0.12;
      if (!blocked && t.burst <= 0 && t.aim <= 0 && t.acq > 0.7) {
        t.burst = t.kind === 'aa' ? 4 + Math.floor(Math.random() * 3) : 3;
        t.aim = 0;
      }
    }
    if (t.blocked) continue;

    if (t.burst > 0 && t.fireT <= 0) {
      t.fireT = t.kind === 'aa' ? 0.12 : 0.16;
      t.burst--;
      // Loose dispersion on purpose. A gun laying perfectly on a predicted point
      // kills a straight-flying aeroplane in four seconds, which is not a game;
      // at this spread the hit rate falls off with the square of the range, so
      // strafing low is lethal and crossing high is only expensive.
      const spread = t.kind === 'aa' ? 0.030 : 0.045;
      const l = _cv2.length() || 1;
      const mx = t.x + (_cv2.x / l) * 5, my = t.y + 2.6 + (_cv2.y / l) * 5, mz = t.z + (_cv2.z / l) * 5;
      fireBullet(mx, my, mz, _cv2.x / l, _cv2.y / l, _cv2.z / l,
        t.kind === 'aa' ? 620 : 540, 1, t.kind === 'aa' ? 7 : 4, spread, 3.2, 0, 0, 0);
      audio.aa(range, t.kind === 'aa');
      if (t.kind === 'aa' && t.burst === 0) {
        // Flak, bursting short of you — the reason to stop flying straight.
        for (let k = 0; k < 2; k++) {
          const u = 0.72 + Math.random() * 0.3;
          spawnPart(K_FLAK,
            t.x + (_cv1.x - t.x) * u + (Math.random() - 0.5) * 70,
            t.y + 2.6 + (_cv1.y - t.y - 2.6) * u + (Math.random() - 0.5) * 60,
            t.z + (_cv1.z - t.z) * u + (Math.random() - 0.5) * 70,
            0, 1.5, 0, 1.3 + Math.random() * 0.8, 2.0 + Math.random() * 1.4);
        }
      }
      if (t.burst === 0) t.aim = 1.6 + Math.random() * 1.8;
    }
    if (t.aim > 0) t.aim -= dt;
  }
}

/* --- bullets in flight --------------------------------------------------- */
function stepBullets(dt) {
  for (let i = 0; i < BMAX; i++) {
    if (!bOn[i]) continue;
    bT[i] -= dt;
    if (bT[i] <= 0) { bOn[i] = 0; continue; }
    const px = bX[i], py = bY[i], pz = bZ[i];
    bVY[i] -= 9.81 * dt * 0.35;                    // a little droop over range
    const dx = bVX[i] * dt, dy = bVY[i] * dt, dz = bVZ[i] * dt;
    const nx = px + dx, ny = py + dy, nz = pz + dz;
    let dead = 0;

    if (bSide[i] === 0) {
      for (let e = 0; e < EMAX && !dead; e++) {
        const f = foes[e];
        if (!f.on) continue;
        if (segMiss(px, py, pz, dx, dy, dz, f.pos.x, f.pos.y, f.pos.z) < 42) {
          f.hp -= bD[i];
          sparks(nx, ny, nz, 4);
          audio.hitConfirm();
          WAR.hitCount++;
          WAR.confirmT = clock;
          if (f.hp <= 0) killFoe(f);
          dead = 1;
        }
      }
      if (!dead && ny < 620) {
        for (let g = 0; g < TARGETS.length && !dead; g++) {
          const t = TARGETS[g];
          if (!t.alive) continue;
          if (Math.abs(nx - t.x) > 220 || Math.abs(nz - t.z) > 220) continue;
          const rr = t.r * t.r;
          if (segMiss(px, py, pz, dx, dy, dz, t.x, t.y + t.r * 0.45, t.z) < rr) {
            t.hp -= bD[i];
            t.hitT = clock;
            sparks(nx, ny, nz, 3);
            audio.hitConfirm();
            WAR.hitCount++;
            WAR.confirmT = clock;
            if (t.hp <= 0) killTarget(t);
            dead = 1;
          }
        }
      }
    } else if (!ac.crashed) {
      if (segMiss(px, py, pz, dx, dy, dz, ac.pos.x, ac.pos.y, ac.pos.z) < 21) {
        hurt(bD[i], 'SHOT DOWN — THE AIRFRAME GAVE UP');
        sparks(nx, ny, nz, 4);
        audio.impact(0);
        dead = 1;
      }
    }

    if (!dead && ny < 900 && ny < heightAt(nx, nz)) {
      spawnPart(K_SMOKE, nx, Math.max(ny, 0) + 1, nz, 0, 3.5, 0, 0.5, 0.9);
      sparks(nx, Math.max(ny, 0) + 0.5, nz, 2);
      audio.impact(ac.pos.distanceTo(_cv1.set(nx, ny, nz)));
      dead = 1;
    }
    if (dead) { bOn[i] = 0; continue; }
    bX[i] = nx; bY[i] = ny; bZ[i] = nz;
  }
}

function stepParts(dt) {
  for (let i = 0; i < PMAX; i++) {
    if (!pOn[i]) continue;
    pT[i] -= dt;
    if (pT[i] <= 0) { pOn[i] = 0; continue; }
    const k = pKind[i];
    if (k === K_DEBRIS) pVY[i] -= 9.81 * dt;
    else if (k === K_FIRE) { pVY[i] += 6 * dt; pVX[i] *= 1 - 2.2 * dt; pVZ[i] *= 1 - 2.2 * dt; }
    else if (k === K_SMOKE) { pVY[i] += 2.4 * dt; pVX[i] *= 1 - 0.7 * dt; pVZ[i] *= 1 - 0.7 * dt; }
    else if (k === K_SPARK) { pVY[i] -= 14 * dt; pVX[i] *= 1 - 3 * dt; pVZ[i] *= 1 - 3 * dt; }
    else { pVX[i] *= 1 - 0.9 * dt; pVZ[i] *= 1 - 0.9 * dt; }
    pX[i] += pVX[i] * dt; pY[i] += pVY[i] * dt; pZ[i] += pVZ[i] * dt;
  }
}

/* --- rearming, and what the sortie is doing ------------------------------ */
function stepWar(dt) {
  // Nearest fighter, for the engine note and the HUD.
  WAR.nearFoe = 9999;
  WAR.live = 0;
  for (let i = 0; i < EMAX; i++) {
    const f = foes[i];
    if (!f.on) continue;
    WAR.live++;
    const d = f.pos.distanceTo(ac.pos);
    if (d < WAR.nearFoe) { WAR.nearFoe = d; WAR.nearFoeClose = f.spd; }
  }
  WAR.targetsLeft = 0;
  for (let i = 0; i < TARGETS.length; i++) if (TARGETS[i].alive) WAR.targetsLeft++;

  // Supply. The kind is picked from whatever you are shortest of, so a drop is
  // usually the thing you actually need rather than a lottery.
  if (!ac.crashed && !ac.onGround) {
    WAR.dropT -= dt;
    const hullFrac = ac.hp / HULL;
    if (!WAR.medevac && hullFrac < 0.35) {
      WAR.medevac = true;
      if (spawnDrop(PK_HULL, true)) flash('HULL REPAIR DROPPED AHEAD — FLY THROUGH IT');
    } else if (WAR.dropT <= 0) {
      WAR.dropT = 48 + Math.random() * 34;
      const ordLow = (ac.ordAmmo[O_CANNON] + ac.ordAmmo[O_ROCKET] * 3 + ac.ordAmmo[O_BOMB] * 8) < 46;
      const kind = hullFrac < 0.7 ? PK_HULL
        : ac.ammo < GUN.AMMO * 0.4 ? PK_AMMO
          : ordLow ? PK_ORD
            : [PK_HULL, PK_AMMO, PK_ORD][Math.floor(Math.random() * 3)];
      const d = spawnDrop(kind, false);
      if (d) {
        flash('SUPPLY DROP — ' + PK_KINDS[kind].name + ' UNDER A CHUTE, ' +
          Math.round(Math.hypot(d.x - ac.pos.x, d.z - ac.pos.z)) + ' M AHEAD');
      }
    }
  }

  // Fighters scramble from the garrison once you are airborne.
  if (WAR.phase === 'FIGHT' && WAR.spawned < WAR.quota && !ac.onGround && !ac.crashed) {
    WAR.spawnT -= dt;
    if (WAR.spawnT <= 0 && WAR.live < EMAX) {
      // Count it as airborne the moment it launches. The live count above was
      // taken before this, and without the increment the sortie can declare
      // itself complete in the same sub-step a fresh fighter takes off.
      if (spawnFoe()) WAR.live++;
      WAR.spawnT = 14 + Math.random() * 12;
      flash('FIGHTERS SCRAMBLING FROM ' + (WAR.zone ? WAR.zone.name : 'THE ISLAND'));
    }
  }

  if (WAR.phase === 'FIGHT' && WAR.done >= WAR.need && WAR.spawned >= WAR.quota && WAR.live === 0) {
    WAR.phase = 'CLEARED';
    WAR.score += 250;
    flash('SORTIE ' + WAR.wave + ' COMPLETE   +250 — LAND TO REARM');
  }

  // Landing rearms and patches you. It is also the only way to start the next
  // sortie, which is what makes a strip worth flying back to.
  const on = ac.onGround && !ac.crashed && stripAt(ac.pos.x, ac.pos.z) && Math.hypot(ac.vel.x, ac.vel.z) < 2.2;
  if (on) {
    const wasFull = WAR.rearm >= 5;
    WAR.rearm += dt;
    if (WAR.rearm >= 5 && !wasFull) {
      ac.ammo = GUN.AMMO; ac.heat = 0; ac.gunJam = false; ac.hp = HULL;
      for (let i = 0; i < ORD.length; i++) ac.ordAmmo[i] = ORD[i].max;
      if (WAR.phase === 'CLEARED') { startWave(WAR.wave + 1); }
      else flash('REARMED AND PATCHED — ' + ac.ammo + ' ROUNDS, FULL PYLONS, AIRFRAME 100%');
    }
  } else if (WAR.rearm > 0 && (!ac.onGround || Math.hypot(ac.vel.x, ac.vel.z) > 6)) {
    WAR.rearm = 0;
  }

  // Battle damage costs you engine and trails smoke.
  const hull = ac.hp / HULL;
  ac.power = 1 - clamp((0.62 - hull) / 0.62, 0, 1) * 0.42;
  if (hull < 0.62 && !ac.crashed) {
    ac.smokeT -= dt;
    if (ac.smokeT <= 0) {
      ac.smokeT = hull < 0.32 ? 0.06 : 0.14;
      spawnPart(K_SMOKE, ac.pos.x, ac.pos.y - 0.3, ac.pos.z,
        ac.vel.x * 0.08 + (Math.random() - 0.5) * 3, 1.4, ac.vel.z * 0.08 + (Math.random() - 0.5) * 3,
        1.2 + Math.random(), 1.3 + Math.random() * 1.3);
    }
  }
}

function stepCombat(dt) {
  stepGuns(dt);
  stepOrdFire(dt);
  stepOrd(dt);
  for (let i = 0; i < EMAX; i++) if (foes[i].on) stepFoe(foes[i], dt);
  stepGround(dt);
  stepDrops(dt);
  stepBullets(dt);
  stepParts(dt);
  stepWar(dt);
}

/* --- one write per frame, after the physics ------------------------------ */
const FIRE_HOT = new THREE.Color(0xffe49a), FIRE_MID = new THREE.Color(0xff8c26);
const FIRE_LOW = new THREE.Color(0x8c2a12), SMOKE_A = new THREE.Color(0x4a4d51);
const SMOKE_B = new THREE.Color(0xb9c3ca), FLAK_A = new THREE.Color(0x22242a);
const SPARK_C = new THREE.Color(0xfff6d0), DEBRIS_C = new THREE.Color(0x35302b);
const TR_OURS = new THREE.Color(0xfff0a8), TR_THEIRS = new THREE.Color(0xff7a34);
const TR_CANNON = new THREE.Color(0xfff6e0);

// An empty slot only has to be scaled away once, on the frame it empties.
const bShown = new Uint8Array(BMAX), pShown = new Uint8Array(PMAX), rShown = new Uint8Array(RMAX);
// A parked matrix for the pool that is not showing this instance.
const _cmHide = new THREE.Matrix4().compose(
  new THREE.Vector3(0, -9000, 0), new THREE.Quaternion(), new THREE.Vector3(0.0001, 0.0001, 0.0001));

function syncCombat() {
  // tracers — a streak drawn along the round's own velocity
  for (let i = 0; i < BMAX; i++) {
    if (!bOn[i]) {
      if (bShown[i]) {
        bShown[i] = 0;
        _cm.compose(_cv1.set(0, -9000, 0), _cq.identity(), _cs.set(0.0001, 0.0001, 0.0001));
        tracers.setMatrixAt(i, _cm);
      }
      continue;
    }
    bShown[i] = 1;
    const vx = bVX[i], vy = bVY[i], vz = bVZ[i];
    const sp = Math.hypot(vx, vy, vz) || 1;
    const big = bK[i] === B_CANNON;
    _cv2.set(vx / sp, vy / sp, vz / sp);
    _cv1.set(bX[i], bY[i], bZ[i]).addScaledVector(_cv2, big ? -8 : -7);
    _cq.setFromUnitVectors(NEG_Z, _cv2);
    // A shell is fatter than a bullet but not a fence panel across the view.
    _cs.set(big ? 1.7 : 1, big ? 1.7 : 1, clamp(sp * 0.022, 6, 17) * (big ? 0.9 : 1));
    tracers.setMatrixAt(i, _cm.compose(_cv1, _cq, _cs));
    tracers.setColorAt(i, bSide[i] ? TR_THEIRS : (big ? TR_CANNON : TR_OURS));
  }
  tracers.instanceMatrix.needsUpdate = true;
  if (tracers.instanceColor) tracers.instanceColor.needsUpdate = true;

  // particles — colour and size are both functions of age
  for (let i = 0; i < PMAX; i++) {
    if (!pOn[i]) {
      if (pShown[i]) {
        pShown[i] = 0;
        _cm.compose(_cv1.set(0, -9000, 0), _cq.identity(), _cs.set(0.0001, 0.0001, 0.0001));
        puffs.setMatrixAt(i, _cm);
      }
      continue;
    }
    pShown[i] = 1;
    const age = 1 - pT[i] / pMax[i], k = pKind[i], j = pJ[i];
    let s = pS[i];
    if (k === K_FIRE) {
      s *= (1 + age * 0.5) * (1 - age * 0.55) * j;
      _cc.copy(FIRE_HOT).lerp(FIRE_MID, Math.min(1, age * 3.4));
      if (age > 0.5) _cc.lerp(FIRE_LOW, (age - 0.5) * 2);
    } else if (k === K_SMOKE) {
      // Smoke starts as almost nothing and swells. It shares one instanced mesh
      // with the fire, and a puff born full-sized paints straight over the
      // fireball it is supposed to be rising out of.
      s *= (0.16 + age * 1.5) * (1 - age * 0.25) * j;
      _cc.copy(SMOKE_A).lerp(SMOKE_B, age);
      _cc.lerp(HORIZON, age * 0.6);
    } else if (k === K_SPARK) {
      s *= (1 - age * 0.8) * j;
      _cc.copy(SPARK_C);
    } else if (k === K_FLAK) {
      s *= (0.3 + age * 1.15) * j;
      _cc.copy(age < 0.12 ? FIRE_HOT : FLAK_A).lerp(HORIZON, age * 0.42);
    } else {
      s *= (1 - age * 0.4) * j;
      _cc.copy(DEBRIS_C);
    }
    _cs.set(s, s, s);
    _cv1.set(pX[i], pY[i], pZ[i]);
    _ce.set(age * 3 + j, age * 2.2, 0, 'YXZ');
    _cq.setFromEuler(_ce);
    puffs.setMatrixAt(i, _cm.compose(_cv1, _cq, _cs));
    puffs.setColorAt(i, _cc);
  }
  puffs.instanceMatrix.needsUpdate = true;
  if (puffs.instanceColor) puffs.instanceColor.needsUpdate = true;

  // rockets and bombs — both nose along the way they are actually travelling,
  // which is what makes a bomb visibly tip over as it falls
  for (let i = 0; i < RMAX; i++) {
    if (!rOn[i]) {
      if (rShown[i]) {
        rShown[i] = 0;
        _cm.compose(_cv1.set(0, -9000, 0), _cq.identity(), _cs.set(0.0001, 0.0001, 0.0001));
        rockets.setMatrixAt(i, _cm); bombs.setMatrixAt(i, _cm);
      }
      continue;
    }
    rShown[i] = 1;
    const sp = Math.hypot(rVX[i], rVY[i], rVZ[i]) || 1;
    _cv2.set(rVX[i] / sp, rVY[i] / sp, rVZ[i] / sp);
    _cq.setFromUnitVectors(NEG_Z, _cv2);
    _cv1.set(rX[i], rY[i], rZ[i]);
    _cs.set(1, 1, 1);
    _cm.compose(_cv1, _cq, _cs);
    if (rKind[i] === O_ROCKET) {
      rockets.setMatrixAt(i, _cm);
      bombs.setMatrixAt(i, _cmHide);
    } else {
      bombs.setMatrixAt(i, _cm);
      rockets.setMatrixAt(i, _cmHide);
    }
  }
  rockets.instanceMatrix.needsUpdate = true;
  bombs.instanceMatrix.needsUpdate = true;

  // supply drops, swinging under their canopies
  for (let i = 0; i < PKMAX; i++) {
    const d = drops[i];
    if (!d.on) continue;
    d.group.position.set(d.x, d.y, d.z);
    d.group.rotation.y = d.sway * d.spin;
    d.group.rotation.z = Math.sin(d.sway) * 0.16;
    d.group.rotation.x = Math.cos(d.sway * 0.8) * 0.13;
  }

  // fighters
  for (let i = 0; i < EMAX; i++) {
    const f = foes[i];
    if (!f.on) continue;
    f.mesh.position.copy(f.pos);
    _ce.set(Math.asin(clamp(f.fwd.y, -1, 1)), f.yaw, f.roll, 'YXZ');
    f.mesh.quaternion.setFromEuler(_ce);
  }
}

/* --------------------------------------------------------------------------
   Sound — every voice synthesised, nothing loaded.
   -------------------------------------------------------------------------- */
const audio = (() => {
  let ctx = null, eng1, eng2, engFilt, engGain, windGain, rumbleGain, hornGain, master;
  let foeOsc, foeOsc2, foeGain, foeFilt, alarmOsc, alarmGain;
  let noise = null;                 // one noise buffer, shared by every burst
  let lastGun = -1, lastFar = -1, lastImp = -1, lastAA = -1;
  function noiseBuffer(c, secs) {
    const buf = c.createBuffer(1, Math.round(c.sampleRate * secs), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  // Loudness with range. Gunfire and explosions a mile off should be a rumble,
  // not the same bang as one under the wing.
  function fall(d, r) { const u = clamp(1 - d / r, 0, 1); return u * u; }
  function start() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);

    engGain = ctx.createGain(); engGain.gain.value = 0;
    engFilt = ctx.createBiquadFilter(); engFilt.type = 'lowpass'; engFilt.frequency.value = 900;
    engGain.connect(engFilt); engFilt.connect(master);
    eng1 = ctx.createOscillator(); eng1.type = 'sawtooth'; eng1.frequency.value = 60;
    eng2 = ctx.createOscillator(); eng2.type = 'square'; eng2.frequency.value = 90;
    const e2g = ctx.createGain(); e2g.gain.value = 0.35;
    eng1.connect(engGain); eng2.connect(e2g); e2g.connect(engGain);
    eng1.start(); eng2.start();

    const wind = ctx.createBufferSource(); wind.buffer = noiseBuffer(ctx, 2); wind.loop = true;
    const wf = ctx.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 620; wf.Q.value = 0.7;
    windGain = ctx.createGain(); windGain.gain.value = 0;
    wind.connect(wf); wf.connect(windGain); windGain.connect(master); wind.start();

    const rum = ctx.createBufferSource(); rum.buffer = noiseBuffer(ctx, 2); rum.loop = true;
    const rf = ctx.createBiquadFilter(); rf.type = 'lowpass'; rf.frequency.value = 130;
    rumbleGain = ctx.createGain(); rumbleGain.gain.value = 0;
    rum.connect(rf); rf.connect(rumbleGain); rumbleGain.connect(master); rum.start();

    const horn = ctx.createOscillator(); horn.type = 'square'; horn.frequency.value = 780;
    hornGain = ctx.createGain(); hornGain.gain.value = 0;
    horn.connect(hornGain); hornGain.connect(master); horn.start();

    noise = noiseBuffer(ctx, 2);

    // A hostile engine, heard only when one is close. Two detuned saws beating
    // against each other is what makes it read as somebody else's aeroplane.
    foeGain = ctx.createGain(); foeGain.gain.value = 0;
    foeFilt = ctx.createBiquadFilter(); foeFilt.type = 'lowpass'; foeFilt.frequency.value = 700;
    foeGain.connect(foeFilt); foeFilt.connect(master);
    foeOsc = ctx.createOscillator(); foeOsc.type = 'sawtooth'; foeOsc.frequency.value = 78;
    foeOsc2 = ctx.createOscillator(); foeOsc2.type = 'sawtooth'; foeOsc2.frequency.value = 83;
    const fg2 = ctx.createGain(); fg2.gain.value = 0.6;
    foeOsc.connect(foeGain); foeOsc2.connect(fg2); fg2.connect(foeGain);
    foeOsc.start(); foeOsc2.start();

    // Damage alarm — a hard square tone, pulsed from update().
    alarmOsc = ctx.createOscillator(); alarmOsc.type = 'square'; alarmOsc.frequency.value = 440;
    alarmGain = ctx.createGain(); alarmGain.gain.value = 0;
    alarmOsc.connect(alarmGain); alarmGain.connect(master); alarmOsc.start();
  }
  function update(dt, t) {
    if (!ctx || ctx.state !== 'running') return;
    const now = ctx.currentTime, k = 0.08;
    const rpmN = (ac.rpm - 700) / 1900;
    eng1.frequency.setTargetAtTime(46 + ac.rpm * 0.052, now, k);
    eng2.frequency.setTargetAtTime(92 + ac.rpm * 0.104, now, k);
    engFilt.frequency.setTargetAtTime(600 + rpmN * 1500, now, k);
    engGain.gain.setTargetAtTime(frozen() ? 0 : (ac.crashed ? 0 : 0.055 + rpmN * 0.10), now, k);
    windGain.gain.setTargetAtTime(frozen() ? 0 : Math.min(0.16, (ac.vel.length() / 70) ** 2 * 0.16), now, k);
    const gs = ac.onGround ? Math.min(1, Math.hypot(ac.vel.x, ac.vel.z) / 30) : 0;
    rumbleGain.gain.setTargetAtTime(frozen() ? 0 : gs * 0.22, now, 0.05);
    let horn = 0;
    if (ac.stalling && !ac.onGround && !ac.crashed) horn = 0.05;
    else if (!ac.onGround && !ac.crashed && ac.alpha > (A_STALL + FLAPS[ac.flap].dStall) * 0.82) horn = (t % 0.5 < 0.25) ? 0.04 : 0;
    hornGain.gain.setTargetAtTime(frozen() ? 0 : horn, now, 0.02);

    // A fighter close aboard: pitch rises as it closes, and it drops away with
    // distance so you can hear one coming before you can see it.
    const fd = WAR.nearFoe;
    const near = fall(fd, 900);
    foeOsc.frequency.setTargetAtTime(72 + near * 46, now, 0.10);
    foeOsc2.frequency.setTargetAtTime(79 + near * 52, now, 0.10);
    foeFilt.frequency.setTargetAtTime(420 + near * 900, now, 0.10);
    foeGain.gain.setTargetAtTime(frozen() ? 0 : near * 0.085, now, 0.12);

    // Damage alarm: intermittent below 55%, solid below 25%.
    let al = 0;
    const hull = ac.hp / HULL;
    if (!ac.crashed && hull < 0.55) {
      alarmOsc.frequency.setTargetAtTime(hull < 0.25 ? 620 : 440, now, 0.05);
      al = hull < 0.25 ? ((t % 0.4 < 0.26) ? 0.035 : 0) : ((t % 1.1 < 0.16) ? 0.028 : 0);
    }
    alarmGain.gain.setTargetAtTime(frozen() ? 0 : al, now, 0.015);
  }
  // Filtered slice of the shared noise buffer. Nothing here allocates a buffer,
  // which matters when the guns are asking for sixteen of these a second.
  function burst(freq, Q, gain, decay, type) {
    if (!ctx || ctx.state !== 'running' || gain < 0.0015) return;
    const src = ctx.createBufferSource(); src.buffer = noise;
    src.playbackRate.value = 0.75 + Math.random() * 0.6;
    const f = ctx.createBiquadFilter();
    f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = Q;
    const g = ctx.createGain();
    const now = ctx.currentTime;
    g.gain.setValueAtTime(gain, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(now, Math.random() * 1.4); src.stop(now + decay + 0.05);
  }
  // A short pitched voice, optionally sliding — used for the hit chime and the
  // thump under a gun.
  function tone(f0, f1, dur, gain, type) {
    if (!ctx || ctx.state !== 'running' || gain < 0.0015) return;
    const o = ctx.createOscillator(); o.type = type || 'sine';
    const g = ctx.createGain();
    const now = ctx.currentTime;
    o.frequency.setValueAtTime(f0, now);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), now + dur);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(gain, now + Math.min(0.012, dur * 0.3));
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(master);
    o.start(now); o.stop(now + dur + 0.02);
  }
  // Voices are throttled by wall clock, not by round count: the guns fire at 16
  // rounds a second and no ear needs sixteen separate cracks.
  function rate(last, gap) {
    if (!ctx || ctx.state !== 'running') return -1;
    const now = ctx.currentTime;
    return now - last < gap ? -1 : now;
  }
  return {
    start, update,
    chirp: (vs) => burst(1300, 2.5, Math.min(0.5, 0.06 + vs * 0.09), 0.22),
    thud: () => burst(120, 0.8, 0.55, 0.9),
    // your own guns: a dry crack and a thump through the airframe
    gun: () => {
      const t = rate(lastGun, 0.055); if (t < 0) return;
      lastGun = t;
      burst(1500 + Math.random() * 700, 1.0, 0.22, 0.07);
      tone(190, 90, 0.07, 0.10, 'square');
    },
    // somebody else's guns, heard at range
    gunFar: (d) => {
      const t = rate(lastFar, 0.085); if (t < 0) return;
      lastFar = t;
      burst(900, 1.4, 0.16 * fall(d, 1100), 0.09);
    },
    aa: (d, heavy) => {
      const t = rate(lastAA, heavy ? 0.10 : 0.14); if (t < 0) return;
      lastAA = t;
      burst(heavy ? 78 : 210, 0.7, (heavy ? 0.42 : 0.20) * fall(d, 2800), heavy ? 0.34 : 0.16, 'lowpass');
    },
    impact: (d) => {
      const t = rate(lastImp, 0.05); if (t < 0) return;
      lastImp = t;
      burst(2400, 1.6, 0.20 * fall(d, 800) + (d < 1 ? 0.12 : 0), 0.08);
    },
    hitConfirm: () => tone(1240, 1560, 0.07, 0.045, 'triangle'),
    // collecting a supply drop: two rising notes, unmistakably a good thing
    pickup: () => { tone(660, 990, 0.16, 0.05, 'sine'); tone(990, 1480, 0.22, 0.04, 'triangle'); },
    // the cannon: a deeper, slower thump than the machine guns
    cannon: () => { burst(420, 1.1, 0.30, 0.16, 'lowpass'); tone(120, 58, 0.16, 0.16, 'square'); },
    // a rocket motor lighting, and the clunk of a bomb leaving the rack
    rocket: () => { burst(900, 0.5, 0.26, 0.45); tone(240, 90, 0.4, 0.09, 'sawtooth'); },
    release: () => tone(300, 150, 0.10, 0.07, 'square'),
    explode: (d, size) => {
      const g = fall(d, 3400);
      burst(66, 0.6, 0.70 * g * Math.min(1.4, size), 0.55 + size * 0.5, 'lowpass');
      burst(320, 0.9, 0.30 * g, 0.30 + size * 0.25);
      tone(140, 42, 0.45 + size * 0.3, 0.16 * g, 'square');
    }
  };
})();

/* --------------------------------------------------------------------------
   Instrument panel — a 2D overlay. Static parts are cached; only the moving
   elements are redrawn each frame.
   -------------------------------------------------------------------------- */

const hud = document.getElementById('hud');
const hc = hud.getContext('2d');
const still = document.createElement('canvas');
const sc = still.getContext('2d');
let W = 0, H = 0, DPR = 1, panelTop = 0, dialR = 44, dials = [];

const INK = '#e8edf1', DIM = '#8b98a3', FACE = '#14181c', BEZEL = '#0b0d0f';

function layout() {
  DPR = Math.min(devicePixelRatio || 1, 1.75);
  W = innerWidth; H = innerHeight;
  hud.width = still.width = Math.round(W * DPR);
  hud.height = still.height = Math.round(H * DPR);
  hc.setTransform(DPR, 0, 0, DPR, 0, 0);
  sc.setTransform(DPR, 0, 0, DPR, 0, 0);

  const panelH = clamp(H * 0.30, 150, 250);
  panelTop = H - panelH;
  dialR = clamp(Math.min(panelH * 0.29, W / 17), 24, 58);
  const gapX = dialR * 2.55;
  const cy = panelTop + panelH * 0.50;
  const total = gapX * 5;
  const x0 = W / 2 - total / 2;
  dials = ['asi', 'ai', 'alt', 'vsi', 'hdg', 'pwr'].map((id, i) => ({ id, x: x0 + gapX * i, y: cy }));

  drawStill();
}

// Bezel, face and the name of the instrument — the label sits above the glass
// so nothing on the dial has to share space with it.
function ring(g, d, label) {
  g.save(); g.translate(d.x, d.y);
  g.beginPath(); g.arc(0, 0, dialR + 5, 0, TAU); g.fillStyle = BEZEL; g.fill();
  g.strokeStyle = '#39434b'; g.lineWidth = 1.5; g.stroke();
  const face = g.createRadialGradient(-dialR * 0.3, -dialR * 0.4, dialR * 0.1, 0, 0, dialR);
  face.addColorStop(0, '#1e242a'); face.addColorStop(1, '#0f1317');
  g.beginPath(); g.arc(0, 0, dialR, 0, TAU); g.fillStyle = face; g.fill();
  g.font = '600 ' + Math.round(clamp(dialR * 0.23, 9, 13)) + 'px sans-serif';
  g.fillStyle = DIM; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(label, 0, -(dialR + 14));
  g.restore();
}
// A soft highlight across the top-left of the glass, drawn last.
function glass(g, d) {
  g.save(); g.translate(d.x, d.y);
  g.beginPath(); g.arc(0, 0, dialR, 0, TAU); g.clip();
  const sh = g.createLinearGradient(-dialR, -dialR, dialR * 0.3, dialR * 0.6);
  sh.addColorStop(0, 'rgba(210,235,255,0.13)');
  sh.addColorStop(0.55, 'rgba(210,235,255,0.02)');
  sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = sh; g.fillRect(-dialR, -dialR, dialR * 2, dialR * 2);
  g.restore();
}
function tick(g, ang, r0, r1, w, col) {
  g.beginPath();
  g.moveTo(Math.cos(ang) * r0, Math.sin(ang) * r0);
  g.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
  g.lineWidth = w; g.strokeStyle = col; g.stroke();
}

function drawStill() {
  sc.clearRect(0, 0, W, H);
  const panelH = H - panelTop;

  // Windscreen posts. Thin, so they frame the view instead of boxing it in.
  const post = sc.createLinearGradient(0, 0, 0, panelTop);
  post.addColorStop(0, '#2a3138'); post.addColorStop(1, '#14181c');
  sc.fillStyle = post;
  sc.beginPath();
  sc.moveTo(0, 0); sc.lineTo(W * 0.045, 0); sc.lineTo(0, panelTop * 0.86); sc.closePath(); sc.fill();
  sc.beginPath();
  sc.moveTo(W, 0); sc.lineTo(W * 0.955, 0); sc.lineTo(W, panelTop * 0.86); sc.closePath(); sc.fill();

  // Coaming
  const g1 = sc.createLinearGradient(0, panelTop - 26, 0, H);
  g1.addColorStop(0, '#252b31'); g1.addColorStop(0.10, '#1a1f24'); g1.addColorStop(1, '#0e1216');
  sc.fillStyle = g1;
  sc.beginPath();
  sc.moveTo(0, panelTop + 6);
  sc.quadraticCurveTo(W * 0.5, panelTop - panelH * 0.16, W, panelTop + 6);
  sc.lineTo(W, H); sc.lineTo(0, H); sc.closePath(); sc.fill();
  sc.strokeStyle = 'rgba(180,205,225,0.30)'; sc.lineWidth = 2;
  sc.beginPath();
  sc.moveTo(0, panelTop + 6);
  sc.quadraticCurveTo(W * 0.5, panelTop - panelH * 0.16, W, panelTop + 6);
  sc.stroke();

  for (const d of dials) {
    if (d.id === 'asi') {
      ring(sc, d, 'AIRSPEED KT');
      sc.save(); sc.translate(d.x, d.y);
      const a = (kt) => (-90 + (kt / 200) * 330) * DEG;   // zero at the top, like the real thing
      sc.lineCap = 'butt';
      // green operating arc, white flap arc, red radial at the stall
      sc.beginPath(); sc.arc(0, 0, dialR * 0.87, a(55), a(140)); sc.lineWidth = dialR * 0.09; sc.strokeStyle = '#3f8f4e'; sc.stroke();
      sc.beginPath(); sc.arc(0, 0, dialR * 0.76, a(44), a(88)); sc.lineWidth = dialR * 0.06; sc.strokeStyle = '#cfd8de'; sc.stroke();
      tick(sc, a(48), dialR * 0.66, dialR * 0.95, 3, '#d8452f');
      for (let kt = 0; kt <= 200; kt += 20) {
        tick(sc, a(kt), dialR * 0.74, dialR * 0.94, kt % 40 ? 1.2 : 2.2, kt % 40 ? DIM : INK);
        if (kt % 40 === 0 && kt > 0) {
          sc.font = Math.round(dialR * 0.22) + 'px sans-serif'; sc.fillStyle = INK;
          sc.textAlign = 'center'; sc.textBaseline = 'middle';
          sc.fillText(String(kt), Math.cos(a(kt)) * dialR * 0.56, Math.sin(a(kt)) * dialR * 0.56);
        }
      }
      sc.restore();
    } else if (d.id === 'ai') {
      ring(sc, d, 'ATTITUDE');
    } else if (d.id === 'alt') {
      ring(sc, d, 'ALTITUDE FT');
      sc.save(); sc.translate(d.x, d.y);
      for (let i = 0; i < 50; i++) {
        const ang = (-90 + i * 7.2) * DEG;
        tick(sc, ang, dialR * (i % 5 ? 0.80 : 0.72), dialR * 0.92, i % 5 ? 1 : 2.2, i % 5 ? DIM : INK);
      }
      sc.font = Math.round(dialR * 0.22) + 'px sans-serif'; sc.fillStyle = INK;
      sc.textAlign = 'center'; sc.textBaseline = 'middle';
      for (let i = 0; i < 10; i++) {
        const ang = (-90 + i * 36) * DEG;
        sc.fillText(String(i), Math.cos(ang) * dialR * 0.55, Math.sin(ang) * dialR * 0.55);
      }
      sc.restore();
    } else if (d.id === 'vsi') {
      ring(sc, d, 'VERT SPD');
      sc.save(); sc.translate(d.x, d.y);
      for (let v = -2; v <= 2; v += 0.5) {
        const ang = (180 + v * 80) * DEG;
        tick(sc, ang, dialR * (v % 1 ? 0.80 : 0.72), dialR * 0.92, v % 1 ? 1 : 2.2, v % 1 ? DIM : INK);
        if (v % 1 === 0) {
          sc.font = Math.round(dialR * 0.21) + 'px sans-serif'; sc.fillStyle = INK;
          sc.textAlign = 'center'; sc.textBaseline = 'middle';
          sc.fillText(String(Math.abs(v)), Math.cos(ang) * dialR * 0.54, Math.sin(ang) * dialR * 0.54);
        }
      }
      sc.font = Math.round(dialR * 0.17) + 'px sans-serif'; sc.fillStyle = DIM;
      sc.fillText('x1000 FPM', 0, -dialR * 0.42);
      sc.restore();
    } else if (d.id === 'hdg') {
      ring(sc, d, 'HEADING');
    } else {
      ring(sc, d, 'POWER');
      sc.save(); sc.translate(d.x, d.y);
      sc.font = Math.round(dialR * 0.18) + 'px sans-serif'; sc.fillStyle = DIM;
      sc.textAlign = 'center'; sc.textBaseline = 'middle';
      sc.fillText('THR', -dialR * 0.42, -dialR * 0.72);
      sc.fillText('FLAP', dialR * 0.44, -dialR * 0.72);
      sc.restore();
    }
  }
}

/* Where a world point lands on the screen, or ok:false if it is behind you.
   Reused scratch — drawHud allocates nothing. */
const _scr = { x: 0, y: 0, ok: false };
const _camF = new THREE.Vector3(), _pv = new THREE.Vector3();
function toScreen(x, y, z) {
  _camF.set(0, 0, -1).applyQuaternion(camera.quaternion);
  _pv.set(x - camera.position.x, y - camera.position.y, z - camera.position.z);
  if (_pv.dot(_camF) <= 1) { _scr.ok = false; return _scr; }
  _pv.set(x, y, z).project(camera);
  _scr.x = (_pv.x * 0.5 + 0.5) * W;
  _scr.y = (-_pv.y * 0.5 + 0.5) * H;
  _scr.ok = true;
  return _scr;
}

// The bottom of the visible glass at a given x. The coaming is a quadratic
// curve that rises in the middle of the screen, so a marker parked at panelTop
// disappears behind it exactly where the pilot is looking.
function glassBottom(px) {
  const panelH = H - panelTop, t = clamp(px / W, 0, 1);
  return panelTop + 6 - 2 * t * (1 - t) * (6 + 0.16 * panelH) - 4;
}

function bar(g, x, y, w, h, frac, col) {
  g.fillStyle = 'rgba(6,9,12,0.75)'; g.fillRect(x, y, w, h);
  g.fillStyle = col; g.fillRect(x + 1, y + 1, Math.max(0, (w - 2) * clamp(frac, 0, 1)), h - 2);
  g.strokeStyle = 'rgba(120,140,158,0.55)'; g.lineWidth = 1;
  g.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

/* Layout figures for the glass overlays. One shared record, rewritten in place
   each frame, so the row helpers below can be plain functions instead of
   closures rebuilt sixty times a second. The font strings are rebuilt only when
   the type size actually changes, which is on resize. */
const LAY = {
  fs: 0, fsm: 0, lh: 0, padX: 0, padY: 0, bw: 0, x: 0, y: 0,
  head: '', row: '',
  SUB: '#a4b4c1',                 // brighter than DIM: these blocks sit over sky
  PANEL: 'rgba(9,13,17,0.56)'
};

function layoutHud() {
  const fs = Math.round(clamp(W * 0.011, 11, 16));
  if (LAY.fs !== fs) {
    LAY.fs = fs;
    LAY.fsm = Math.max(9, Math.round(fs * 0.92));
    LAY.lh = Math.round(fs * 1.72);
    LAY.padX = Math.round(fs * 0.9);
    LAY.padY = Math.round(fs * 0.55);
    LAY.head = '700 ' + fs + 'px sans-serif';
    LAY.row = '600 ' + LAY.fsm + 'px sans-serif';
  }
  LAY.bw = clamp(W * 0.205, 198, 272);
  LAY.x = clamp(W * 0.09, 20, 118);
  LAY.y = clamp(H * 0.045, 18, 70);
}

// Centre of row i inside a block whose top edge is at y.
function rowY(y, i) { return y + LAY.padY + LAY.lh * (i + 0.5); }

// A label / bar / value row, laid out so the three can never overlap.
function gauge(g, x, y, i, label, labelCol, value, frac, barCol) {
  const cy = rowY(y, i), fs = LAY.fs;
  const labelW = fs * 3.1, valueW = fs * 3.0, gap = fs * 0.55;
  g.font = LAY.row;
  g.textAlign = 'left';
  g.fillStyle = labelCol;
  g.fillText(label, x + LAY.padX, cy);
  g.textAlign = 'right';
  g.fillText(value, x + LAY.bw - LAY.padX, cy);
  g.textAlign = 'left';
  const barX = x + LAY.padX + labelW + gap;
  const barW = LAY.bw - LAY.padX * 2 - labelW - valueW - gap * 2;
  const barH = Math.max(6, Math.round(fs * 0.46));
  if (barW > 20) bar(g, barX, Math.round(cy - barH / 2), barW, barH, frac, barCol);
}

/* --------------------------------------------------------------------------
   The scope — north-up, five kilometres across. A dogfight spends most of its
   time with the other aeroplane somewhere behind your head, and a windscreen
   cannot tell you that. Fighters past the edge are pinned to the rim as hollow
   marks, so one you cannot see still tells you which way to look.
   -------------------------------------------------------------------------- */

const MAP_RANGE = 5000;

// A filled arrowhead pointing along `ang` (a game heading: 0 = north).
function blip(g, x, y, s, ang, fill, stroke) {
  const c = Math.cos(ang), sn = Math.sin(ang);
  // nose along the heading, two barbs behind it
  g.beginPath();
  g.moveTo(x + sn * s, y - c * s);
  g.lineTo(x - c * s * 0.72 - sn * s * 0.6, y - sn * s * 0.72 + c * s * 0.6);
  g.lineTo(x + c * s * 0.72 - sn * s * 0.6, y + sn * s * 0.72 + c * s * 0.6);
  g.closePath();
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1.3; g.stroke(); }
}

function drawMinimap(t) {
  const r = clamp(Math.min(W, H) * 0.108, 44, 98);
  const cx = W - r - clamp(W * 0.024, 12, 34);
  const cy = panelTop - r - clamp(H * 0.035, 14, 32);
  if (cy - r < 6 || cx - r < W * 0.34) return;      // no room in a small window
  const k = r / MAP_RANGE;
  const px = ac.pos.x, pz = ac.pos.z;
  const mcx = cx - px * k, mcy = cy - pz * k;        // world → scope, inlined so
  // the frame loop is not building closures to do two multiplications

  hc.save();
  hc.beginPath(); hc.arc(cx, cy, r, 0, TAU);
  hc.fillStyle = 'rgba(7,11,15,0.62)'; hc.fill();
  hc.save();
  hc.clip();

  // the town, as the one landmark big enough to navigate by
  hc.beginPath(); hc.arc(mcx + CITY.x * k, mcy + CITY.z * k, CITY.r * k, 0, TAU);
  hc.fillStyle = 'rgba(120,134,146,0.30)'; hc.fill();

  // the strips: a stroke along the runway, so their direction reads too
  hc.lineWidth = 2; hc.strokeStyle = 'rgba(210,226,238,0.85)';
  for (let i = 0; i < STRIPS.length; i++) {
    const s = STRIPS[i], h = s.len * 0.5 * k + 1.5;
    hc.beginPath();
    hc.moveTo(mcx + s.x * k - s.fx * h, mcy + s.z * k - s.fz * h);
    hc.lineTo(mcx + s.x * k + s.fx * h, mcy + s.z * k + s.fz * h);
    hc.stroke();
  }

  // the garrison this sortie is about, ringed
  if (WAR.zone && WAR.phase === 'FIGHT') {
    hc.setLineDash([3, 3]);
    hc.strokeStyle = 'rgba(240,194,74,0.55)'; hc.lineWidth = 1;
    hc.beginPath(); hc.arc(mcx + WAR.zone.x * k, mcy + WAR.zone.z * k, 1250 * k, 0, TAU); hc.stroke();
    hc.setLineDash([]);
  }

  // installations. Anything that shoots is marked hotter than anything that
  // only sits there, because that is the difference that matters on a run in.
  for (let i = 0; i < TARGETS.length; i++) {
    const g = TARGETS[i];
    if (!g.alive) continue;
    const inZone = WAR.zone && g.zone === WAR.zone.key && WAR.phase === 'FIGHT';
    const x = mcx + g.x * k, y = mcy + g.z * k;
    if (Math.abs(x - cx) > r || Math.abs(y - cy) > r) continue;
    if (g.aa) {
      hc.fillStyle = inZone ? 'rgba(255,138,92,0.95)' : 'rgba(198,120,92,0.45)';
      hc.beginPath(); hc.arc(x, y, inZone ? 2.4 : 1.7, 0, TAU); hc.fill();
    } else {
      hc.fillStyle = inZone ? 'rgba(240,194,74,0.95)' : 'rgba(168,176,182,0.45)';
      const w = inZone ? 1.9 : 1.4;
      hc.fillRect(x - w, y - w, w * 2, w * 2);
    }
  }

  // supply drops: a small mark in their own colour, because they are worth a turn
  for (let i = 0; i < PKMAX; i++) {
    const d = drops[i];
    if (!d.on) continue;
    const dx = d.x - px, dz = d.z - pz;
    if (Math.hypot(dx, dz) > MAP_RANGE) continue;
    const sx = cx + dx * k, sy = cy + dz * k;
    hc.strokeStyle = PK_KINDS[d.kind].hud; hc.lineWidth = 1.4;
    hc.beginPath();
    hc.moveTo(sx - 3, sy); hc.lineTo(sx + 3, sy);
    hc.moveTo(sx, sy - 3); hc.lineTo(sx, sy + 3);
    hc.stroke();
    hc.beginPath(); hc.arc(sx, sy, 4.2, Math.PI, TAU); hc.stroke();   // the canopy
  }

  // fighters, pointing where they are pointing
  for (let i = 0; i < EMAX; i++) {
    const f = foes[i];
    if (!f.on) continue;
    const dx = f.pos.x - px, dz = f.pos.z - pz;
    const d = Math.hypot(dx, dz);
    const hurt = f.hp < 58;
    if (d <= MAP_RANGE) {
      blip(hc, cx + dx * k, cy + dz * k, r * 0.095, -f.yaw,
        hurt ? '#ff8a5c' : '#ff5b3d', 'rgba(12,16,20,0.8)');
      // a short tail behind it, which is what makes a turn readable
      hc.strokeStyle = 'rgba(255,91,61,0.5)'; hc.lineWidth = 1;
      hc.beginPath();
      hc.moveTo(cx + dx * k, cy + dz * k);
      hc.lineTo(cx + dx * k - f.fwd.x * r * 0.20, cy + dz * k - f.fwd.z * r * 0.20);
      hc.stroke();
    } else {
      // beyond the scope: pinned to the rim, hollow
      const ux = dx / d, uz = dz / d;
      blip(hc, cx + ux * (r - 6), cy + uz * (r - 6), r * 0.075,
        Math.atan2(ux, -uz), null, hurt ? '#ff8a5c' : '#ff5b3d');
    }
  }
  hc.restore();

  // rings, cardinal mark and the aeroplane itself, all drawn over the clip
  hc.strokeStyle = 'rgba(150,200,235,0.30)'; hc.lineWidth = 1;
  hc.beginPath(); hc.arc(cx, cy, r * 0.5, 0, TAU); hc.stroke();
  hc.strokeStyle = 'rgba(170,210,238,0.65)'; hc.lineWidth = 1.5;
  hc.beginPath(); hc.arc(cx, cy, r, 0, TAU); hc.stroke();

  let hdg = (-_hudE.setFromQuaternion(ac.quat, 'YXZ').y / DEG) % 360;
  if (hdg < 0) hdg += 360;
  blip(hc, cx, cy, r * 0.115, hdg * DEG, '#f5c542', 'rgba(12,16,20,0.9)');

  // Both labels go inside the glass: the caption used to sit on the sky below
  // the ring, where it was grey type on pale blue and unreadable.
  hc.textAlign = 'center'; hc.textBaseline = 'middle';
  hc.font = '600 ' + Math.round(clamp(r * 0.19, 8, 13)) + 'px sans-serif';
  hc.fillStyle = 'rgba(200,222,238,0.8)';
  hc.fillText('N', cx, cy - r + clamp(r * 0.16, 7, 12));
  hc.fillStyle = WAR.live ? '#ff8a5c' : 'rgba(190,208,222,0.7)';
  hc.fillText(WAR.live ? WAR.live + (WAR.live > 1 ? ' FIGHTERS' : ' FIGHTER') : (MAP_RANGE / 1000) + ' KM',
    cx, cy + r - clamp(r * 0.16, 7, 12));
  hc.restore();
}

function drawHud(t) {
  hc.clearRect(0, 0, W, H);

  const nearest = nearestStrip();
  const _eu = _hudE.setFromQuaternion(ac.quat, 'YXZ');
  const bank = _eu.z, pitchA = _eu.x;
  let hdg = (-_eu.y / DEG) % 360; if (hdg < 0) hdg += 360;

  // --- glass-area overlays (above the panel) ------------------------------
  // Everything here hangs off one grid computed in layoutHud(). The type scales
  // with the window, so every offset has to be derived from the type size:
  // hard-coded row pitches collapse into each other the moment the font grows,
  // and a gauge bar laid out in fixed pixels ends up drawn straight through its
  // own label.
  layoutHud();
  const fs = LAY.fs, fsm = LAY.fsm, lh = LAY.lh, padX = LAY.padX, padY = LAY.padY;
  const blockW = LAY.bw, blockX = LAY.x, blockY = LAY.y;
  const FONT_HEAD = LAY.head, FONT_ROW = LAY.row, SUB = LAY.SUB, PANEL = LAY.PANEL;
  hc.textBaseline = 'middle';
  let leftBottom = blockY;                           // filled in by the sortie block

  // nearest strip block, top left
  {
    let brg = (Math.atan2(nearest.strip.x - ac.pos.x, -(nearest.strip.z - ac.pos.z)) / DEG) % 360;
    if (brg < 0) brg += 360;
    const x = blockX, y = blockY, bh = padY * 2 + lh * 3;
    hc.fillStyle = PANEL; hc.fillRect(x, y, blockW, bh);
    hc.fillStyle = 'rgba(150,200,235,0.55)'; hc.fillRect(x, y, 3, bh);
    hc.textAlign = 'left';
    hc.font = FONT_HEAD; hc.fillStyle = INK;
    hc.fillText(nearest.strip.name, x + padX, rowY(y, 0));
    hc.font = FONT_ROW; hc.fillStyle = SUB;
    hc.fillText('BRG ' + String(Math.round(brg)).padStart(3, '0') + '°   ' + (nearest.dist * NM).toFixed(1) + ' NM',
      x + padX, rowY(y, 1));
    hc.fillText('ELEV ' + Math.round(nearest.strip.elev * FT) + ' FT   RWY ' + String(Math.round(nearest.strip.hdg / 10) || 36).padStart(2, '0'),
      x + padX, rowY(y, 2));
  }

  // score block, top right. It gets the same slab as the left-hand blocks:
  // bare grey type over a pale sky is not readable, and this corner spends most
  // of its life against sky.
  {
    const bs = best[nearest.strip.id];
    const right = W - blockX, x = right - blockW, y = blockY;
    const bh = padY * 2 + lh * (paused ? 6 : 5);
    hc.fillStyle = PANEL; hc.fillRect(x, y, blockW, bh);
    hc.fillStyle = 'rgba(240,194,74,0.55)'; hc.fillRect(right - 3, y, 3, bh);
    hc.textAlign = 'right';
    const tx = right - padX;
    hc.font = FONT_HEAD; hc.fillStyle = '#f0c24a';
    hc.fillText('SCORE  ' + WAR.score, tx, rowY(y, 0));
    hc.font = FONT_ROW; hc.fillStyle = SUB;
    hc.fillText('KILLS  ' + WAR.kills + '   ·   TARGETS LEFT  ' + WAR.targetsLeft, tx, rowY(y, 1));
    hc.fillText('BEST LANDING HERE  ' + (bs === undefined ? '—' : bs), tx, rowY(y, 2));
    hc.fillText(view === 'cockpit' ? 'COCKPIT  [V]' : 'CHASE  [V]', tx, rowY(y, 3));
    hc.fillStyle = '#a8cbe4'; hc.fillText('H — HOW TO PLAY   ·   T — THE STORY', tx, rowY(y, 4));
    if (paused) { hc.fillStyle = '#f0c24a'; hc.fillText('PAUSED  [P]', tx, rowY(y, 5)); }
  }

  // sortie block, under the strip block on the left: what the aeroplane has
  // left to fight with, and what the sortie still wants
  {
    const x = blockX, y = blockY + padY * 2 + lh * 3 + Math.round(fs * 0.75);
    const rearming = WAR.rearm > 0 && WAR.rearm < 5;
    const status = rearming || WAR.phase === 'CLEARED';
    const bh = padY * 2 + lh * (status ? 8 : 7);
    leftBottom = y + bh;
    hc.fillStyle = PANEL; hc.fillRect(x, y, blockW, bh);
    hc.fillStyle = ac.hp < HULL * 0.4 ? 'rgba(240,110,80,0.75)' : 'rgba(235,190,90,0.55)';
    hc.fillRect(x, y, 3, bh);
    hc.textAlign = 'left';
    hc.font = FONT_HEAD; hc.fillStyle = INK;
    hc.fillText('SORTIE ' + WAR.wave + '   ' + (WAR.zone ? WAR.zone.name : ''), x + padX, rowY(y, 0));
    hc.font = FONT_ROW;
    // Where the garrison is, because a target you cannot find is not a target.
    if (WAR.zone) {
      let zb = (Math.atan2(WAR.zone.x - ac.pos.x, -(WAR.zone.z - ac.pos.z)) / DEG) % 360;
      if (zb < 0) zb += 360;
      const zd = Math.hypot(WAR.zone.x - ac.pos.x, WAR.zone.z - ac.pos.z) * NM;
      hc.fillStyle = SUB;
      hc.fillText('BRG ' + String(Math.round(zb)).padStart(3, '0') + '°   ' + zd.toFixed(1) + ' NM', x + padX, rowY(y, 1));
    }
    hc.fillStyle = WAR.phase === 'CLEARED' ? '#7ee0a0' : SUB;
    hc.fillText(WAR.phase === 'CLEARED'
      ? 'OBJECTIVE COMPLETE — GO HOME'
      : 'TARGETS ' + Math.min(WAR.done, WAR.need) + '/' + WAR.need + '   FIGHTERS UP ' + WAR.live,
      x + padX, rowY(y, 2));

    gauge(hc, x, y, 3, 'AMMO', ac.ammo > 60 ? SUB : '#ff8a5c', String(ac.ammo),
      ac.ammo / GUN.AMMO, '#c9d8e2');
    gauge(hc, x, y, 4, ac.gunJam ? 'JAM' : 'HEAT', ac.gunJam ? '#ff5b3d' : SUB,
      Math.round(ac.heat * 100) + '%', ac.heat,
      ac.gunJam ? '#ff5b3d' : ac.heat > 0.7 ? '#f0c24a' : '#6fa8c9');
    const hull = ac.hp / HULL;
    gauge(hc, x, y, 5, 'HULL', hull < 0.4 ? '#ff5b3d' : SUB, Math.round(hull * 100) + '%',
      hull, hull < 0.3 ? '#ff5b3d' : hull < 0.65 ? '#f0c24a' : '#7ee0a0');

    // What is on the pylons. Its own row rather than a gauge, because the count
    // is what matters and four bombs do not want a bar.
    {
      const o = ORD[ac.ord], left = ac.ordAmmo[ac.ord], cy = rowY(y, 6);
      hc.font = FONT_ROW; hc.textAlign = 'left';
      hc.fillStyle = SUB; hc.fillText('ORD', x + padX, cy);
      hc.fillStyle = left ? '#f0c24a' : '#ff8a5c';
      hc.fillText(o.name, x + padX + fs * 3.1, cy);
      hc.textAlign = 'right';
      hc.fillText('× ' + left, x + LAY.bw - padX, cy);
      hc.textAlign = 'left';
      hc.fillStyle = 'rgba(150,200,235,0.45)';
      hc.font = '600 ' + Math.max(8, Math.round(fsm * 0.86)) + 'px sans-serif';
      hc.fillText('Z', x + padX + fs * 2.0, cy);
      hc.font = FONT_ROW;
    }

    if (status) {
      hc.font = FONT_ROW; hc.textAlign = 'left';
      if (rearming) {
        hc.fillStyle = '#7ee0a0';
        hc.fillText('REARMING  ' + Math.round(WAR.rearm / 5 * 100) + '%', x + padX, rowY(y, 7));
      } else {
        hc.fillStyle = '#a8cbe4';
        hc.fillText('STOP ON A STRIP TO REARM', x + padX, rowY(y, 7));
      }
    }
  }

  // --- gunsight ------------------------------------------------------------
  // Drawn where the rounds actually converge, so it tells the truth in the
  // chase view as well as from the cockpit.
  if (!ac.crashed) {
    _vdir.set(0, 0, -1).applyQuaternion(ac.quat);
    const s = toScreen(ac.pos.x + _vdir.x * GUN.CONV, ac.pos.y + _vdir.y * GUN.CONV, ac.pos.z + _vdir.z * GUN.CONV);
    if (s.ok && s.y < glassBottom(s.x)) {
      const r = clamp(W * 0.016, 14, 26);
      const hot = t - WAR.confirmT < 0.35;
      hc.strokeStyle = ac.gunJam ? 'rgba(255,91,61,0.85)'
        : hot ? 'rgba(126,224,160,0.95)'
          : ac.ammo > 0 ? 'rgba(245,197,66,0.72)' : 'rgba(140,150,158,0.5)';
      hc.lineWidth = 1.6;
      hc.beginPath(); hc.arc(s.x, s.y, r, 0, TAU); hc.stroke();
      hc.beginPath();
      hc.moveTo(s.x - r * 1.9, s.y); hc.lineTo(s.x - r * 0.45, s.y);
      hc.moveTo(s.x + r * 0.45, s.y); hc.lineTo(s.x + r * 1.9, s.y);
      hc.moveTo(s.x, s.y - r * 1.9); hc.lineTo(s.x, s.y - r * 0.45);
      hc.moveTo(s.x, s.y + r * 0.45); hc.lineTo(s.x, s.y + r * 1.9);
      hc.stroke();
      hc.fillStyle = hc.strokeStyle;
      hc.fillRect(s.x - 1.2, s.y - 1.2, 2.4, 2.4);
      if (ac.firing) {
        hc.strokeStyle = 'rgba(255,240,168,0.9)';
        hc.beginPath(); hc.arc(s.x, s.y, r * 0.55, 0, TAU); hc.stroke();
      }
    }
  }

  // --- where the ordnance would land ---------------------------------------
  // A ring on the ground with the blast radius drawn to scale, so the decision
  // becomes when to release rather than where the nose happens to point.
  if (ac.ord !== O_CANNON && ac.ordAmmo[ac.ord] > 0 && !ac.crashed && !ac.onGround
    && predictImpact(ac.ord)) {
    const sp2 = toScreen(_pred.x, _pred.y, _pred.z);
    if (sp2.ok) {
      const dist = ac.pos.distanceTo(_pred);
      const blastR = ORD[ac.ord].blast;
      // Would it land on anything? The cue matters more than the ring, because
      // in level flight the impact point is under the nose where you cannot see
      // it — the marker gets caged at the bottom of the glass instead.
      let onTarget = false;
      for (let i = 0; i < TARGETS.length && !onTarget; i++) {
        const g2 = TARGETS[i];
        if (!g2.alive) continue;
        if (Math.hypot(g2.x - _pred.x, g2.z - _pred.z) < blastR * 0.8 + g2.r) onTarget = true;
      }
      const col = onTarget ? 'rgba(126,224,160,0.95)' : 'rgba(240,194,74,0.85)';
      const floor2 = glassBottom(sp2.x) - fsm * 3.4;
      const caged = sp2.y > floor2;
      const my2 = caged ? floor2 : sp2.y;
      hc.strokeStyle = col; hc.lineWidth = 1.6;
      if (caged) {
        // a chevron pointing down under the nose, with the range to release at
        hc.beginPath();
        hc.moveTo(sp2.x - fsm * 0.9, my2 - fsm * 0.7);
        hc.lineTo(sp2.x, my2 + fsm * 0.5);
        hc.lineTo(sp2.x + fsm * 0.9, my2 - fsm * 0.7);
        hc.stroke();
      } else {
        const r2 = clamp(blastR * (H * 0.9) / Math.max(dist, 40), 7, 90);
        hc.beginPath(); hc.arc(sp2.x, my2, r2, 0, TAU); hc.stroke();
        hc.beginPath();
        hc.moveTo(sp2.x - r2 * 1.4, my2); hc.lineTo(sp2.x - r2 * 0.4, my2);
        hc.moveTo(sp2.x + r2 * 0.4, my2); hc.lineTo(sp2.x + r2 * 1.4, my2);
        hc.moveTo(sp2.x, my2 - r2 * 1.4); hc.lineTo(sp2.x, my2 - r2 * 0.4);
        hc.moveTo(sp2.x, my2 + r2 * 0.4); hc.lineTo(sp2.x, my2 + r2 * 1.4);
        hc.stroke();
      }
      hc.font = FONT_ROW; hc.textAlign = 'center'; hc.fillStyle = col;
      // caged, the label goes above the chevron — below it is the coaming and
      // the AGL readout
      hc.fillText((onTarget ? 'RELEASE — ' : ORD[ac.ord].name + '  ') + Math.round(dist) + ' M',
        sp2.x, my2 + (caged ? -fsm * 1.5 : fsm * 1.9));
    }
  }

  // --- what to shoot at ----------------------------------------------------
  // A box on every fighter you can see, and the lead pipper for the nearest.
  {
    let leadF = null, leadD = 1e9;
    for (let i = 0; i < EMAX; i++) {
      const f = foes[i];
      if (!f.on) continue;
      const d = f.pos.distanceTo(ac.pos);
      const s = toScreen(f.pos.x, f.pos.y, f.pos.z);
      if (s.ok && s.y < glassBottom(s.x)) {
        const bs = clamp(2600 / Math.max(d, 60), 8, 46);
        hc.strokeStyle = f.hp < 58 ? 'rgba(255,138,92,0.9)' : 'rgba(255,91,61,0.78)';
        hc.lineWidth = 1.4;
        hc.strokeRect(s.x - bs / 2, s.y - bs / 2, bs, bs);
        if (d < 1400) {
          hc.font = FONT_ROW;
          hc.fillStyle = 'rgba(255,138,92,0.9)';
          hc.textAlign = 'center';
          hc.fillText(Math.round(d) + ' M', s.x, s.y + bs / 2 + fsm);
        }
      }
      if (d < leadD) { leadD = d; leadF = f; }
    }
    if (leadF && leadD < 1300) {
      // Aim here: where it will be when the rounds arrive.
      const tof = leadD / GUN.MUZZLE;
      _cv4.copy(leadF.vel).sub(ac.vel).multiplyScalar(tof).add(leadF.pos);
      const s = toScreen(_cv4.x, _cv4.y, _cv4.z);
      if (s.ok && s.y < glassBottom(s.x)) {
        hc.strokeStyle = 'rgba(126,224,160,0.9)'; hc.lineWidth = 1.6;
        hc.beginPath(); hc.arc(s.x, s.y, clamp(W * 0.006, 5, 10), 0, TAU); hc.stroke();
      }
    }
    // Supply drops get their own box. They are the one thing on the glass you
    // are trying to fly into rather than away from.
    for (let i = 0; i < PKMAX; i++) {
      const d = drops[i];
      if (!d.on) continue;
      const dd = Math.hypot(d.x - ac.pos.x, d.y - ac.pos.y, d.z - ac.pos.z);
      if (dd > 3400) continue;
      const s2 = toScreen(d.x, d.y, d.z);
      if (!s2.ok || s2.y >= glassBottom(s2.x)) continue;
      const bs = clamp(2200 / Math.max(dd, 50), 9, 52);
      hc.strokeStyle = PK_KINDS[d.kind].hud; hc.lineWidth = 1.6;
      hc.beginPath();
      // an open-cornered box, so it does not read as a target
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        hc.moveTo(s2.x + sx * bs / 2, s2.y + sy * bs / 2 - sy * bs * 0.32);
        hc.lineTo(s2.x + sx * bs / 2, s2.y + sy * bs / 2);
        hc.lineTo(s2.x + sx * bs / 2 - sx * bs * 0.32, s2.y + sy * bs / 2);
      }
      hc.stroke();
      hc.font = FONT_ROW; hc.textAlign = 'center'; hc.fillStyle = PK_KINDS[d.kind].hud;
      hc.fillText(PK_KINDS[d.kind].name + '  ' + Math.round(dd) + ' M', s2.x, s2.y + bs / 2 + fsm * 1.3);
    }

    // Energy against the nearest fighter, in feet of usable height. Positive is
    // the only side of this number worth being on.
    if (leadF && leadD < 3200) {
      const mine = ac.pos.y + ac.vel.lengthSq() / (2 * G);
      const theirs = leadF.pos.y + leadF.spd * leadF.spd / (2 * G);
      const dE = Math.round((mine - theirs) * FT / 10) * 10;
      // Same slab treatment as the corners. Width is derived from the type size
      // rather than measured, because measureText allocates and this is drawn
      // every frame.
      const pw = fsm * 14, ph = padY * 2 + lh * 2;
      hc.fillStyle = PANEL;
      hc.fillRect(W / 2 - pw / 2, blockY, pw, ph);
      hc.fillStyle = dE >= 0 ? 'rgba(126,224,160,0.5)' : 'rgba(255,138,92,0.6)';
      hc.fillRect(W / 2 - pw / 2, blockY, pw, 2);
      hc.textAlign = 'center';
      hc.font = FONT_HEAD;
      hc.fillStyle = dE >= 0 ? '#7ee0a0' : '#ff8a5c';
      hc.fillText('ENERGY ' + (dE >= 0 ? '+' : '') + dE + ' FT', W / 2, rowY(blockY, 0));
      hc.font = FONT_ROW;
      hc.fillStyle = SUB;
      hc.fillText('NEAREST FIGHTER ' + Math.round(leadD) + ' M', W / 2, rowY(blockY, 1));
    }
  }

  // taking fire: a red wash from the edges
  if (t - WAR.hitT < 0.5) {
    const a = clamp(1 - (t - WAR.hitT) / 0.5, 0, 1) * 0.5;
    hc.save();
    hc.fillStyle = 'rgba(190,40,25,' + a.toFixed(3) + ')';
    const e = Math.min(W, panelTop) * 0.10;
    hc.fillRect(0, 0, W, e); hc.fillRect(0, panelTop - e, W, e);
    hc.fillRect(0, 0, e, panelTop); hc.fillRect(W - e, 0, e, panelTop);
    hc.restore();
    hc.textAlign = 'center';
    hc.fillStyle = '#ff8a5c';
    hc.font = 'bold ' + Math.round(clamp(W * 0.018, 16, 28)) + 'px sans-serif';
    hc.fillText('HIT', W / 2, panelTop - clamp(H * 0.22, 100, 210));
    hc.font = FONT_ROW;
  }

  // stall warning
  if (ac.stalling && !ac.onGround && !ac.crashed) {
    hc.textAlign = 'center';
    hc.fillStyle = (t % 0.44 < 0.22) ? '#ff5b3d' : 'rgba(255,91,61,0.35)';
    hc.font = 'bold ' + Math.round(clamp(W * 0.022, 20, 36)) + 'px sans-serif';
    hc.fillText('STALL', W / 2, panelTop - clamp(H * 0.14, 70, 150));
  }

  // --- the panel ----------------------------------------------------------
  hc.drawImage(still, 0, 0, still.width, still.height, 0, 0, W, H);

  const ktIas = ac.ias * KT, altFt = ac.pos.y * FT, vsFpm = ac.vs * FPM;

  for (const d of dials) {
    hc.save(); hc.translate(d.x, d.y);
    if (d.id === 'asi') {
      const a = (-90 + (clamp(ktIas, 0, 205) / 200) * 330) * DEG;
      needle(hc, a, dialR * 0.86, dialR * 0.09, '#f2f5f8');
      digital(hc, Math.round(ktIas) + ' KT', dialR);
    } else if (d.id === 'ai') {
      hc.save();
      hc.beginPath(); hc.arc(0, 0, dialR - 1, 0, TAU); hc.clip();
      hc.rotate(-bank);
      const pxPerDeg = dialR / 26;
      const off = clamp(pitchA / DEG, -80, 80) * pxPerDeg;
      hc.fillStyle = '#4b87c0'; hc.fillRect(-dialR * 2.4, -dialR * 2.4 + off, dialR * 4.8, dialR * 2.4);
      hc.fillStyle = '#7d5a35'; hc.fillRect(-dialR * 2.4, off, dialR * 4.8, dialR * 2.4);
      hc.strokeStyle = '#f4f7fa'; hc.lineWidth = 1.8;
      hc.beginPath(); hc.moveTo(-dialR * 2.4, off); hc.lineTo(dialR * 2.4, off); hc.stroke();
      hc.strokeStyle = 'rgba(244,247,250,0.85)'; hc.lineWidth = 1.2;
      for (let p = -30; p <= 30; p += 10) {
        if (!p) continue;
        const w = (p % 20 === 0) ? dialR * 0.42 : dialR * 0.24;
        const yy = off - p * pxPerDeg;
        hc.beginPath(); hc.moveTo(-w, yy); hc.lineTo(w, yy); hc.stroke();
      }
      hc.restore();
      // fixed aircraft symbol
      hc.strokeStyle = '#f5c542'; hc.lineWidth = 2.6; hc.lineCap = 'round';
      hc.beginPath();
      hc.moveTo(-dialR * 0.52, 0); hc.lineTo(-dialR * 0.18, 0);
      hc.moveTo(dialR * 0.18, 0); hc.lineTo(dialR * 0.52, 0);
      hc.moveTo(0, -dialR * 0.06); hc.lineTo(0, dialR * 0.10);
      hc.stroke();
      // bank pointer
      hc.save(); hc.rotate(-bank);
      hc.fillStyle = '#f5c542'; hc.beginPath();
      hc.moveTo(0, -dialR * 0.90); hc.lineTo(-dialR * 0.09, -dialR * 0.74); hc.lineTo(dialR * 0.09, -dialR * 0.74);
      hc.closePath(); hc.fill(); hc.restore();
      for (const b of [-60, -45, -30, -20, -10, 10, 20, 30, 45, 60]) {
        tick(hc, (-90 + b) * DEG, dialR * 0.90, dialR * 0.99, Math.abs(b) % 30 === 0 ? 2 : 1, '#cfd8de');
      }
    } else if (d.id === 'alt') {
      const hundreds = ((altFt % 1000) / 1000) * TAU - Math.PI / 2;
      const thousands = ((altFt % 10000) / 10000) * TAU - Math.PI / 2;
      needle(hc, thousands, dialR * 0.52, dialR * 0.13, '#f2f5f8');
      needle(hc, hundreds, dialR * 0.88, dialR * 0.07, '#f2f5f8');
      digital(hc, Math.round(altFt), dialR);
    } else if (d.id === 'vsi') {
      const a = (180 + clamp(vsFpm / 1000, -2.2, 2.2) * 80) * DEG;
      needle(hc, a, dialR * 0.86, dialR * 0.08, '#f2f5f8');
      digital(hc, (vsFpm >= 0 ? '+' : '') + Math.round(vsFpm / 10) * 10, dialR);
    } else if (d.id === 'hdg') {
      hc.save();
      hc.beginPath(); hc.arc(0, 0, dialR - 1, 0, TAU); hc.clip();
      hc.rotate(-hdg * DEG);
      hc.font = 'bold ' + Math.round(dialR * 0.26) + 'px sans-serif';
      hc.textAlign = 'center'; hc.textBaseline = 'middle';
      for (let a = 0; a < 360; a += 10) {
        const ang = (a - 90) * DEG;
        tick(hc, ang, dialR * (a % 30 ? 0.82 : 0.74), dialR * 0.94, a % 30 ? 1 : 2, a % 90 ? DIM : INK);
        if (a % 90 === 0) {
          hc.save();
          hc.translate(Math.cos(ang) * dialR * 0.62, Math.sin(ang) * dialR * 0.62);
          hc.rotate(hdg * DEG);
          hc.fillStyle = INK; hc.fillText('NESW'[a / 90], 0, 0);
          hc.restore();
        } else if (a % 30 === 0) {
          hc.save();
          hc.translate(Math.cos(ang) * dialR * 0.63, Math.sin(ang) * dialR * 0.63);
          hc.rotate(hdg * DEG);
          hc.font = Math.round(dialR * 0.20) + 'px sans-serif';
          hc.fillStyle = DIM; hc.fillText(String(a / 10), 0, 0);
          hc.restore();
        }
      }
      hc.restore();
      hc.fillStyle = '#f5c542';
      hc.beginPath();
      hc.moveTo(0, -dialR * 0.96); hc.lineTo(-dialR * 0.10, -dialR * 0.78); hc.lineTo(dialR * 0.10, -dialR * 0.78);
      hc.closePath(); hc.fill();
      digital(hc, String(Math.round(hdg)).padStart(3, '0'), dialR);
    } else {
      // throttle bar + flap bar
      const bw = dialR * 0.30, bh = dialR * 1.18;
      hc.fillStyle = '#0a0d10'; hc.fillRect(-dialR * 0.58, -bh / 2, bw, bh);
      hc.fillStyle = '#5ec27a';
      hc.fillRect(-dialR * 0.58, bh / 2 - bh * ac.throttle, bw, bh * ac.throttle);
      hc.strokeStyle = '#39424a'; hc.lineWidth = 1; hc.strokeRect(-dialR * 0.58, -bh / 2, bw, bh);

      hc.fillStyle = '#0a0d10'; hc.fillRect(dialR * 0.28, -bh / 2, bw, bh);
      const fr = ac.flap / (FLAPS.length - 1);
      hc.fillStyle = '#e0a53c';
      hc.fillRect(dialR * 0.28, bh / 2 - bh * fr, bw, bh * fr);
      hc.strokeStyle = '#39424a'; hc.strokeRect(dialR * 0.28, -bh / 2, bw, bh);

      hc.font = 'bold ' + Math.round(dialR * 0.22) + 'px sans-serif';
      hc.textAlign = 'center'; hc.textBaseline = 'middle';
      hc.fillStyle = INK;
      hc.fillText(Math.round(ac.throttle * 100) + '%', -dialR * 0.43, bh / 2 + dialR * 0.22);
      hc.fillText(FLAPS[ac.flap].deg + '°', dialR * 0.43, bh / 2 + dialR * 0.22);
    }
    hc.restore();
    glass(hc, d);
  }

  // gear-and-ground strip along the bottom of the coaming
  hc.textAlign = 'center'; hc.textBaseline = 'middle';
  hc.font = '600 ' + Math.round(clamp(W * 0.0095, 10, 14)) + 'px sans-serif';
  hc.fillStyle = ac.onGround ? '#8fd39f' : DIM;
  hc.fillText(ac.onGround ? 'ON GROUND' : 'AGL ' + Math.max(0, Math.round((ac.pos.y - Math.max(0, heightAt(ac.pos.x, ac.pos.z))) * FT)) + ' FT',
    W / 2, panelTop - (H - panelTop) * 0.16 - clamp(H * 0.018, 10, 18));

  drawMinimap(t);

  // --- banners ------------------------------------------------------------
  if (ac.crashed) {
    hc.fillStyle = 'rgba(8,10,13,0.55)'; hc.fillRect(0, 0, W, panelTop);
    hc.textAlign = 'center';
    hc.fillStyle = '#ff6b4a';
    hc.font = 'bold ' + Math.round(clamp(W * 0.045, 34, 74)) + 'px sans-serif';
    hc.fillText('CRASHED', W / 2, panelTop * 0.40);
    hc.fillStyle = INK;
    hc.font = '600 ' + Math.round(clamp(W * 0.014, 13, 20)) + 'px sans-serif';
    hc.fillText(ac.crashMsg, W / 2, panelTop * 0.54);
    hc.fillStyle = DIM;
    hc.fillText('PRESS  R  TO RETURN TO ' + ac.departure.name, W / 2, panelTop * 0.64);
  } else if (ac.lastGrade && t - ac.gradeTime < 7) {
    const g = ac.lastGrade, age = t - ac.gradeTime;
    const fade = clamp(1 - (age - 5.4) / 1.6, 0, 1) * clamp(age / 0.25, 0, 1);
    // Centred, but pushed clear of the sortie block: in a small window the two
    // are at the same height and the grade lands on top of the gauges.
    const bTop = Math.max(panelTop * 0.36, leftBottom + lh * 1.3);
    hc.save(); hc.globalAlpha = fade;
    // A slab behind it. GOOD is pale blue and the breakdown line is grey, and
    // both of those disappear into a bright sky without something behind them.
    const gw = Math.min(W * 0.92, fs * 42), gTop = bTop - fs * 2.4;
    hc.fillStyle = 'rgba(9,13,17,0.58)';
    hc.fillRect(W / 2 - gw / 2, gTop, gw, panelTop * 0.225 + fs * 3.8);
    hc.fillStyle = 'rgba(150,200,235,0.35)';
    hc.fillRect(W / 2 - gw / 2, gTop, gw, 2);
    hc.textAlign = 'center';
    const col = g.grade === 'GREASER' ? '#7ee0a0' : g.grade === 'GOOD' ? '#a8d8f0' : g.grade === 'FIRM' ? '#f0c24a' : '#ff8a5c';
    hc.fillStyle = col;
    hc.font = 'bold ' + Math.round(clamp(W * 0.048, 36, 78)) + 'px sans-serif';
    hc.fillText(g.grade, W / 2, bTop);
    hc.fillStyle = INK;
    hc.font = '600 ' + Math.round(clamp(W * 0.016, 14, 22)) + 'px sans-serif';
    hc.fillText(g.score + ' / 100' + (g.isBest ? '   ★ BEST AT ' + g.strip.name : ''), W / 2, bTop + panelTop * 0.13);
    hc.fillStyle = DIM;
    hc.font = '600 ' + Math.round(clamp(W * 0.012, 12, 17)) + 'px sans-serif';
    hc.fillText(g.fpm + ' FT/MIN   ·   ' + g.off + ' M OFF CENTRELINE   ·   ' + g.dist + ' M PAST THRESHOLD', W / 2, bTop + panelTop * 0.225);
    hc.restore();
  } else if (t - ac.msgTime < 4.5 && ac.msg) {
    hc.save();
    hc.globalAlpha = clamp(1 - (t - ac.msgTime - 3.2) / 1.3, 0, 1);
    const my = Math.max(panelTop * 0.40, leftBottom + lh);
    const mfs = Math.round(clamp(W * 0.014, 13, 20));
    // Combat talks through this line — kills, jams, scrambles — so it gets the
    // same slab as everything else rather than grey type on blue.
    const mw = Math.min(W * 0.9, mfs * 26);
    hc.fillStyle = 'rgba(9,13,17,0.52)';
    hc.fillRect(W / 2 - mw / 2, my - mfs * 1.15, mw, mfs * 2.3);
    hc.textAlign = 'center'; hc.fillStyle = INK;
    hc.font = '600 ' + mfs + 'px sans-serif';
    hc.fillText(ac.msg, W / 2, my);
    hc.restore();
  }

  if (helpOpen) drawGuide();
  else if (storyOpen) drawStory();
}

/* --------------------------------------------------------------------------
   How to play. Not just a key list: what the four minutes of a flight are
   supposed to look like, and what the grade at the end is measuring.
   -------------------------------------------------------------------------- */

const STEPS = [
  ['1', 'TAKE OFF', 'Hold SHIFT for power, keep straight with Q and E, and at 60 kt ease back on S (or ↓).'],
  ['2', 'THE TARGET', 'The panel on the left names the garrison and bears you to it. Fly there — fighters scramble to meet you, and the scope bottom right is where you find them.'],
  ['3', 'SHOOT', 'SPACE fires the guns — 320 m convergence, seven seconds of trigger before they overheat. Z picks a pylon load and X fires it: cannon for fighters, rockets for gun pits, bombs for hangars.'],
  ['4', 'ENERGY', 'Height and speed are ammunition. Dive to close, zoom to break off — a fighter that follows you up runs out of wing and cannot turn.'],
  ['5', 'GO HOME', 'The strip named top left; F twice for flap; cross the threshold slow and low. Stopping on a strip rearms and repairs you.']
];
const SCORE_INTRO = 'Kills and wrecked installations score. So does every touchdown — graded on descent rate, centreline and threshold distance:';
const SCORE_END = 'Arrive above 5 m/s, land off the strip, run out of airframe or fly into the ground and the run ends — R to go again.';
const CONTROLS_L = [
  ['W / S   or   ↑ / ↓', 'nose down / nose up'],
  ['A / D   or   ← / →', 'roll left / right'],
  ['Q / E', 'rudder left / right'],
  ['SHIFT / CTRL', 'throttle up / down'],
  ['SPACE', 'fire the guns'],
  ['Z  ·  X', 'select ordnance · fire it']
];
const CONTROLS_R = [
  ['F', 'flaps 0° → 10° → 30°'],
  ['B', 'wheel brakes, on the ground'],
  ['V', 'cockpit / chase view'],
  ['P  ·  R', 'pause · back to the runway'],
  ['H  ·  T', 'this guide · the story']
];
const ARMS = [
  ['GUNS', '450 rounds, 12 a hit — everything, if you have the angle'],
