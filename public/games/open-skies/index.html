  ['CANNON', '60 shells, 42 a hit — three kill a fighter, four kill a tank'],
  ['ROCKETS', '12, 15 m blast — a gun pit or a fuel dump from a shallow dive'],
  ['BOMBS', '4, 32 m blast — a hangar in one pass, and low enough to hurt you'],
  ['SUPPLIES', 'crates on parachutes — fly through one for hull, ammunition or ordnance']
];

// Greedy word wrap against the font currently set on the context.
function wrapText(g, text, maxW) {
  const words = text.split(' '), out = [];
  let line = '';
  for (const w of words) {
    const next = line ? line + ' ' + w : w;
    if (g.measureText(next).width > maxW && line) { out.push(line); line = w; }
    else line = next;
  }
  if (line) out.push(line);
  return out;
}

/* --------------------------------------------------------------------------
   The story, on T. The premise used to live only in storyline.md, where the
   player never sees it; this is the same brief, on the glass, with the sim
   frozen while it is up.
   -------------------------------------------------------------------------- */

const STORY_TITLE = 'THE ISLAND, AND WHY YOU ARE OVER IT';
const STORY = [
  'Kestrel Field is the only thing on this island that is still yours: a long paved runway on the southern plain, three hangars, a windsock, and a handful of people on the apron who watch every departure and count what comes back.',
  'Everything west of it belongs to the garrison. They hold the town of Halloway two and a half miles out — fuel dumps, hangars, a radar dish — and they have laid their flak pits straight across the approach to runway 09, which is a decision somebody made about you personally. Tanks work the perimeter roads. Detachments sit on the three outlying strips, so the fields you would want on a bad day are the fields shooting at you.',
  'The island itself has not stopped: boats still work the bay, porpoises still break the surface, flocks still wheel over the hills, and the lighthouse on Cape Point still turns. That is what makes the tracer over Halloway feel like something happening somewhere rather than something happening in a level.',
  'Your objective, sortie by sortie: hit what the panel on the left names, get past whatever they scramble to stop you, and bring the aeroplane home. Take the guns to a fighter, rockets to a gun pit, bombs to a hangar. Height and speed are the only things you own that they cannot take off you — spend them deliberately.',
  'Landing is not the end of the sortie, it is the price of the next one. Put the wheels down well, stop on the strip, and they will patch the airframe, fill the magazines, hang fresh ordnance and give you the next set of orders. Put them down badly and the run is over.'
];
const STORY_FOOT = 'T closes this  ·  H is how to play';

function drawStory() {
  const avail = panelTop;
  let fs, bw, bh, paras;
  for (fs = Math.round(clamp(Math.min(W * 0.0115, H * 0.021), 8, 17)); fs >= 8; fs--) {
    bw = Math.min(W * 0.84, fs * 50);
    const pad = fs * 2.0;
    hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
    paras = STORY.map(t => wrapText(hc, t, bw - pad * 2));
    const rows = paras.reduce((n, l) => n + l.length, 0);
    bh = pad * 2 + fs * 3.4                        // title
      + rows * fs * 1.4 + STORY.length * fs * 0.7  // body
      + fs * 2.0;                                  // footer
    if (bh <= avail * 0.97) break;
  }
  const x = (W - bw) / 2, y = Math.max(4, (avail - bh) / 2), pad = fs * 2.0;

  hc.save();
  hc.fillStyle = 'rgba(8,11,14,0.92)';
  hc.fillRect(x, y, bw, bh);
  hc.strokeStyle = 'rgba(160,205,238,0.45)'; hc.lineWidth = 1.5;
  hc.strokeRect(x, y, bw, bh);
  hc.textAlign = 'left'; hc.textBaseline = 'middle';

  let cy = y + pad + fs * 0.9;
  hc.fillStyle = INK; hc.font = 'bold ' + Math.round(fs * 1.4) + 'px sans-serif';
  hc.fillText('OPEN SKIES', x + pad, cy);
  hc.textAlign = 'right';
  hc.fillStyle = '#a8cbe4'; hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
  hc.fillText('THE STORY', x + bw - pad, cy);
  hc.textAlign = 'left';
  cy += fs * 1.5;
  hc.strokeStyle = 'rgba(127,178,216,0.28)'; hc.lineWidth = 1;
  hc.beginPath(); hc.moveTo(x + pad, cy); hc.lineTo(x + bw - pad, cy); hc.stroke();
  cy += fs * 1.4;

  hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
  paras.forEach((lines, i) => {
    hc.fillStyle = i === 3 ? '#cfe0ec' : DIM;      // the orders paragraph reads brighter
    lines.forEach((ln, j) => hc.fillText(ln, x + pad, cy + j * fs * 1.4));
    cy += lines.length * fs * 1.4 + fs * 0.7;
  });

  hc.fillStyle = '#f5c542'; hc.font = 'bold ' + Math.round(fs * 0.95) + 'px sans-serif';
  hc.textAlign = 'center';
  hc.fillText(STORY_FOOT, x + bw / 2, y + bh - pad * 0.7);
  hc.restore();
}

function drawGuide() {
  const avail = panelTop;
  // Shrink the type until the whole guide fits above the instrument panel,
  // rather than letting it run off the bottom of a short window.
  let fs, bw, bh, stepLines, introLines, endLines;
  for (fs = Math.round(clamp(Math.min(W * 0.0105, H * 0.019), 7, 16)); fs >= 7; fs--) {
    bw = Math.min(W * 0.86, fs * 54);
    const pad = fs * 1.9, colW = bw - pad * 2 - fs * 8.8;
    hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
    stepLines = STEPS.map(s => wrapText(hc, s[2], colW));
    introLines = wrapText(hc, SCORE_INTRO, bw - pad * 2);
    endLines = wrapText(hc, SCORE_END, bw - pad * 2);
    const rows = stepLines.reduce((n, l) => n + l.length, 0);
    const scoreRows = introLines.length + 1 + endLines.length;
    bh = pad * 2 + fs * 4.6                       // title block
      + fs * 1.7 + rows * fs * 1.35 + STEPS.length * fs * 0.55   // the five steps
      + fs * 1.7 + scoreRows * fs * 1.35 + fs * 1.15             // scoring block
      + fs * 1.7 + ARMS.length * fs * 1.45 + fs * 1.0            // the weapons
      + fs * 1.7 + Math.max(CONTROLS_L.length, CONTROLS_R.length) * fs * 1.5  // controls
      + fs * 2.2;                                  // footer
    if (bh <= avail * 0.97) break;
  }
  const x = (W - bw) / 2, y = Math.max(4, (avail - bh) / 2);
  const pad = fs * 1.9;

  hc.save();
  hc.fillStyle = 'rgba(8,11,14,0.90)';
  hc.fillRect(x, y, bw, bh);
  hc.strokeStyle = 'rgba(160,205,238,0.45)'; hc.lineWidth = 1.5;
  hc.strokeRect(x, y, bw, bh);
  hc.textAlign = 'left'; hc.textBaseline = 'middle';

  let cy = y + pad + fs * 0.9;
  hc.fillStyle = INK; hc.font = 'bold ' + Math.round(fs * 1.5) + 'px sans-serif';
  hc.fillText('OPEN SKIES', x + pad, cy);
  hc.fillStyle = '#a8cbe4'; hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
  hc.textAlign = 'right';
  hc.fillText('HOW TO PLAY', x + bw - pad, cy);
  hc.textAlign = 'left';
  cy += fs * 1.7;
  hc.fillStyle = DIM;
  hc.fillText('An island held by somebody else, four strips, and one aeroplane with two guns.', x + pad, cy);
  cy += fs * 2.0;

  const heading = (text) => {
    hc.fillStyle = '#7fb2d8'; hc.font = 'bold ' + Math.round(fs * 0.92) + 'px sans-serif';
    hc.fillText(text, x + pad, cy);
    hc.strokeStyle = 'rgba(127,178,216,0.28)'; hc.lineWidth = 1;
    hc.beginPath();
    hc.moveTo(x + pad + hc.measureText(text).width + fs * 0.8, cy);
    hc.lineTo(x + bw - pad, cy); hc.stroke();
    cy += fs * 1.7;
  };

  heading('THE SORTIE, IN FIVE STEPS');
  STEPS.forEach((s, i) => {
    const top = cy;
    hc.fillStyle = '#f5c542'; hc.font = 'bold ' + Math.round(fs * 1.05) + 'px sans-serif';
    hc.fillText(s[0], x + pad, top);
    hc.fillStyle = INK; hc.font = 'bold ' + Math.round(fs * 0.95) + 'px sans-serif';
    hc.fillText(s[1], x + pad + fs * 1.5, top);
    hc.fillStyle = DIM; hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
    stepLines[i].forEach((ln, j) => hc.fillText(ln, x + pad + fs * 8.8, top + j * fs * 1.35));
    cy = top + stepLines[i].length * fs * 1.35 + fs * 0.55;
  });
  cy += fs * 0.3;

  heading('HOW YOU ARE SCORED');

  hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
  hc.fillStyle = DIM;
  introLines.forEach((ln, i) => hc.fillText(ln, x + pad, cy + i * fs * 1.35));
  cy += introLines.length * fs * 1.35;
  const grades = [['GREASER', '#7ee0a0'], ['GOOD', '#a8d8f0'], ['FIRM', '#f0c24a'], ['HARD', '#ff8a5c']];
  let gx = x + pad;
  grades.forEach((g, i) => {
    hc.fillStyle = g[1]; hc.font = 'bold ' + Math.round(fs * 0.95) + 'px sans-serif';
    hc.fillText(g[0], gx, cy);
    gx += hc.measureText(g[0]).width;
    if (i < grades.length - 1) {
      hc.fillStyle = DIM; hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
      hc.fillText('  ·  ', gx, cy); gx += hc.measureText('  ·  ').width;
    }
  });
  cy += fs * 1.35;
  hc.fillStyle = DIM; hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
  endLines.forEach((ln, i) => hc.fillText(ln, x + pad, cy + i * fs * 1.35));
  cy += endLines.length * fs * 1.35 + fs * 1.15;

  heading('WHAT YOU ARE CARRYING');
  ARMS.forEach((a, i) => {
    const yy = cy + i * fs * 1.45;
    hc.fillStyle = '#f5c542'; hc.font = 'bold ' + Math.round(fs * 0.95) + 'px sans-serif';
    hc.fillText(a[0], x + pad, yy);
    hc.fillStyle = DIM; hc.font = '600 ' + Math.round(fs * 0.95) + 'px sans-serif';
    hc.fillText(a[1], x + pad + fs * 5.6, yy);
  });
  cy += ARMS.length * fs * 1.45 + fs * 1.0;

  heading('CONTROLS');
  const colX = [x + pad, x + bw / 2 + fs * 0.4];
  [CONTROLS_L, CONTROLS_R].forEach((col, c) => {
    col.forEach((row, i) => {
      const yy = cy + i * fs * 1.5;
      hc.fillStyle = '#a8cbe4'; hc.font = 'bold ' + Math.round(fs * 0.95) + 'px sans-serif';
      hc.fillText(row[0], colX[c], yy);
      hc.fillStyle = DIM; hc.font = '600 ' + Math.round(fs * 0.9) + 'px sans-serif';
      hc.textAlign = 'right';
      hc.fillText(row[1], colX[c] + bw / 2 - pad - fs * 0.4, yy);
      hc.textAlign = 'left';
    });
  });
  cy += Math.max(CONTROLS_L.length, CONTROLS_R.length) * fs * 1.5 + fs * 0.9;

  hc.fillStyle = '#f5c542'; hc.font = 'bold ' + Math.round(fs * 0.95) + 'px sans-serif';
  hc.textAlign = 'center';
  hc.fillText('Press any key to fly  ·  H brings this back', x + bw / 2, cy);
  hc.restore();
}

function needle(g, ang, len, w, col) {
  g.save(); g.rotate(ang);
  g.fillStyle = col;
  g.beginPath();
  g.moveTo(-len * 0.18, -w * 0.5);
  g.lineTo(len, -w * 0.28);
  g.lineTo(len, w * 0.28);
  g.lineTo(-len * 0.18, w * 0.5);
  g.closePath(); g.fill();
  g.restore();
  g.beginPath(); g.arc(0, 0, w * 0.72, 0, TAU); g.fillStyle = '#c9d2d9'; g.fill();
}
// The digital repeat sits under the bezel, clear of the needles.
function digital(g, text, r) {
  const w = r * 1.08, h = Math.max(12, r * 0.30), y = r + 9;
  g.fillStyle = 'rgba(4,7,10,0.92)'; g.fillRect(-w / 2, y, w, h);
  g.strokeStyle = '#2c353d'; g.lineWidth = 1; g.strokeRect(-w / 2, y, w, h);
  g.font = 'bold ' + Math.round(clamp(r * 0.29, 10, 16)) + 'px sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#8fe0a8'; g.fillText(String(text), 0, y + h / 2 + 0.5);
}

/* --------------------------------------------------------------------------
   Camera and the main loop
   -------------------------------------------------------------------------- */

const chasePos = new THREE.Vector3();
let chaseInit = false;

function updateCamera(dt) {
  plane.position.copy(ac.pos);
  plane.quaternion.copy(ac.quat);

  const spin = ac.rpm / 60 * TAU * dt;
  plane.userData.prop.rotation.z += spin * 0.25;
  plane.userData.disc.material.opacity = clamp((ac.rpm - 900) / 1400, 0, 1) * 0.30;

  for (const m of cockpitHidden) m.visible = (view !== 'cockpit');

  // contact shadow
  const gy = heightAt(ac.pos.x, ac.pos.z);
  const agl = ac.pos.y - gy;
  shadow.position.set(ac.pos.x, gy + 0.35, ac.pos.z);
  const s = 5.5 + agl * 0.16;
  shadow.scale.set(s, s, 1);
  shadow.material.opacity = clamp(0.34 - agl * 0.0045, 0, 0.34);
  shadow.visible = agl < 70;

  if (view === 'cockpit') {
    // Eye behind the cowl, not on top of it: any closer and the nose fills the
    // windscreen as a foreshortened wedge instead of reading as an engine.
    camera.position.copy(ac.pos).add(_eye.set(0, 0.78, 0.25).applyQuaternion(ac.quat));
    camera.quaternion.copy(ac.quat);
    camera.fov = 62;
  } else {
    const want = _eye.set(0, 3.0, 12.5).applyQuaternion(ac.quat).add(ac.pos);
    want.y = Math.max(want.y, heightAt(want.x, want.z) + 2.5);
    if (!chaseInit) { chasePos.copy(want); chaseInit = true; }
    chasePos.lerp(want, clamp(dt * 4.5, 0, 1));
    camera.position.copy(chasePos);
    camera.up.set(0, 1, 0).applyQuaternion(ac.quat);
    camera.lookAt(ac.pos.x, ac.pos.y + 0.6, ac.pos.z);
    camera.fov = 58;
  }
  camera.updateProjectionMatrix();
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  layout();
}
addEventListener('resize', resize);

let clock = 0, last = performance.now();

function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000;
  last = now;
  dt = clamp(dt, 0.0005, 0.05);
  if (!frozen()) {
    clock += dt;
    // Fixed sub-steps keep the flight model identical on a 60 Hz and a 144 Hz screen.
    let left = dt;
    while (left > 0) { const h = Math.min(left, 1 / 120); step(h); left -= h; }
  }
  for (let i = 0; i < LIFE.length; i++) LIFE[i](clock);
  // Combat integrates in step(); this only writes what the last sub-step left
  // behind into the scene, so pausing freezes the fight exactly as it stands.
  syncCombat();
  updateCamera(frozen() ? 0 : dt);
  audio.update(dt, clock);
  renderer.render(scene, camera);
  drawHud(clock);
}

// Paint the first frame during start-up, before anything is pressed.
placeOnStrip(STRIPS[0]);
startWave(1);
ac.msgTime = -99;
layout();
syncCombat();
updateCamera(0);
renderer.render(scene, camera);
drawHud(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
