<style>

<canvas id="scene"></canvas>
<canvas id="hud"></canvas>
<script type="module">
import * as THREE from 'three';

/* ==========================================================================
   Open Skies — a light-aircraft flight simulator in one file.
   Take off, fly a leg, and land. The landing is the game.
   ========================================================================== */

const TAU = Math.PI * 2, DEG = Math.PI / 180;
const KT = 1.9438445;          // m/s  -> knots
const FT = 3.280839895;        // m    -> feet
const FPM = 196.8503937;       // m/s  -> feet per minute
const NM = 1 / 1852;           // m    -> nautical miles

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(e0, e1, x) { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
function gauss(dx, dz, r) { return Math.exp(-(dx * dx + dz * dz) / (r * r)); }

/* --------------------------------------------------------------------------
   Terrain — a single analytic height function, shared by the mesh and by
   collision, so what you see is exactly what you can hit.
   -------------------------------------------------------------------------- */

function hash2(i, j) {
  let n = (i * 374761393 + j * 668265263) | 0;
  n = (n ^ (n >> 13)) * 1274126177 | 0;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}
function vnoise(x, z) {
  const i = Math.floor(x), j = Math.floor(z);
  const fx = x - i, fz = z - j;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash2(i, j), b = hash2(i + 1, j), c = hash2(i, j + 1), d = hash2(i + 1, j + 1);
  return lerp(lerp(a, b, u), lerp(c, d, u), v);
}
function fbm(x, z, oct) {
  let amp = 0.5, freq = 1, sum = 0, norm = 0;
  for (let i = 0; i < oct; i++) { sum += amp * vnoise(x * freq, z * freq); norm += amp; amp *= 0.5; freq *= 2; }
  return sum / norm;
}

// Scattering points. Two hashes with different salts come out correlated and
// lay everything along a diagonal, so anything spread over the map uses the
// R2 low-discrepancy sequence instead.
const R2A = 0.7548776662, R2B = 0.5698402909;
const r2x = (i) => ((i + 1) * R2A) % 1;
const r2z = (i) => ((i + 1) * R2B) % 1;

// The island: a coastal plain in the south around the home field, a ridge to
// the north-east, hills west, and a headland out to the north-west. The 150 m
// pedestal is what keeps it above water instead of leaving it a drowned blob.
function baseHeight(x, z) {
  const iz = z + 1200;
  const d = Math.sqrt(x * x + iz * iz * 0.78) / 5400;
  const mask = 1 - smoothstep(0.55, 1.02, d);
  let h = (fbm(x * 0.00020 + 4.3, z * 0.00020 - 2.1, 5) * 2 - 1) * 210;
  h += (fbm(x * 0.00062 + 31.7, z * 0.00062 - 12.4, 4) * 2 - 1) * 55;
  h += 520 * gauss(x - 2600, z + 2600, 2000);   // the ridge above Ridge Shelf
  h += 300 * gauss(x + 3900, z - 500, 2400);    // western hills
  h += 210 * gauss(x + 1500, z + 5600, 1300);   // Cape Point headland
  h += 230 * gauss(x, z - 1800, 2600);          // the plain the home field sits on
  return (150 + h) * mask - (1 - mask) * 170;
}

// Four strips. Elevations are sampled from the terrain at start-up, so the
// flattened pads always sit naturally in the landscape.
const STRIPS = [
  { name: 'KESTREL FIELD', id: 'kestrel', x: 0, z: 1800, hdg: 90, len: 1500, wid: 40, paved: true },
  { name: 'MARSH STRIP', id: 'marsh', x: -3200, z: -900, hdg: 340, len: 720, wid: 24, paved: false },
  { name: 'RIDGE SHELF', id: 'ridge', x: 2600, z: -2600, hdg: 60, len: 640, wid: 24, paved: false },
  { name: 'CAPE POINT', id: 'cape', x: -1500, z: -5600, hdg: 300, len: 660, wid: 24, paved: false }
];
for (const s of STRIPS) {
  const a = s.hdg * DEG;
  s.fx = Math.sin(a); s.fz = -Math.cos(a);      // runway direction
  s.rx = Math.cos(a); s.rz = Math.sin(a);       // across the runway
  let sum = 0, n = 0;
  for (let t = -0.5; t <= 0.5; t += 0.125) {
    sum += baseHeight(s.x + s.fx * s.len * t, s.z + s.fz * s.len * t); n++;
  }
  s.elev = Math.max(26, sum / n);
}

// Halloway, the island's one town. It sits off your left wing on final for
// runway 09, which is the whole reason it is where it is.
const CITY = { name: 'HALLOWAY', x: -2400, z: 1100, r: 760, blend: 560, elev: 0 };
{
  let sum = 0, n = 0;
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
    sum += baseHeight(CITY.x + a * CITY.r * 0.6, CITY.z + b * CITY.r * 0.6); n++;
  }
  CITY.elev = Math.max(30, sum / n);
}

const PAD_A = 520, PAD_C = 340;                 // how far the flattening blends out

function heightAt(x, z) {
  let h = baseHeight(x, z);
  for (let i = 0; i < STRIPS.length; i++) {
    const s = STRIPS[i], dx = x - s.x, dz = z - s.z;
    const along = Math.abs(dx * s.fx + dz * s.fz), across = Math.abs(dx * s.rx + dz * s.rz);
    const ha = s.len * 0.5, hc = s.wid * 0.5 + 26;
    if (along > ha + PAD_A || across > hc + PAD_C) continue;
    const t = (1 - smoothstep(ha, ha + PAD_A, along)) * (1 - smoothstep(hc, hc + PAD_C, across));
    h = lerp(h, s.elev, t);
  }
  const cd = Math.hypot(x - CITY.x, z - CITY.z);
  if (cd < CITY.r + CITY.blend) {
    h = lerp(h, CITY.elev, 1 - smoothstep(CITY.r, CITY.r + CITY.blend, cd));
  }
  return h;
}

// Inside the town, with `pad` metres of margin.
const inCity = (x, z, pad) => Math.hypot(x - CITY.x, z - CITY.z) < CITY.r + (pad || 0);

// Which strip, if any, is this point on the tarmac of?
function stripAt(x, z) {
  for (let i = 0; i < STRIPS.length; i++) {
    const s = STRIPS[i], dx = x - s.x, dz = z - s.z;
    const along = dx * s.fx + dz * s.fz, across = dx * s.rx + dz * s.rz;
    if (Math.abs(along) < s.len * 0.5 && Math.abs(across) < s.wid * 0.5) return { strip: s, along, across };
  }
  return null;
}

/* --------------------------------------------------------------------------
   Renderer, sky, sun and sea
   -------------------------------------------------------------------------- */

const HORIZON = new THREE.Color(0xc3d8e6);
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(HORIZON.getHex(), 0.000092);

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.5, 26000);

const sunDir = new THREE.Vector3(-0.803, 0.375, -0.464).normalize();
const sun = new THREE.DirectionalLight(0xfff0d6, 2.5);
sun.position.copy(sunDir).multiplyScalar(4000);
scene.add(sun);
scene.add(new THREE.AmbientLight(0x93b7d4, 1.35));

// Sky dome: a vertical gradient painted into vertex colours.
{
  const geo = new THREE.SphereGeometry(21000, 32, 20);
  const pos = geo.attributes.position, col = [];
  const zenith = new THREE.Color(0x2f6fae), mid = new THREE.Color(0x82b4dc), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const y = pos.getY(i) / 21000;
    if (y >= 0) { c.copy(y > 0.42 ? mid : HORIZON).lerp(y > 0.42 ? zenith : mid, y > 0.42 ? smoothstep(0.42, 1, y) : smoothstep(0, 0.42, y)); }
    else { c.copy(HORIZON).lerp(new THREE.Color(0x8ea9ba), smoothstep(0, -0.25, y)); }
    col.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ side: THREE.BackSide, vertexColors: true, fog: false, depthWrite: false })));
}

// A soft sun disc, drawn in code.
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(64, 64, 2, 64, 64, 64);
  rg.addColorStop(0, 'rgba(255,252,240,1)'); rg.addColorStop(0.14, 'rgba(255,244,214,0.92)');
  rg.addColorStop(0.42, 'rgba(255,232,186,0.22)'); rg.addColorStop(1, 'rgba(255,228,180,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, fog: false, depthWrite: false, transparent: true }));
  sprite.scale.setScalar(3400);
  sprite.position.copy(sunDir).multiplyScalar(18000);
  scene.add(sprite);
}

/* --------------------------------------------------------------------------
   Textures — every one of them painted into a canvas at start-up, because there
   are no files to load and nothing may come off the network.

   They are all near-white and low-contrast on purpose: the materials keep their
   flat-shaded vertex colours and the map multiplies over the top, so a texture
   adds grain, panel lines and window rows without repainting the palette.
   -------------------------------------------------------------------------- */

function canvasTex(size, draw, repX, repY, linear) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  draw(g, size);
  const tex = new THREE.CanvasTexture(cv);
  if (!linear) tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repX || 1, repY || 1);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

// Speckle: n dots of a colour at a size range. The workhorse of everything below.
function speckle(g, s, n, col, lo, hi) {
  g.fillStyle = col;
  for (let i = 0; i < n; i++) {
    const w = lo + Math.random() * (hi - lo);
    g.fillRect(Math.random() * s, Math.random() * s, w, w);
  }
}

// Ground: grain, tufts and a few darker patches. Tiled every 48 m by the UVs
// the terrain mesh writes, so it reads as cover from low down and as texture
// rather than as a pattern from altitude.
const TEX_GROUND = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 26; i++) {                  // soft patches
    const r = 18 + Math.random() * 46;
    const rg = g.createRadialGradient(Math.random() * s, Math.random() * s, 1,
      0, 0, r);
    g.save();
    g.translate(Math.random() * s, Math.random() * s);
    const rg2 = g.createRadialGradient(0, 0, 1, 0, 0, r);
    rg2.addColorStop(0, 'rgba(120,132,108,0.16)');
    rg2.addColorStop(1, 'rgba(120,132,108,0)');
    g.fillStyle = rg2; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.restore();
  }
  speckle(g, s, 1800, 'rgba(96,110,84,0.20)', 1, 3);
  speckle(g, s, 900, 'rgba(255,255,255,0.22)', 1, 2);
  // tufts
  g.strokeStyle = 'rgba(88,104,72,0.20)'; g.lineWidth = 1;
  for (let i = 0; i < 700; i++) {
    const x = Math.random() * s, y = Math.random() * s;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y - 2 - Math.random() * 3); g.stroke();
  }
});

// Sea: a mottled colour map plus a real normal map, so the low sun breaks into
// glints across the swell instead of one flat sheen.
const TEX_SEA = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 40; i++) {
    g.save(); g.translate(Math.random() * s, Math.random() * s);
    const r = 20 + Math.random() * 60;
    const rg = g.createRadialGradient(0, 0, 1, 0, 0, r);
    rg.addColorStop(0, 'rgba(70,105,130,0.20)');
    rg.addColorStop(1, 'rgba(70,105,130,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.restore();
  }
  speckle(g, s, 700, 'rgba(255,255,255,0.16)', 1, 2);
}, 320, 320);

const SEA_WAVES = [[1, 0, 1.0], [2, 1, 0.55], [3, 2, 0.30], [5, 4, 0.16], [7, 3, 0.10]];
const TEX_SEA_N = canvasTex(256, (g, s) => {
  const img = g.createImageData(s, s);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const u = x / s * TAU, v = y / s * TAU;
    let hx = 0, hy = 0;
    for (let w = 0; w < SEA_WAVES.length; w++) {
      const fx = SEA_WAVES[w][0], fy = SEA_WAVES[w][1], a = SEA_WAVES[w][2];
      const c = Math.cos(u * fx + v * fy);
      hx += a * fx * c; hy += a * fy * c;
    }
    // Integer frequencies over a full period, so the tile has no seam.
    const nx = -hx * 0.09, ny = -hy * 0.09, nz = 1;
    const l = Math.hypot(nx, ny, nz), i = (y * s + x) * 4;
    img.data[i] = (nx / l * 0.5 + 0.5) * 255;
    img.data[i + 1] = (ny / l * 0.5 + 0.5) * 255;
    img.data[i + 2] = (nz / l * 0.5 + 0.5) * 255;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}, 340, 340, true);

// Aircraft skin: panel lines, rivets and a little wear.
const TEX_METAL = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  speckle(g, s, 500, 'rgba(120,130,140,0.07)', 1, 4);
  g.strokeStyle = 'rgba(90,100,112,0.30)'; g.lineWidth = 1;
  for (let y = 0; y < s; y += 64) {
    g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(s, y + 0.5); g.stroke();
    g.fillStyle = 'rgba(80,90,102,0.35)';
    for (let x = 6; x < s; x += 16) g.fillRect(x, y + 2, 1.4, 1.4);   // rivets
  }
  for (let x = 0; x < s; x += 128) {
    g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, s); g.stroke();
  }
  g.strokeStyle = 'rgba(255,255,255,0.5)';
  for (let i = 0; i < 40; i++) {
    const y = Math.random() * s;
    g.beginPath(); g.moveTo(0, y); g.lineTo(s, y + (Math.random() - 0.5) * 4); g.stroke();
  }
}, 2, 2);

// Camouflage: irregular blotches, dark enough to break an outline up.
const TEX_CAMO = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  const blot = (col, n, rmin, rmax) => {
    g.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const x = Math.random() * s, y = Math.random() * s;
      g.beginPath();
      const lobes = 5 + Math.floor(Math.random() * 4), r = rmin + Math.random() * (rmax - rmin);
      for (let k = 0; k <= lobes; k++) {
        const a = k / lobes * TAU, rr = r * (0.6 + Math.random() * 0.6);
        const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr;
        if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath(); g.fill();
    }
  };
  blot('rgba(96,104,84,0.42)', 16, 16, 42);
  blot('rgba(58,64,50,0.34)', 12, 10, 30);
  blot('rgba(255,255,255,0.30)', 10, 8, 24);
  speckle(g, s, 700, 'rgba(70,76,64,0.14)', 1, 3);
  g.strokeStyle = 'rgba(90,96,84,0.25)'; g.lineWidth = 1;
  for (let y = 0; y < s; y += 84) { g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(s, y + 0.5); g.stroke(); }
}, 2, 2);

// Corrugated iron, for hangar walls.
const TEX_CORRUGATED = canvasTex(128, (g, s) => {
  for (let x = 0; x < s; x += 8) {
    const lg = g.createLinearGradient(x, 0, x + 8, 0);
    lg.addColorStop(0, 'rgba(150,158,166,0.55)');
    lg.addColorStop(0.45, 'rgba(255,255,255,1)');
    lg.addColorStop(1, 'rgba(140,148,158,0.6)');
    g.fillStyle = lg; g.fillRect(x, 0, 8, s);
  }
  speckle(g, s, 260, 'rgba(120,96,70,0.10)', 1, 4);       // rust freckles
  g.fillStyle = 'rgba(90,100,110,0.30)';
  for (let y = 10; y < s; y += 42) for (let x = 4; x < s; x += 16) g.fillRect(x, y, 1.4, 1.4);
}, 3, 2);

const TEX_CONCRETE = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  speckle(g, s, 2200, 'rgba(105,110,112,0.16)', 1, 3);
  speckle(g, s, 500, 'rgba(255,255,255,0.5)', 1, 3);
  g.strokeStyle = 'rgba(96,100,104,0.28)'; g.lineWidth = 1.2;
  for (let i = 0; i < 7; i++) {                        // slab joints and cracks
    let x = Math.random() * s, y = Math.random() * s;
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { x += (Math.random() - 0.5) * 60; y += (Math.random() - 0.5) * 60; g.lineTo(x, y); }
    g.stroke();
  }
}, 2, 2);

// Rust and streaking, for fuel tanks.
const TEX_RUST = canvasTex(256, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 30; i++) {                       // patches
    g.save(); g.translate(Math.random() * s, Math.random() * s);
    const r = 10 + Math.random() * 40;
    const rg = g.createRadialGradient(0, 0, 1, 0, 0, r);
    rg.addColorStop(0, 'rgba(126,74,38,0.40)');
    rg.addColorStop(1, 'rgba(126,74,38,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill();
    g.restore();
  }
  g.strokeStyle = 'rgba(110,66,34,0.30)';               // streaks down the drum
  for (let i = 0; i < 90; i++) {
    const x = Math.random() * s, y = Math.random() * s * 0.7;
    g.lineWidth = 0.6 + Math.random() * 1.8;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y + 20 + Math.random() * 70); g.stroke();
  }
  g.strokeStyle = 'rgba(80,86,92,0.35)'; g.lineWidth = 2;
  for (let y = 40; y < s; y += 96) { g.beginPath(); g.moveTo(0, y); g.lineTo(s, y); g.stroke(); }
  speckle(g, s, 700, 'rgba(90,60,34,0.16)', 1, 3);
});

// Sandbags, for the flak pits.
const TEX_SANDBAG = canvasTex(128, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let row = 0, y = 0; y < s + 12; y += 11, row++) {
    for (let x = (row % 2) * -9; x < s + 18; x += 18) {
      g.beginPath();
      g.ellipse(x + 9, y + 5, 9.5, 5.4, 0, 0, TAU);
      g.fillStyle = 'rgba(255,255,255,1)'; g.fill();
      g.strokeStyle = 'rgba(96,84,58,0.55)'; g.lineWidth = 1.3; g.stroke();
      g.fillStyle = 'rgba(126,110,74,' + (0.10 + Math.random() * 0.14).toFixed(2) + ')';
      g.fill();
    }
  }
  speckle(g, s, 300, 'rgba(110,96,64,0.12)', 1, 2);
}, 4, 1);

// Facades. Three repeats of the same painting are handed out by height class,
// so a tower gets rows of windows rather than one stretched storey.
function windowTex(rows, cols) {
  return canvasTex(256, (g, s) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
    speckle(g, s, 900, 'rgba(120,124,126,0.10)', 1, 3);
    const cw = s / cols, ch = s / rows;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      const x = c * cw + cw * 0.22, y = r * ch + ch * 0.24;
      const w = cw * 0.56, h = ch * 0.46;
      const lit = Math.random();
      g.fillStyle = lit > 0.86 ? 'rgba(255,246,214,1)'
        : lit > 0.62 ? 'rgba(120,138,150,0.72)' : 'rgba(58,68,78,0.80)';
      g.fillRect(x, y, w, h);
      g.strokeStyle = 'rgba(70,76,82,0.35)'; g.lineWidth = 1;
      g.strokeRect(x - 0.5, y - 0.5, w + 1, h + 1);
    }
    // a course line between storeys
    g.fillStyle = 'rgba(96,100,104,0.18)';
    for (let r = 1; r < rows; r++) g.fillRect(0, r * ch - 1, s, 2);
  });
}
const TEX_WIN_LOW = windowTex(3, 4), TEX_WIN_MID = windowTex(6, 5), TEX_WIN_TALL = windowTex(12, 6);

const TEX_ROOF = canvasTex(128, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  speckle(g, s, 2600, 'rgba(70,62,58,0.20)', 1, 3);

/* --------------------------------------------------------------------------
   Terrain mesh — non-indexed so every triangle gets its own flat colour.
   -------------------------------------------------------------------------- */
{
  const SIZE = 17000, SEG = 200, CX = 0, CZ = -1400;
  const step = SIZE / SEG, half = SIZE / 2;
  const hs = new Float32Array((SEG + 1) * (SEG + 1));
  for (let j = 0; j <= SEG; j++) for (let i = 0; i <= SEG; i++) {
    hs[j * (SEG + 1) + i] = heightAt(CX - half + i * step, CZ - half + j * step);
  }
  const tris = SEG * SEG * 2;
  const pos = new Float32Array(tris * 9), nor = new Float32Array(tris * 9), col = new Float32Array(tris * 9);
  // UVs straight off the world position, so the ground texture tiles every
  // GTILE metres regardless of where a triangle sits.
  const uvs = new Float32Array(tris * 6);
  const GTILE = 48;
  let q = 0;
  const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
  const e1 = new THREE.Vector3(), e2 = new THREE.Vector3(), n = new THREE.Vector3(), tint = new THREE.Color();
  const sand = new THREE.Color(0xd9cca4), grass = new THREE.Color(0x6f8f57), olive = new THREE.Color(0x56764a);
  const rock = new THREE.Color(0x8b8272), scree = new THREE.Color(0x9d968a), high = new THREE.Color(0xd6d8d3);
  const deep = new THREE.Color(0x2e4a54);
  let p = 0;

  const put = (v) => {
    pos[p] = v.x; pos[p + 1] = v.y; pos[p + 2] = v.z; p += 3;
    uvs[q] = v.x / GTILE; uvs[q + 1] = v.z / GTILE; q += 2;
  };

  for (let j = 0; j < SEG; j++) for (let i = 0; i < SEG; i++) {
    const x0 = CX - half + i * step, z0 = CZ - half + j * step;
    const h00 = hs[j * (SEG + 1) + i], h10 = hs[j * (SEG + 1) + i + 1];
    const h01 = hs[(j + 1) * (SEG + 1) + i], h11 = hs[(j + 1) * (SEG + 1) + i + 1];
    for (let t = 0; t < 2; t++) {
      if (t === 0) { A.set(x0, h00, z0); B.set(x0, h01, z0 + step); C.set(x0 + step, h10, z0); }
      else { A.set(x0 + step, h10, z0); B.set(x0, h01, z0 + step); C.set(x0 + step, h11, z0 + step); }
      const base = p;
      put(A); put(B); put(C);
      e1.subVectors(B, A); e2.subVectors(C, A); n.crossVectors(e1, e2).normalize();
      if (n.y < 0) n.negate();
      const hAvg = (A.y + B.y + C.y) / 3, slope = 1 - n.y;
      if (hAvg < -6) tint.copy(deep);
      else if (hAvg < 6) tint.copy(sand);
      else if (hAvg < 30) tint.copy(sand).lerp(grass, smoothstep(6, 30, hAvg));
      else if (hAvg < 260) tint.copy(grass).lerp(olive, smoothstep(30, 260, hAvg));
      else if (hAvg < 470) tint.copy(olive).lerp(rock, smoothstep(260, 470, hAvg));
      else if (hAvg < 680) tint.copy(rock).lerp(scree, smoothstep(470, 680, hAvg));
      else tint.copy(scree).lerp(high, smoothstep(680, 880, hAvg));
      if (slope > 0.26 && hAvg > 12) tint.lerp(rock, smoothstep(0.26, 0.55, slope) * 0.8);
      const jitter = 0.93 + 0.14 * hash2(i * 7 + t, j * 13);
      for (let k = 0; k < 3; k++) {
        nor[base + k * 3] = n.x; nor[base + k * 3 + 1] = n.y; nor[base + k * 3 + 2] = n.z;
        col[base + k * 3] = tint.r * jitter; col[base + k * 3 + 1] = tint.g * jitter; col[base + k * 3 + 2] = tint.b * jitter;
      }
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.computeBoundingSphere();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX_GROUND })));
}

/* --------------------------------------------------------------------------
   Runways — the highest-contrast objects in the world, so they can be found
   from the air. Markings are painted into a canvas texture at start-up.
   -------------------------------------------------------------------------- */

function runwayTexture(strip) {
  const W = 256, L = 2048, cv = document.createElement('canvas');
  cv.width = W; cv.height = L;
  const g = cv.getContext('2d');
  const pxPerM = L / strip.len;

  if (strip.paved) {
    g.fillStyle = '#71777c'; g.fillRect(0, 0, W, L);
    for (let i = 0; i < 5200; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (0.02 + Math.random() * 0.06).toFixed(3) + ')';
      g.fillRect(Math.random() * W, Math.random() * L, 2, 2);
    }
    g.fillStyle = 'rgba(0,0,0,0.07)';
    g.fillRect(W * 0.44, 0, W * 0.12, L);          // centreline scuffing
  } else {
    g.fillStyle = '#6d8a52'; g.fillRect(0, 0, W, L);
    for (let y = 0; y < L; y += 46) {               // mown stripes
      g.fillStyle = (y / 46) % 2 ? '#65814c' : '#748f58';
      g.fillRect(0, y, W, 46);
    }
    for (let i = 0; i < 2600; i++) {
      g.fillStyle = 'rgba(0,0,0,' + (0.02 + Math.random() * 0.05).toFixed(3) + ')';
      g.fillRect(Math.random() * W, Math.random() * L, 3, 2);
    }
  }

  // Edge lines
  g.fillStyle = strip.paved ? 'rgba(240,242,238,0.92)' : 'rgba(238,240,232,0.8)';
  g.fillRect(4, 0, 6, L); g.fillRect(W - 10, 0, 6, L);

  // Centreline dashes: 30 m painted, 20 m gap
  const dash = 30 * pxPerM, gap = 20 * pxPerM;
  g.fillStyle = 'rgba(244,246,240,0.95)';
  for (let y = 110 * pxPerM; y < L - 110 * pxPerM; y += dash + gap) {
    g.fillRect(W / 2 - 5, y, 10, dash);
  }

  // Threshold bars at both ends
  for (const end of [0, 1]) {
    const y0 = end ? L - 62 : 22;
    for (let k = 0; k < 6; k++) {
      const x = 26 + k * ((W - 52) / 6);
      g.fillStyle = 'rgba(246,248,242,0.95)';
      g.fillRect(x, y0, (W - 52) / 6 - 9, 40);
    }
  }

  // Runway designators, both ends
  const numA = Math.round(strip.hdg / 10) || 36;
  const numB = ((numA + 18 - 1) % 36) + 1;
  g.save();
  g.fillStyle = 'rgba(246,248,242,0.95)';
  g.font = 'bold 74px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.translate(W / 2, 150); g.rotate(Math.PI);
  g.fillText(String(numA).padStart(2, '0'), 0, 0);
  g.restore();
  g.save();
  g.fillStyle = 'rgba(246,248,242,0.95)';
  g.font = 'bold 74px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.translate(W / 2, L - 150);
  g.fillText(String(numB).padStart(2, '0'), 0, 0);
  g.restore();

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

/* --------------------------------------------------------------------------
   Scenery. Empty ground reads as a flat green band from the air and gives you
   nothing to judge height or speed against, so the island gets trees and the
   home field gets buildings.
   -------------------------------------------------------------------------- */

// Weld a few primitives into one geometry, each part carrying its own colour.
function mergeGeos(list) {
  const parts = [];
  let total = 0;
  for (const it of list) {
    const g = it.geo.index ? it.geo.toNonIndexed() : it.geo;
    g.translate(it.tx || 0, it.ty || 0, it.tz || 0);
    parts.push({ g, c: new THREE.Color(it.color) });
    total += g.attributes.position.count;
  }
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  let o = 0;
  for (const p of parts) {
    const gp = p.g.attributes.position.array, gn = p.g.attributes.normal.array;
    for (let i = 0; i < gp.length; i += 3) {
      pos[o] = gp[i]; pos[o + 1] = gp[i + 1]; pos[o + 2] = gp[i + 2];
      nor[o] = gn[i]; nor[o + 1] = gn[i + 1]; nor[o + 2] = gn[i + 2];
      col[o] = p.c.r; col[o + 1] = p.c.g; col[o + 2] = p.c.b;
      o += 3;
    }
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}

// Is this spot clear of every runway and its approach?
function clearOfStrips(x, z, padA, padC) {
  for (const s of STRIPS) {
    const dx = x - s.x, dz = z - s.z;
    if (Math.abs(dx * s.fx + dz * s.fz) < s.len * 0.5 + padA &&
      Math.abs(dx * s.rx + dz * s.rz) < s.wid * 0.5 + padC) return false;
  }
  return true;
}

    trees.setColorAt(placed, tint);
    placed++;

  trees.count = placed;

/* --------------------------------------------------------------------------
   Halloway — the town. A dark paved disc, pale block pads with streets left as
   the gaps between them, and boxes that get taller toward the middle.

// Everything that moves registers an updater here; the frame loop runs them.
const LIFE = [];
const _lm = new THREE.Matrix4(), _lq = new THREE.Quaternion();
const _lp = new THREE.Vector3(), _ls = new THREE.Vector3(), _lc = new THREE.Color();
const _lq2 = new THREE.Quaternion();
const UP = new THREE.Vector3(0, 1, 0), AXIS_X = new THREE.Vector3(1, 0, 0);
const SEA_COL = new THREE.Color(0x35586e);

const BLOCK = 118, STREET = 26;                 // block pitch, and the gap between blocks
const isStreet = (x, z) => {
  const gx = (x - CITY.x) / BLOCK, gz = (z - CITY.z) / BLOCK;
  return Math.abs(gx - Math.round(gx)) * BLOCK < STREET * 0.5 + 2 ||
    Math.abs(gz - Math.round(gz)) * BLOCK < STREET * 0.5 + 2;
};

{
  const ground = new THREE.Mesh(

    })
  );

  ground.position.set(CITY.x, CITY.elev + 0.08, CITY.z);
  scene.add(ground);

  // Collect the blocks first, so the building loop knows how many it needs.
  const blocks = [];
  const span = Math.ceil(CITY.r / BLOCK);
  for (let i = -span; i <= span; i++) for (let j = -span; j <= span; j++) {
    const bx = CITY.x + i * BLOCK, bz = CITY.z + j * BLOCK;
    const d = Math.hypot(bx - CITY.x, bz - CITY.z);
    if (d > CITY.r * 0.82) continue;
    blocks.push({ x: bx, z: bz, d, i, j });
  }

  const padGeo = new THREE.BoxGeometry(BLOCK - STREET, 0.55, BLOCK - STREET);
  const pads = new THREE.InstancedMesh(padGeo,
    new THREE.MeshLambertMaterial({ color: 0x9aa093, flatShading: true, map: TEX_CONCRETE }), blocks.length);
  blocks.forEach((b, n) => {
    _lp.set(b.x, CITY.elev + 0.3, b.z);
    pads.setMatrixAt(n, _lm.compose(_lp, _lq.identity(), _ls.set(1, 1, 1)));
    _lc.setRGB(0.92 + hash2(b.i, b.j) * 0.16, 0.94 + hash2(b.i, b.j + 7) * 0.12, 0.88 + hash2(b.i + 5, b.j) * 0.18);
    pads.setColorAt(n, _lc);

    c.list.forEach((b, n) => {
      _lp.set(b.x, CITY.elev + 0.55 + b.h * 0.5, b.z);
      mesh.setMatrixAt(n, _lm.compose(_lp, _lq.identity(), _ls.set(b.w, b.h, b.d)));
      _lc.setHex(b.c);
      mesh.setColorAt(n, _lc);
    });
    mesh.instanceMatrix.needsUpdate = true;
    scene.add(mesh);
  }
  const caps = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshLambertMaterial({ color: 0x5f6469, flatShading: true, map: TEX_ROOF }), list.length);
  list.forEach((b, n) => {
    // a rooftop box, so the skyline is not a row of flat lids
    _lp.set(b.x, CITY.elev + 0.55 + b.h + 1.6, b.z);
    caps.setMatrixAt(n, _lm.compose(_lp, _lq.identity(), _ls.set(b.w * 0.42, 3.2, b.d * 0.42)));
  });
  caps.instanceMatrix.needsUpdate = true;
  scene.add(caps);
}

/* --------------------------------------------------------------------------
   People — only ever a few pixels tall from the air, but they are what makes
   the taxi and the roll-out feel like somewhere with anyone in it.
   -------------------------------------------------------------------------- */
{
  const person = mergeGeos([
    { geo: new THREE.BoxGeometry(0.5, 1.15, 0.32), ty: 0.58, color: 0x3f5d78 },
    { geo: new THREE.SphereGeometry(0.22, 6, 5), ty: 1.34, color: 0xd8ab8a }
  ]);
  const spots = [];
  // townsfolk on the streets
  for (let i = 0; spots.length < 260 && i < 9000; i++) {
    const a = hash2(i, 61) * TAU, rr = Math.sqrt(hash2(i, 67)) * CITY.r * 0.92;
    const x = CITY.x + Math.cos(a) * rr, z = CITY.z + Math.sin(a) * rr;
    if (!isStreet(x, z)) continue;
    spots.push([x, CITY.elev, z]);
  }
  // and a handful watching from the apron at Kestrel
  const s = STRIPS[0];
  for (let i = 0; i < 40; i++) {
    const along = (hash2(i, 71) - 0.5) * 700, across = 58 + hash2(i, 73) * 34;
    spots.push([s.x + s.fx * along + s.rx * across, s.elev, s.z + s.fz * along + s.rz * across]);
  }
  const people = new THREE.InstancedMesh(
    person, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }), spots.length);
  spots.forEach((p, n) => {
    _lp.set(p[0], p[1], p[2]);
    _lq.setFromAxisAngle(UP, hash2(n, 79) * TAU);
    people.setMatrixAt(n, _lm.compose(_lp, _lq, _ls.set(1, 0.92 + hash2(n, 83) * 0.2, 1)));
  });
  people.instanceMatrix.needsUpdate = true;
  people.frustumCulled = false;
  scene.add(people);
}

/* --------------------------------------------------------------------------
   Birds — flocks that wheel over the island. Scaling a bird in Y deepens the
   V of its wings, which is enough to read as flapping from a cockpit.
   -------------------------------------------------------------------------- */
{
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([
    0, 0, 0.45, -1.7, 0.5, -0.3, 0, 0, -0.5,
    0, 0, 0.45, 0, 0, -0.5, 1.7, 0.5, -0.3
  ]), 3));
  g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ color: 0x2f3740, flatShading: true, side: THREE.DoubleSide });

  const FLOCKS = 10, PER = 7, N = FLOCKS * PER;
  const birds = new THREE.InstancedMesh(g, mat, N);
  birds.frustumCulled = false;
  scene.add(birds);

  // Half the flocks are anchored on the places you fly past every circuit —
  // scattered at random over 11 km of island you simply never meet one.
  const HAUNTS = [
    [STRIPS[0].x - 900, STRIPS[0].z + 500], [STRIPS[0].x + 1300, STRIPS[0].z - 700],
    [CITY.x + 700, CITY.z - 500], [CITY.x - 600, CITY.z + 600],
    [STRIPS[3].x + 400, STRIPS[3].z + 500]
  ];
  const flocks = [];
  for (let f = 0; f < FLOCKS; f++) {
    let cx = 0, cz = 0;
    if (f < HAUNTS.length) { cx = HAUNTS[f][0]; cz = HAUNTS[f][1]; }
    else for (let i = f * 37; i < f * 37 + 400; i++) {
      const x = (r2x(i * 3 + 5) - 0.5) * 11000, z = (r2z(i * 3 + 5) - 0.5) * 11000 - 1400;
      if (heightAt(x, z) > 12) { cx = x; cz = z; break; }
    }
    flocks.push({
      cx, cz,
      ground: heightAt(cx, cz),
      radius: 260 + hash2(f, 91) * 420,
      agl: 45 + hash2(f, 97) * 190,
      rate: (0.055 + hash2(f, 101) * 0.06) * (hash2(f, 103) > 0.5 ? 1 : -1),
      phase: hash2(f, 107) * TAU
    });
  }
  LIFE.push((t) => {
    let n = 0;
    for (let f = 0; f < FLOCKS; f++) {
      const fl = flocks[f];
      const a = fl.phase + t * fl.rate;
      for (let i = 0; i < PER; i++) {
        // spread the flock into a loose trailing V behind the leader
        const lag = i * 0.028, side = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 9;
        const aa = a - lag;
        const x = fl.cx + Math.cos(aa) * (fl.radius + side);
        const z = fl.cz + Math.sin(aa) * (fl.radius + side);
        const y = fl.ground + fl.agl + Math.sin(t * 0.7 + i) * 6;
        const flap = clamp(0.55 + Math.sin(t * 7.5 + i * 1.7) * 0.85, 0.15, 1.4);
        _lp.set(x, y, z);
        _lq.setFromAxisAngle(UP, fl.rate > 0 ? -aa : -aa + Math.PI);
        birds.setMatrixAt(n++, _lm.compose(_lp, _lq, _ls.set(0.7, 0.7 * flap, 0.7)));
      }
    }
    birds.instanceMatrix.needsUpdate = true;
  });
}

/* --------------------------------------------------------------------------
   Fish and boats — the sea was an empty blue plane, and an empty plane gives
   you nothing to judge height or speed against when you are low over water.
   -------------------------------------------------------------------------- */
{
  // Two pools. Fish want coastal water you fly over on the way to a strip;
  // boats want a clear circle to steam round without running aground.
  const wet = [], shallows = [];
  const clearFor = (x, z, r) => {
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU;
      if (heightAt(x + Math.cos(a) * r, z + Math.sin(a) * r) > -10) return false;
    }
    return true;
  };
  const nearLand = (x, z) => {
    for (let k = 0; k < 8; k++) {
      const a = k / 8 * TAU;
      if (heightAt(x + Math.cos(a) * 1500, z + Math.sin(a) * 1500) > 5) return true;
    }
    return false;
  };
  for (let i = 0; (wet.length < 24 || shallows.length < 24) && i < 14000; i++) {
    const x = (r2x(i * 7 + 11) - 0.5) * 15000, z = (r2z(i * 7 + 11) - 0.5) * 15000 - 1400;
    if (heightAt(x, z) > -18) continue;
    if (shallows.length < 24 && nearLand(x, z) && clearFor(x, z, 200)) shallows.push([x, z]);
    else if (wet.length < 24 && clearFor(x, z, 640) && nearLand(x, z)) wet.push([x, z]);
  }
  if (!shallows.length) shallows.push(...wet);
  if (!wet.length) wet.push(...shallows);

  // --- fish -------------------------------------------------------------
  const fishGeo = mergeGeos([
    { geo: new THREE.ConeGeometry(0.42, 1.7, 6), ty: 0, color: 0x6f8fa6 },
    { geo: new THREE.ConeGeometry(0.34, 0.7, 4), ty: -1.05, color: 0x5b7789 }
  ]);
  fishGeo.rotateX(Math.PI / 2);          // point it along +Z, its direction of travel
  const POD = 3, PODS = Math.min(8, shallows.length), FISH = PODS * POD;
  const fish = new THREE.InstancedMesh(fishGeo, new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true }), FISH);
  fish.frustumCulled = false;
  scene.add(fish);

  const rings = new THREE.InstancedMesh(
    new THREE.RingGeometry(0.55, 1, 18),
    new THREE.MeshBasicMaterial({ color: 0xdfeaf0, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }),
    FISH);
  rings.frustumCulled = false;
  scene.add(rings);

  // One fish is two pixels from the air. A pod of three breaching together,
  // at something nearer porpoise size, is a thing you actually notice.
  const shoal = [];
  for (let i = 0; i < FISH; i++) {
    const pod = Math.floor(i / POD), k = i % POD;
    const hdg = hash2(pod, 111) * TAU;
    const across = (k - 1) * 9;
    shoal.push({
      x: shallows[pod][0] + Math.cos(hdg) * across,
      z: shallows[pod][1] - Math.sin(hdg) * across,
      hdg,
      period: 3.4 + hash2(pod, 113) * 4.0,
      phase: hash2(pod, 117) * 20 + k * 0.22,
      height: 5.5 + hash2(pod, 119) * 3.5,
      len: 15 + hash2(pod, 123) * 10,
      scale: 3.0 + hash2(i, 127) * 0.9
    });
  }
  LIFE.push((t) => {
    for (let i = 0; i < FISH; i++) {
      const f = shoal[i];
      const u = ((t + f.phase) % f.period) / f.period;
      const dx = Math.sin(f.hdg), dz = Math.cos(f.hdg);
      if (u < 0.42) {                    // out of the water, on a ballistic arc
        const k = u / 0.42;
        const y = Math.sin(k * Math.PI) * f.height;
        const slope = Math.cos(k * Math.PI) * f.height * Math.PI / f.len;
        _lp.set(f.x + dx * (k - 0.5) * f.len, y, f.z + dz * (k - 0.5) * f.len);
        _lq.setFromAxisAngle(UP, f.hdg);
        _lq2.setFromAxisAngle(AXIS_X, -Math.atan(slope));   // nose up on the way out
        fish.setMatrixAt(i, _lm.compose(_lp, _lq.multiply(_lq2), _ls.set(f.scale, f.scale, f.scale)));
      } else {
        _lp.set(f.x, -40, f.z);          // parked under the surface, out of sight
        fish.setMatrixAt(i, _lm.compose(_lp, _lq.identity(), _ls.set(0.001, 0.001, 0.001)));
      }
      // the splash ring spreads from where it went back in
      const rv = u < 0.42 ? 0 : (u - 0.42) / 0.58;
      const rs = 2.5 + rv * 26;
      _lp.set(f.x + dx * f.len * 0.5, 0.12, f.z + dz * f.len * 0.5);
      _lq.setFromAxisAngle(AXIS_X, -Math.PI / 2);
      rings.setMatrixAt(i, _lm.compose(_lp, _lq, _ls.set(rv > 0 ? rs : 0.001, rv > 0 ? rs : 0.001, 1)));
      _lc.setRGB(0.87, 0.92, 0.96).lerp(SEA_COL, Math.min(1, rv * 1.25));
      rings.setColorAt(i, _lc);
    }
    fish.instanceMatrix.needsUpdate = true;
    rings.instanceMatrix.needsUpdate = true;
    if (rings.instanceColor) rings.instanceColor.needsUpdate = true;
  });

  // --- boats ------------------------------------------------------------
  const boatGeo = mergeGeos([
    { geo: new THREE.BoxGeometry(5.5, 2.6, 17), ty: 1.0, color: 0xdfe3e6 },
    { geo: new THREE.BoxGeometry(3.6, 2.6, 5.5), ty: 3.6, tz: 2.4, color: 0xc4462f },
    { geo: new THREE.BoxGeometry(0.5, 5.5, 0.5), ty: 6.4, tz: 2.4, color: 0x2f3740 }
  ]);
  const wakeGeo = new THREE.PlaneGeometry(9, 60);
  const BOATS = Math.min(8, wet.length);
  const boats = new THREE.InstancedMesh(boatGeo,
    new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, map: TEX_METAL }), BOATS);
  const wakes = new THREE.InstancedMesh(wakeGeo,
    new THREE.MeshBasicMaterial({ color: 0xbcd2dd, transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false }), BOATS);
  boats.frustumCulled = false; wakes.frustumCulled = false;
  scene.add(boats); scene.add(wakes);

  const fleet = [];
  for (let i = 0; i < BOATS; i++) {
    const w = wet[(wet.length - 1 - i) % wet.length];
    fleet.push({ x: w[0], z: w[1], r: 220 + hash2(i, 131) * 300, rate: 0.012 + hash2(i, 137) * 0.016, phase: hash2(i, 139) * TAU });
  }
  LIFE.push((t) => {
    for (let i = 0; i < BOATS; i++) {
      const b = fleet[i], a = b.phase + t * b.rate;
      const x = b.x + Math.cos(a) * b.r, z = b.z + Math.sin(a) * b.r;
      const hdg = -a;                    // tangent to the circle it is steaming round
      _lp.set(x, 0, z);
      _lq.setFromAxisAngle(UP, hdg);
      boats.setMatrixAt(i, _lm.compose(_lp, _lq, _ls.set(1, 1, 1)));
      _lp.set(x - Math.sin(hdg) * 34, 0.1, z - Math.cos(hdg) * 34);
      _lq.setFromAxisAngle(UP, hdg);
      _lq2.setFromAxisAngle(AXIS_X, -Math.PI / 2);
      wakes.setMatrixAt(i, _lm.compose(_lp, _lq.multiply(_lq2), _ls.set(1, 1, 1)));
    }
    boats.instanceMatrix.needsUpdate = true;
    wakes.instanceMatrix.needsUpdate = true;
  });
}

// The swell drifts. Two maps sliding at slightly different rates is enough to
// stop the sea reading as a printed sheet, and costs two number writes a frame.
LIFE.push((t) => {
  TEX_SEA.offset.set(t * 0.0022, t * 0.0014);
  TEX_SEA_N.offset.set(t * -0.0031, t * 0.0019);
});

// A lighthouse on the Cape Point headland — the one thing out there tall
// enough to find the strip by.
{
  const s = STRIPS[3];
  const lx = s.x + s.rx * 210, lz = s.z + s.rz * 210;
  const ly = heightAt(lx, lz);
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 4.2, 22, 10),
    new THREE.MeshLambertMaterial({ color: 0xf0f2ee, flatShading: true, map: TEX_STONE }));
  tower.position.set(lx, ly + 11, lz); scene.add(tower);
  const band = new THREE.Mesh(new THREE.CylinderGeometry(3.3, 3.7, 5, 10),
    new THREE.MeshLambertMaterial({ color: 0xc4462f, flatShading: true }));
  band.position.set(lx, ly + 11, lz); scene.add(band);
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, 3.4, 8),
    new THREE.MeshBasicMaterial({ color: 0xffe9a8 }));
  lamp.position.set(lx, ly + 23.5, lz); scene.add(lamp);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(2.9, 3, 8),
    new THREE.MeshLambertMaterial({ color: 0x2f3740, flatShading: true }));
  cap.position.set(lx, ly + 26.5, lz); scene.add(cap);
}

/* --------------------------------------------------------------------------
   Clouds — flat-shaded blobs at altitude. They are how you feel height.
   -------------------------------------------------------------------------- */
{
  const parts = [
    [0, 0, 0, 1.0], [0.9, -0.12, 0.2, 0.72], [-0.85, -0.15, -0.15, 0.66],
    [0.25, 0.35, -0.5, 0.6], [-0.35, 0.28, 0.55, 0.55], [1.5, -0.3, -0.4, 0.42]
  ];
  let count = 0;
  const src = new THREE.IcosahedronGeometry(1, 1);
  const sp = src.attributes.position.array, sn = src.attributes.normal.array;
  count = (sp.length / 3) * parts.length;
  const pos = new Float32Array(count * 3), nor = new Float32Array(count * 3);
  let o = 0;
  for (const [px, py, pz, sc] of parts) {
    for (let i = 0; i < sp.length; i += 3) {
      pos[o] = sp[i] * sc * 1.0 + px; pos[o + 1] = sp[i + 1] * sc * 0.62 + py; pos[o + 2] = sp[i + 2] * sc + pz;
      nor[o] = sn[i]; nor[o + 1] = sn[i + 1]; nor[o + 2] = sn[i + 2];
      o += 3;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  const mat = new THREE.MeshLambertMaterial({ color: 0xf4f7fa, flatShading: true, emissive: 0x9fb6c8, emissiveIntensity: 0.35 });
  const clouds = new THREE.InstancedMesh(geo, mat, 90);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), sv = new THREE.Vector3();
  for (let i = 0; i < 90; i++) {
    const s = 130 + hash2(i, 3) * 240;
    v.set((r2x(i) - 0.5) * 22000, 900 + hash2(i, 17) * 900, (r2z(i) - 0.5) * 22000 - 1400);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), hash2(i, 29) * TAU);
    sv.set(s, s * (0.6 + hash2(i, 31) * 0.5), s);
    clouds.setMatrixAt(i, m.compose(v, q, sv));
  }
  clouds.instanceMatrix.needsUpdate = true;
  clouds.frustumCulled = false;
  scene.add(clouds);
}

/* --------------------------------------------------------------------------
   The aircraft — a low-wing single, built from primitives.
   Forward is -Z, up is +Y, right is +X.
   -------------------------------------------------------------------------- */

const plane = new THREE.Group();
const cockpitHidden = [];
{
  const white = new THREE.MeshLambertMaterial({ color: 0xeef0f2, flatShading: true, map: TEX_METAL });
  const red = new THREE.MeshLambertMaterial({ color: 0xd2452c, flatShading: true, map: TEX_METAL });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2b3138, flatShading: true, map: TEX_METAL });
  const glass = new THREE.MeshPhongMaterial({ color: 0x2c4a63, shininess: 90, specular: 0xa8c8de, transparent: true, opacity: 0.72, flatShading: true });

  const add = (geo, mat, x, y, z, rx, ry, rz, hideInCockpit) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.rotation.set(rx || 0, ry || 0, rz || 0);
    plane.add(m);
    if (hideInCockpit) cockpitHidden.push(m);
    return m;
  };

  // fuselage: main tube + tail cone + engine cowl + spinner.
  // The tube is hidden from the cockpit — from the pilot's eye it is a metre of
  // foreshortened skin that reads as a grey wedge, not as an aeroplane.
  add(new THREE.CylinderGeometry(0.46, 0.42, 3.6, 10), white, 0, 0, 0.2, Math.PI / 2, 0, 0, true);
  add(new THREE.CylinderGeometry(0.42, 0.12, 3.0, 10), white, 0, 0.12, 3.4, Math.PI / 2, 0, 0, true);
  // The cowl is wider than it is tall, and wears a matte anti-glare top — a
  // round tube in front of the windscreen just reads as a grey wedge.
  const cowl = add(new THREE.CylinderGeometry(0.42, 0.5, 1.2, 12), white, 0, -0.04, -2.4, Math.PI / 2, 0, 0, false);
  cowl.scale.set(1.22, 1, 0.74);
  add(new THREE.BoxGeometry(1.12, 0.11, 1.5), dark, 0, 0.30, -2.15, -3 * DEG, 0, 0, false);
  add(new THREE.ConeGeometry(0.26, 0.6, 12), red, 0, -0.04, -3.25, -Math.PI / 2, 0, 0, false);
  add(new THREE.BoxGeometry(0.96, 0.1, 4.0), red, 0, 0.02, 0.6, 0, 0, 0, true);  // side flash

  // canopy (hidden when you are sitting inside it)
  const canopy = add(new THREE.SphereGeometry(0.62, 12, 8), glass, 0, 0.42, -0.15, 0, 0, 0, true);
  canopy.scale.set(0.82, 0.72, 1.55);

  // wings, with a little dihedral, and coloured tips
  for (const side of [-1, 1]) {
    const w = add(new THREE.BoxGeometry(5.4, 0.18, 1.85), white, side * 2.8, -0.16, 0.35, 0, 0, side * -4 * DEG, false);
    add(new THREE.BoxGeometry(0.5, 0.2, 1.5), red, side * 5.45, -0.16 + 0.19, 0.35, 0, 0, side * -4 * DEG, false);
    w.userData.side = side;
  }

  // tail
  add(new THREE.BoxGeometry(3.4, 0.14, 1.0), white, 0, 0.42, 4.55, 0, 0, 0, true);
  add(new THREE.BoxGeometry(0.14, 1.5, 1.35), red, 0, 1.0, 4.6, 0, 0, 0, true);
  add(new THREE.BoxGeometry(0.13, 1.0, 0.9), red, 0, 0.85, 4.0, -22 * DEG, 0, 0, true);

  // gear
  for (const [gx, gz] of [[-1.55, 0.6], [1.55, 0.6], [0, -2.2]]) {
    add(new THREE.CylinderGeometry(0.07, 0.07, 0.75, 6), dark, gx, -0.6, gz, 0, 0, 0, true);
    add(new THREE.CylinderGeometry(0.3, 0.3, 0.16, 10), dark, gx, -0.95, gz, 0, 0, Math.PI / 2, true);
  }

  // propeller: two blades plus a translucent disc when it spins up
  const prop = new THREE.Group();
  prop.add(new THREE.Mesh(new THREE.BoxGeometry(0.13, 2.0, 0.06), dark));
  prop.add(new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.13, 0.06), dark));
  prop.position.set(0, -0.02, -3.45);
  plane.add(prop);
  plane.userData.prop = prop;
  cockpitHidden.push(prop);          // three metres from your eyes, it blots out the view

  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(1.0, 24),
    new THREE.MeshBasicMaterial({ color: 0xdfe6ec, transparent: true, opacity: 0.0, side: THREE.DoubleSide, depthWrite: false })
  );
  disc.position.set(0, -0.02, -3.5);
  plane.add(disc);
  plane.userData.disc = disc;
  cockpitHidden.push(disc);
}
scene.add(plane);

// A contact shadow, so you can judge your height in the flare.
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(1, 20),
  new THREE.MeshBasicMaterial({ color: 0x1d2a1a, transparent: true, opacity: 0.3, depthWrite: false })
);
shadow.rotation.x = -Math.PI / 2;
scene.add(shadow);

/* --------------------------------------------------------------------------
   Flight model
   -------------------------------------------------------------------------- */

const MASS = 1100, WING = 16.2, G = 9.81, THRUST_MAX = 3200, GEAR = 1.18;
const CL0 = 0.25, CL_A = 5.0, CD0 = 0.030, K_IND = 0.05, A_STALL = 0.28;
const FLAPS = [
  { deg: 0, dCL: 0.00, dCD: 0.000, dStall: 0.000 },
  { deg: 10, dCL: 0.32, dCD: 0.010, dStall: -0.010 },
  { deg: 30, dCL: 0.78, dCD: 0.048, dStall: -0.030 }
];

const ac = {
  pos: new THREE.Vector3(),
  vel: new THREE.Vector3(),
  quat: new THREE.Quaternion(),
  throttle: 0, flap: 0, rpm: 700,
  onGround: true, crashed: false, crashMsg: '',
  alpha: 0, beta: 0, ias: 0, vs: 0, gLoad: 1, stalling: false,
  departure: STRIPS[0], lastGrade: null, gradeTime: -99, msg: '', msgTime: -99,
  // combat: ammunition is the sortie limit, heat the burst limit, and battle
  // damage costs engine power before it costs you the aeroplane
  hp: 180, ammo: 450, heat: 0, gunJam: false, gunT: 0, gunShots: 0, firing: 0,
  power: 1, smokeT: 0,
  // ordnance: which pylon load is selected, how much of each is left
  ord: 0, ordAmmo: [60, 12, 4], ordT: 0
};

let best = {};

function placeOnStrip(s) {
  const back = s.len * 0.5 - 70;
  ac.pos.set(s.x - s.fx * back, s.elev + GEAR, s.z - s.fz * back);
  ac.quat.setFromEuler(new THREE.Euler(0, -s.hdg * DEG, 0, 'YXZ'));
  ac.vel.set(0, 0, 0);
  ac.throttle = 0; ac.flap = 0; ac.rpm = 700;
  ac.onGround = true; ac.crashed = false; ac.crashMsg = '';
  ac.departure = s;
  ac.lastGrade = null; ac.gradeTime = -99;
  // A fresh aeroplane: full magazines, cold guns, no battle damage, and the sky
  // cleared of whatever was chasing the last one.
  ac.hp = HULL; ac.ammo = GUN.AMMO; ac.heat = 0; ac.gunJam = false;
  ac.gunT = 0; ac.firing = 0; ac.power = 1; ac.ordT = 0;
  for (let i = 0; i < ORD.length; i++) ac.ordAmmo[i] = ORD[i].max;
  for (let i = 0; i < RMAX; i++) rOn[i] = 0;
  for (let i = 0; i < EMAX; i++) { foes[i].on = false; foes[i].mesh.visible = false; }
  for (let i = 0; i < BMAX; i++) bOn[i] = 0;
  for (let i = 0; i < PMAX; i++) pOn[i] = 0;
  WAR.rearm = 0; WAR.spawned = 0; WAR.live = 0; WAR.spawnT = 8;
  WAR.dropT = 34; WAR.medevac = false;
  for (let i = 0; i < PKMAX; i++) { drops[i].on = false; drops[i].group.visible = false; }
  ac.msg = 'READY AT ' + s.name + ' — HOLD SHIFT FOR THROTTLE'; ac.msgTime = clock;
}

const keys = {};

// The guide is up when the page opens and can be called back at any time with
// H. While it is up the simulation is frozen, so reading it mid-flight does not
// cost you the aeroplane.
let helpOpen = true, storyOpen = false;
const frozen = () => paused || helpOpen || storyOpen;
addEventListener('keydown', (e) => {
  if (e.repeat) { e.preventDefault(); return; }
  const k = e.key.toLowerCase();
  audio.start();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();

  if (k === 'h' || k === '?') { helpOpen = !helpOpen; storyOpen = false; return; }
  // The story panel, on its own key, frozen like the guide is.
  if (k === 't') { storyOpen = !storyOpen; helpOpen = false; return; }
  // Any other key closes either panel and still counts as that key, so holding
  // SHIFT to dismiss one opens the throttle rather than doing nothing.
  // Closing it also re-shows the standing order, which is otherwise the one
  // message a player never gets to read.
  if (helpOpen || storyOpen) { helpOpen = false; storyOpen = false; ac.msgTime = clock; }

  keys[k] = true;
  if (k === 'f') { ac.flap = (ac.flap + 1) % FLAPS.length; flash('FLAPS ' + FLAPS[ac.flap].deg + '°'); }
  if (k === 'v') { view = view === 'cockpit' ? 'chase' : 'cockpit'; }
  if (k === 'p') { paused = !paused; }
  if (k === 'r') { placeOnStrip(ac.departure); }
  if (k === 'z') {
    ac.ord = (ac.ord + 1) % ORD.length;
    flash('SELECTED ' + ORD[ac.ord].name + ' — ' + ac.ordAmmo[ac.ord] + ' LEFT   [X TO FIRE]');
  }
});

/* Physics ----------------------------------------------------------------- */
const _vb = new THREE.Vector3(), _f = new THREE.Vector3(), _r = new THREE.Vector3(), _u = new THREE.Vector3();
const _lift = new THREE.Vector3(), _drag = new THREE.Vector3(), _side = new THREE.Vector3(), _force = new THREE.Vector3();
const _invq = new THREE.Quaternion(), _dq = new THREE.Quaternion(), _e = new THREE.Euler();
// Scratch objects reused every frame — allocating inside the loop makes the
// garbage collector the thing that decides your frame time.
const _e2 = new THREE.Euler(0, 0, 0, 'XYZ'), _eye = new THREE.Vector3(), _hudE = new THREE.Euler();
const _vdir = new THREE.Vector3();

function step(dt) {
  const elev = (keys['s'] || keys['arrowdown'] ? 1 : 0) - (keys['w'] || keys['arrowup'] ? 1 : 0);
  const ail = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0);
  const rud = (keys['e'] ? 1 : 0) - (keys['q'] ? 1 : 0);
  const brake = !!keys['b'];

  if (!ac.crashed) {
    if (keys['shift']) ac.throttle = clamp(ac.throttle + dt * 0.55, 0, 1);
    if (keys['control']) ac.throttle = clamp(ac.throttle - dt * 0.55, 0, 1);
  } else {
    ac.throttle = 0;
  }
  ac.rpm += (700 + ac.throttle * 1900 - ac.rpm) * clamp(dt * 2.2, 0, 1);

  // Body axes in world space
  _f.set(0, 0, -1).applyQuaternion(ac.quat);
  _r.set(1, 0, 0).applyQuaternion(ac.quat);
  _u.set(0, 1, 0).applyQuaternion(ac.quat);

  const V = ac.vel.length();
  _invq.copy(ac.quat).invert();
  _vb.copy(ac.vel).applyQuaternion(_invq);
  const fwd = Math.max(_vb.z * -1, 0.001);
  const alpha = V > 1.2 ? Math.atan2(-_vb.y, fwd) : 0;
  const beta = V > 1.2 ? clamp(_vb.x / V, -1, 1) : 0;
  ac.alpha = alpha; ac.beta = beta;

  const rho = 1.225 * Math.exp(-Math.max(ac.pos.y, 0) / 8500);
  const q = 0.5 * rho * V * V;
  const fl = FLAPS[ac.flap];
  const aStall = A_STALL + fl.dStall;

  let CL;
  if (alpha <= aStall) CL = CL0 + CL_A * alpha + fl.dCL;
  else CL = (CL0 + CL_A * aStall + fl.dCL) * Math.max(0.34, 1 - (alpha - aStall) * 3.2);
  if (alpha < -aStall) CL = (CL0 - CL_A * aStall + fl.dCL) * 0.6;
  ac.stalling = alpha > aStall && V > 6;

  const stallDrag = ac.stalling ? (alpha - aStall) * 1.4 : 0;
  const CD = CD0 + fl.dCD + K_IND * CL * CL + stallDrag + Math.abs(beta) * 0.55;

  const L = q * WING * CL, D = q * WING * CD;
  // Battle damage is felt through the engine first: a shot-up aeroplane still
  // flies, it just cannot climb away from anything.
  const thrust = THRUST_MAX * ac.throttle * ac.power * (rho / 1.225) * clamp(1 - V / 130, 0.15, 1);

  _vdir.copy(ac.vel);
  if (V > 0.4) _vdir.multiplyScalar(1 / V); else _vdir.copy(_f);
  _lift.crossVectors(_r, _vdir).normalize().multiplyScalar(L);
  _drag.copy(_vdir).multiplyScalar(-D);
  _side.copy(_r).multiplyScalar(-beta * q * WING * 0.9);

  _force.set(0, -MASS * G, 0);
  _force.addScaledVector(_f, thrust);
  _force.add(_lift).add(_drag).add(_side);

  // --- attitude -----------------------------------------------------------
  const qf = clamp((V / 42) * (V / 42), 0.015, 1.15);
  const sf = clamp(V / 40, 0, 1.5);
  let pRate = elev * 0.95 * qf - alpha * 1.5 * sf;
  let rRate = -ail * 2.20 * qf + beta * 0.45 * sf;
  let yRate = -rud * 0.55 * qf - beta * 2.30 * sf;

  const groundY = heightAt(ac.pos.x, ac.pos.z);
  const contactY = groundY + GEAR;
  const wasAirborne = !ac.onGround;

  if (ac.onGround && !ac.crashed) {
    // Wheels hold the aeroplane level and pointed where it is rolling.
    const speed = Math.hypot(ac.vel.x, ac.vel.z);
    // Wings level on the wheels; the nose is free to rotate up to the tail-strike
    // angle and sinks back to level when the elevator is released.
    _e.setFromQuaternion(ac.quat, 'YXZ');
    _e.x = clamp(lerp(_e.x, 0, clamp(dt * 1.6, 0, 1)), -1.5 * DEG, 13 * DEG);
    _e.z = lerp(_e.z, 0, clamp(dt * 7, 0, 1));
    _e.y += -rud * clamp(speed / 12, 0, 1) * 0.65 * dt * (speed > 0.3 ? 1 : 0.35);
    ac.quat.setFromEuler(_e);
    pRate = elev * 1.0 * qf; rRate = 0; yRate = 0;

    // Rolling friction and brakes act along the ground track. Aircraft tyres
    // roll at about mu 0.025 — anything near a braking coefficient here and
    // full throttle cannot overcome it, so the aeroplane never moves at all.
    const mu = 0.025 + (stripAt(ac.pos.x, ac.pos.z) ? 0 : 0.10) + (brake ? 0.45 : 0);
    const decel = mu * G;
    if (speed > 0.05) {
      const nsx = ac.vel.x / speed, nsz = ac.vel.z / speed;
      const drop = Math.min(speed, decel * dt);
      ac.vel.x -= nsx * drop; ac.vel.z -= nsz * drop;
    }
    // Tyres kill sideways drift.
    _f.set(0, 0, -1).applyQuaternion(ac.quat);
    const sp2 = Math.hypot(ac.vel.x, ac.vel.z);
    const fh = Math.hypot(_f.x, _f.z) || 1;
    ac.vel.x = (_f.x / fh) * sp2; ac.vel.z = (_f.z / fh) * sp2;
    // Ground reaction cancels any downward force.
    if (_force.y < 0) _force.y = 0;
  }

  if (!ac.crashed) {
    _e.setFromQuaternion(ac.quat, 'YXZ');
    _e2.set(pRate * dt, yRate * dt, rRate * dt, 'XYZ');
    _dq.setFromEuler(_e2);
    ac.quat.multiply(_dq).normalize();
    ac.vel.addScaledVector(_force, dt / MASS);
    ac.pos.addScaledVector(ac.vel, dt);
  } else {
    ac.vel.multiplyScalar(Math.max(0, 1 - dt * 2.2));
    ac.pos.addScaledVector(ac.vel, dt);
    ac.pos.y = Math.max(ac.pos.y, heightAt(ac.pos.x, ac.pos.z) + 0.7);
  }

  ac.ias = ac.vel.length() * Math.sqrt(rho / 1.225);
  ac.vs = ac.vel.y;
  ac.gLoad = L / (MASS * G);

  // --- ground contact -----------------------------------------------------
  const gy2 = heightAt(ac.pos.x, ac.pos.z) + GEAR;
  if (!ac.crashed && ac.pos.y <= gy2) {
    const vsAt = -Math.min(0, ac.vel.y);
    const on = stripAt(ac.pos.x, ac.pos.z);
    _e.setFromQuaternion(ac.quat, 'YXZ');
    const bank = Math.abs(_e.z) / DEG;
    ac.pos.y = gy2;
    if (wasAirborne) {
      if (!on) crash('OFF THE STRIP — WHEELS INTO ROUGH GROUND');
      else if (vsAt > 5.0) crash('ARRIVED AT ' + Math.round(vsAt * FPM) + ' FT/MIN — GEAR COLLAPSED');
      else if (bank > 25) crash('WING TIP FIRST AT ' + Math.round(bank) + '° OF BANK');
      else gradeLanding(on, vsAt);
    }
    if (!ac.crashed) { ac.vel.y = Math.max(0, ac.vel.y); ac.onGround = true; }
  } else if (ac.pos.y > gy2 + 0.15) {
    if (ac.onGround && !ac.crashed) { ac.departure = nearestStrip().strip; }
    ac.onGround = false;
  }

  if (ac.pos.y < -40) crash('LOST IN THE SEA');

  // The war runs on the same sub-step as the flight model, so a dogfight is as
  // frame-rate independent as the aeroplane is.
  stepCombat(dt);
}

function crash(reason) {
  if (ac.crashed) return;
  ac.crashed = true; ac.crashMsg = reason;
  ac.lastGrade = null;
  audio.thud();
}

function gradeLanding(on, vsAt) {
  const s = on.strip;
  // Which threshold did we cross? The one behind us.
  const along = on.along;
  const dirSign = (ac.vel.x * s.fx + ac.vel.z * s.fz) >= 0 ? 1 : -1;
  const dist = dirSign > 0 ? (along + s.len * 0.5) : (s.len * 0.5 - along);
  const off = Math.abs(on.across);

  const vsPts = clamp(40 * (1 - vsAt / 3.2), 0, 40);
  const ctrPts = clamp(30 * (1 - off / (s.wid * 0.5)), 0, 30);
  const ideal = clamp(s.len * 0.16, 90, 300);
  const distPts = clamp(30 * (1 - Math.abs(dist - ideal) / (s.len * 0.45)), 0, 30);
  const score = Math.round(vsPts + ctrPts + distPts);

  let grade = 'HARD';
  if (vsAt < 0.6) grade = 'GREASER';
  else if (vsAt < 1.5) grade = 'GOOD';
  else if (vsAt < 3.0) grade = 'FIRM';

  ac.lastGrade = {
    grade, score, strip: s,
    fpm: Math.round(vsAt * FPM),
    off: off.toFixed(1),
    dist: Math.round(dist),
    isBest: !(best[s.id] >= score)
  };
  ac.gradeTime = clock;
  if (ac.lastGrade.isBest) {
    best[s.id] = score;
    try { localStorage.setItem('openSkies.best', JSON.stringify(best)); } catch (e) { /* private mode */ }
  }
  audio.chirp(vsAt);
}

function nearestStrip() {
  let bestS = STRIPS[0], bd = Infinity;
  for (const s of STRIPS) {
    const d = (s.x - ac.pos.x) ** 2 + (s.z - ac.pos.z) ** 2;
    if (d < bd) { bd = d; bestS = s; }
  }
  return { strip: bestS, dist: Math.sqrt(bd) };
}

// A buildable spot: on land, off the runways, out of the town itself, and flat
// enough that a hangar does not end up half-buried in a slope.
function siteNear(zx, zz, ang, rad, need) {
  let bestP = null, bestSlope = 1e9;
  for (let k = 0; k < 40; k++) {
    const a = ang + k * 0.23, r = rad * (1 + (k % 6) * 0.07);
    const x = zx + Math.cos(a) * r, z = zz + Math.sin(a) * r;
    const h = heightAt(x, z);
    if (h < 14) continue;
    if (inCity(x, z, 40)) continue;
    if (!clearOfStrips(x, z, 110, 60)) continue;
    let lo = h, hi = h;
    for (let s = 0; s < 4; s++) {
      const b = s / 4 * TAU;
      const hh = heightAt(x + Math.cos(b) * need, z + Math.sin(b) * need);
      if (hh < lo) lo = hh;
      if (hh > hi) hi = hh;
    }
    const slope = hi - lo;
    if (slope < need * 0.30) return { x, y: lo, z };
    if (slope < bestSlope) { bestSlope = slope; bestP = { x, y: lo, z }; }
  }
  return bestP;
}

function makeTarget(kind, zone, x, y, z, face) {
  const k = KINDS[kind];
  const group = new THREE.Group();
  group.position.set(x, y, z);
  group.rotation.y = face;
  const live = new THREE.Group(), dead = new THREE.Group();
  dead.visible = false;
  group.add(live); group.add(dead);

  const t = {
    kind, zone, x, y, z, face, alive: true,
    hp: k.hp, maxHp: k.hp, r: k.r, score: k.score, blast: k.blast, name: k.name,
    group, live, dead, mount: null, barrels: null, dish: null, turret: null,
    gyaw: face, blocked: false, acq: 0,
    think: 0, fireT: 0, burst: 0, aim: 0, spd: 0, hdg: face,
    orbX: x, orbZ: z, orbR: 1, orbA: 0, orbDir: 1,
    aa: kind === 'aa' || kind === 'tank', range: kind === 'aa' ? 1400 : 700,
    hitT: -99
  };

  if (kind === 'fuel') {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 9, 12), M_RUST);
    body.position.y = 4.6; live.add(body);
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(7.3, 7.3, 0.7, 12), M_STEEL);
    lid.position.y = 9.3; live.add(lid);
    const band = new THREE.Mesh(new THREE.CylinderGeometry(7.15, 7.15, 1.1, 12), M_RED);
    band.position.y = 6.4; live.add(band);
    const pipe = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 13), M_STEEL);
    pipe.position.set(0, 1.3, 9.5); live.add(pipe);
  } else if (kind === 'hangar') {
    const shed = new THREE.Mesh(new THREE.BoxGeometry(30, 10, 22), M_SHED);
    shed.position.y = 5; live.add(shed);
    for (const side of [-1, 1]) {
      const slab = new THREE.Mesh(new THREE.BoxGeometry(30.6, 0.9, 12.4), M_ROOF);
      slab.rotation.x = side * 13 * DEG;
      slab.position.set(0, 10.3 - 0.6, side * 5.7);
      live.add(slab);
    }
    const door = new THREE.Mesh(new THREE.BoxGeometry(18, 8, 0.6), M_DARK);
    door.position.set(0, 4, 11.2); live.add(door);
  } else if (kind === 'radar') {
    const base = new THREE.Mesh(new THREE.BoxGeometry(7, 3.2, 7), M_CONC);
    base.position.y = 1.6; live.add(base);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 7, 8), M_STEEL);
    mast.position.y = 6.2; live.add(mast);
    const dish = new THREE.Group();
    const bowl = new THREE.Mesh(new THREE.SphereGeometry(5, 12, 7, 0, TAU, 0, Math.PI * 0.42),
      new THREE.MeshLambertMaterial({ color: 0xc8ccc4, flatShading: true, side: THREE.DoubleSide, map: TEX_METAL }));
    bowl.rotation.x = -62 * DEG;
    dish.add(bowl);
    const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 4, 6), M_DARK);
    stub.rotation.x = 28 * DEG; stub.position.set(0, 1.2, 1.6);
    dish.add(stub);
    dish.position.y = 10;
    live.add(dish);
    t.dish = dish;
  } else if (kind === 'aa') {
    // A sandbag ring with a twin mount in it. The barrels track you, which is
    // how you know at a glance which emplacements are still alive.
    const ring = new THREE.Mesh(new THREE.CylinderGeometry(6, 6.6, 1.9, 12, 1, true), M_BAGS);
    ring.position.y = 0.95; live.add(ring);
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(5.4, 5.4, 0.4, 12), M_CONC);
    pad.position.y = 0.2; live.add(pad);
    const mount = new THREE.Group();
    mount.position.y = 1.5;
    const tub = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.9, 1.6, 8), M_DRAB);
    tub.position.y = 0.8; mount.add(tub);
    const barrels = new THREE.Group();
    barrels.position.y = 1.7;
    for (const s of [-1, 1]) {
      const b = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.22, 5.2, 6), M_DARK);
      b.rotation.x = Math.PI / 2;
      b.position.set(s * 0.42, 0, -2.4);
      barrels.add(b);
    }
    mount.add(barrels);
    live.add(mount);
    t.mount = mount; t.barrels = barrels;
  } else {
    // tank: hull, tracks, a turret that follows you and a gun barrel
    const hull = new THREE.Mesh(new THREE.BoxGeometry(5.4, 1.7, 8.4), M_DRAB);
    hull.position.y = 1.5; live.add(hull);
    for (const s of [-1, 1]) {
      const trk = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.2, 8.8), M_DARK);
      trk.position.set(s * 2.5, 0.7, 0); live.add(trk);
    }
    const turret = new THREE.Group();
    turret.position.y = 2.6;
    const dome = new THREE.Mesh(new THREE.BoxGeometry(3.4, 1.5, 4.2), M_DRAB);
    turret.add(dome);
    const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 5.4, 6), M_DARK);
    gun.rotation.x = Math.PI / 2 - 6 * DEG;
    gun.position.set(0, 0.35, -3.2);
    turret.add(gun);
    live.add(turret);
    t.turret = turret;
    t.spd = 5.5 + hash2(TARGETS.length, 911) * 3.5;
  }

  // What it looks like afterwards: a scorch on the ground and a few burnt boxes.
  const scorch = new THREE.Mesh(G_SCORCH, M_SCORCH);
  scorch.rotation.x = -Math.PI / 2;
  scorch.position.y = 0.14;
  scorch.scale.setScalar(k.r * 1.5);
  dead.add(scorch);
  const n = kind === 'hangar' ? 5 : 3;
  for (let i = 0; i < n; i++) {
    const w = k.r * (0.35 + hash2(TARGETS.length * 7 + i, 13) * 0.55);
    const b = new THREE.Mesh(G_BOX, M_WRECK);
    b.scale.set(w, w * 0.42, w * 0.85);
    b.position.set((hash2(i, 17) - 0.5) * k.r * 1.2, w * 0.2, (hash2(i, 19) - 0.5) * k.r * 1.2);
    b.rotation.set(hash2(i, 23) * 0.5, hash2(i, 29) * TAU, hash2(i, 31) * 0.5);
    dead.add(b);
  }

  scene.add(group);
  TARGETS.push(t);
  return t;
}

{

  for (const [zk, kind, ang, rad] of plan) {

/* --- supply drops --------------------------------------------------------
   Your own side puts a crate under a parachute over the island every minute or
   so, and drops a hull repair unasked when you are badly shot up. Flying through
   one is the only way to fix anything without going home, so a drop is a real
   decision: it is usually 800 m off your line and always descending.
   -------------------------------------------------------------------------- */
const TEX_CHUTE = canvasTex(128, (g, s) => {
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 12; i += 2) {                 // alternating panels
    g.fillStyle = 'rgba(120,132,142,0.35)';
    g.fillRect(i * s / 12, 0, s / 12, s);
  }
  g.strokeStyle = 'rgba(90,100,110,0.45)'; g.lineWidth = 1;
  for (let i = 0; i <= 12; i++) {
    g.beginPath(); g.moveTo(i * s / 12, 0); g.lineTo(i * s / 12, s); g.stroke();
  }
  speckle(g, s, 200, 'rgba(110,120,130,0.10)', 1, 3);
});

const PK_HULL = 0, PK_AMMO = 1, PK_ORD = 2;
const PK_KINDS = [
  { name: 'HULL', col: 0x4f9a5e, hud: '#7ee0a0' },
  { name: 'AMMO', col: 0xb8a03c, hud: '#f0dc7a' },

];
const PK_MATS = PK_KINDS.map(k => new THREE.MeshLambertMaterial({
  color: k.col, flatShading: true, map: TEX_METAL
}));

const PKMAX = 5;
const drops = [];
{
  const crateMat = new THREE.MeshLambertMaterial({ color: 0x7d6a4e, flatShading: true, map: TEX_METAL });
  const chuteMat = new THREE.MeshLambertMaterial({

    const crate = new THREE.Mesh(new THREE.BoxGeometry(2.6, 2.0, 2.6), crateMat);
    g.add(crate);

    g.add(band);
    const chute = new THREE.Mesh(
      new THREE.SphereGeometry(4.4, 14, 8, 0, TAU, 0, Math.PI * 0.5), chuteMat);
    chute.position.y = 6.2;

      ln.position.set(lx * 1.5, 3.4, lz * 1.5);

    g.visible = false;

    drops.push({ on: false, kind: 0, group: g, band, x: 0, y: 0, z: 0, vy: 4.6, sway: 0, spin: 0 });
  }
}

function spawnDrop(kind, close) {
  let d = null;
  for (let i = 0; i < PKMAX; i++) if (!drops[i].on) { d = drops[i]; break; }
  if (!d) return null;
  _cfwd.set(0, 0, -1).applyQuaternion(ac.quat);
  const fl = Math.hypot(_cfwd.x, _cfwd.z) || 1;
  const ahead = close ? 500 + Math.random() * 250 : 750 + Math.random() * 550;
  const side = (Math.random() - 0.5) * (close ? 240 : 620);
  const x = ac.pos.x + (_cfwd.x / fl) * ahead - (_cfwd.z / fl) * side;
  const z = ac.pos.z + (_cfwd.z / fl) * ahead + (_cfwd.x / fl) * side;
  const gy = Math.max(heightAt(x, z), 0);
  d.on = true; d.kind = kind;
  d.x = x; d.z = z;
  d.y = Math.max(gy + 320, ac.pos.y + 130);
  d.vy = 4.2 + Math.random() * 0.8;
  d.sway = Math.random() * TAU;
  d.spin = (Math.random() - 0.5) * 0.5;
  d.band.material = PK_MATS[kind];
  d.group.visible = true;
  d.group.position.set(d.x, d.y, d.z);
  return d;
}

function collectDrop(d) {
  const k = PK_KINDS[d.kind];
  if (d.kind === PK_HULL) {
    ac.hp = Math.min(HULL, ac.hp + 70);
    flash('HULL PATCHED IN THE AIR — AIRFRAME ' + Math.round(ac.hp / HULL * 100) + '%');
  } else if (d.kind === PK_AMMO) {
    ac.ammo = GUN.AMMO; ac.heat = 0; ac.gunJam = false;
    flash('MAGAZINES REFILLED — ' + ac.ammo + ' ROUNDS, GUNS COOL');
  } else {
    ac.ordAmmo[O_CANNON] = Math.min(ORD[O_CANNON].max, ac.ordAmmo[O_CANNON] + 20);
    ac.ordAmmo[O_ROCKET] = Math.min(ORD[O_ROCKET].max, ac.ordAmmo[O_ROCKET] + 4);
    ac.ordAmmo[O_BOMB] = Math.min(ORD[O_BOMB].max, ac.ordAmmo[O_BOMB] + 1);
    flash('PYLONS RESUPPLIED — ' + ac.ordAmmo[O_CANNON] + ' SHELLS, '
      + ac.ordAmmo[O_ROCKET] + ' ROCKETS, ' + ac.ordAmmo[O_BOMB] + ' BOMBS');
  }
  d.on = false;
  d.group.visible = false;
  WAR.picked++;
  WAR.confirmT = clock;
  audio.pickup();
  for (let i = 0; i < 14; i++) {
    spawnPart(K_SPARK, d.x, d.y, d.z,
      (Math.random() - 0.5) * 18, (Math.random() - 0.5) * 18, (Math.random() - 0.5) * 18,
      0.3 + Math.random() * 0.3, 0.7);
  }
  void k;
}

function stepDrops(dt) {
  for (let i = 0; i < PKMAX; i++) {
    const d = drops[i];
    if (!d.on) continue;
    d.y -= d.vy * dt;
    d.sway += dt * 0.9;
    const gy = Math.max(heightAt(d.x, d.z), 0);
    // On the ground it is no use to an aeroplane, so it is gone.
    if (d.y <= gy + 1.4) {
      d.on = false; d.group.visible = false;
      if (ac.pos.distanceTo(_cv1.set(d.x, d.y, d.z)) < 2600) flash('SUPPLY DROP DOWN — MISSED IT');
      continue;
    }
    if (!ac.crashed && !ac.onGround &&
      ac.pos.distanceTo(_cv1.set(d.x, d.y, d.z)) < 34) collectDrop(d);
  }
}

/* --- the sortie ---------------------------------------------------------- */
const WAVES = [
  { zone: 'halloway', need: 3, fighters: 1 },
  { zone: 'halloway', need: 4, fighters: 2 },
  { zone: 'marsh', need: 4, fighters: 2 },
  { zone: 'ridge', need: 4, fighters: 3 },
  { zone: 'cape', need: 3, fighters: 3 },
  { zone: 'halloway', need: 4, fighters: 4 }
];

const WAR = {
  wave: 0, zone: null, need: 0, done: 0, quota: 0, spawned: 0, live: 0,
  phase: 'FIGHT', spawnT: 6, score: 0, kills: 0, fled: 0,
  dropT: 34, medevac: false, picked: 0,
  nearFoe: 9999, nearFoeClose: 0, rearm: 0, hitT: -99, warnT: -99, warn: '',
  hitCount: 0, confirmT: -99, targetsLeft: 0
};

function zoneAlive(key) {
  let n = 0;
  for (let i = 0; i < TARGETS.length; i++) if (TARGETS[i].alive && TARGETS[i].zone === key) n++;
  return n;
}

function startWave(n) {
  WAR.wave = n;
  const w = WAVES[Math.min(n - 1, WAVES.length - 1)];
  // Late waves fall back to whichever garrison still has anything standing.
  let key = w.zone;
  if (zoneAlive(key) === 0) {
    for (const z of ZONES) if (zoneAlive(z.key) > 0) { key = z.key; break; }
  }
  WAR.zone = zoneOf(key);
  WAR.need = Math.min(w.need + Math.max(0, n - WAVES.length), Math.max(1, zoneAlive(key)));
  WAR.done = 0;
  WAR.quota = Math.min(EMAX, w.fighters + Math.max(0, n - WAVES.length));
  WAR.spawned = 0;
  WAR.spawnT = 8;
  WAR.medevac = false;
  WAR.phase = 'FIGHT';
  flash('SORTIE ' + n + ' — HIT ' + WAR.need + ' TARGETS AT ' + WAR.zone.name);
}

/* --- pool helpers -------------------------------------------------------- */
function fireBullet(x, y, z, dx, dy, dz, speed, side, dmg, spread, life, bvx, bvy, bvz) {
  let slot = -1;
  for (let i = 0; i < BMAX; i++) {
    const j = (bCursor + i) % BMAX;
    if (!bOn[j]) { slot = j; break; }
  }
  if (slot < 0) return;
  bCursor = (slot + 1) % BMAX;
  // Gaussian-ish dispersion from two uniform draws, no allocation.
  const s1 = (Math.random() + Math.random() + Math.random() - 1.5) * spread;
  const s2 = (Math.random() + Math.random() + Math.random() - 1.5) * spread;
  // Perpendicular basis around the shot line, picked off whichever world axis
  // is least parallel to it.
  let ux, uy, uz;
  if (Math.abs(dy) < 0.9) { ux = -dz; uy = 0; uz = dx; } else { ux = 1; uy = 0; uz = 0; }
  const ul = Math.hypot(ux, uy, uz) || 1;
  ux /= ul; uy /= ul; uz /= ul;
  const wx = dy * uz - dz * uy, wy = dz * ux - dx * uz, wz = dx * uy - dy * ux;
  const ax = dx + ux * s1 + wx * s2, ay = dy + uy * s1 + wy * s2, az = dz + uz * s1 + wz * s2;
  const al = Math.hypot(ax, ay, az) || 1;
  bLast = slot;
  bOn[slot] = 1; bSide[slot] = side; bD[slot] = dmg; bT[slot] = life;
  bK[slot] = B_MG;                       // callers override for cannon shells
  bX[slot] = x; bY[slot] = y; bZ[slot] = z;
  bVX[slot] = (ax / al) * speed + (bvx || 0);
  bVY[slot] = (ay / al) * speed + (bvy || 0);
  bVZ[slot] = (az / al) * speed + (bvz || 0);
}

function spawnPart(kind, x, y, z, vx, vy, vz, life, size) {
  let slot = -1;
  for (let i = 0; i < PMAX; i++) {
    const j = (pCursor + i) % PMAX;
    if (!pOn[j]) { slot = j; break; }
  }
  if (slot < 0) return;
  pCursor = (slot + 1) % PMAX;
  pOn[slot] = 1; pKind[slot] = kind;
  pX[slot] = x; pY[slot] = y; pZ[slot] = z;
  pVX[slot] = vx; pVY[slot] = vy; pVZ[slot] = vz;
  pT[slot] = life; pMax[slot] = life; pS[slot] = size;
  pJ[slot] = 0.75 + Math.random() * 0.5;
}

function sparks(x, y, z, n) {
  for (let i = 0; i < n; i++) {
    spawnPart(K_SPARK, x, y, z,
      (Math.random() - 0.5) * 26, (Math.random() - 0.5) * 26 + 4, (Math.random() - 0.5) * 26,
      0.16 + Math.random() * 0.2, 0.45 + Math.random() * 0.5);
  }
}

// One explosion: a fireball, debris on ballistic arcs, and smoke that lifts.
function boom(x, y, z, size) {
  const n = Math.round(7 + size * 7);
  for (let i = 0; i < n; i++) {
    const sp = (7 + Math.random() * 20) * size;
    spawnPart(K_FIRE, x, y, z,
      (Math.random() - 0.5) * sp, Math.random() * sp * 0.8 + 2, (Math.random() - 0.5) * sp,
      0.35 + Math.random() * 0.55, (1.7 + Math.random() * 2.6) * size);
  }
  for (let i = 0; i < Math.round(4 + size * 4); i++) {
    spawnPart(K_SMOKE, x, y + size * 1.6, z,
      (Math.random() - 0.5) * 7, 3 + Math.random() * 7, (Math.random() - 0.5) * 7,
      1.6 + Math.random() * 2.4, (1.6 + Math.random() * 2.3) * size);
  }
  for (let i = 0; i < Math.round(3 + size * 4); i++) {
    const sp = (9 + Math.random() * 22) * size;
    spawnPart(K_DEBRIS, x, y + 1, z,
      (Math.random() - 0.5) * sp, Math.random() * sp * 0.9 + 5, (Math.random() - 0.5) * sp,
      1.1 + Math.random() * 1.3, 0.55 + Math.random() * 0.9);
  }
  audio.explode(ac.pos.distanceTo(_cv1.set(x, y, z)), size);
}

/* --- scratch: everything the combat update needs, allocated once --------- */
const NEG_Z = new THREE.Vector3(0, 0, -1);
const _cv1 = new THREE.Vector3(), _cv2 = new THREE.Vector3(), _cv3 = new THREE.Vector3();
const _cv4 = new THREE.Vector3(), _cq = new THREE.Quaternion(), _ce = new THREE.Euler(0, 0, 0, 'YXZ');
const _cm = new THREE.Matrix4(), _cs = new THREE.Vector3(), _cc = new THREE.Color();
const _cfwd = new THREE.Vector3();

// Closest approach of the segment p → p+d to a sphere centre, squared.
function segMiss(px, py, pz, dx, dy, dz, cx, cy, cz) {
  const fx = cx - px, fy = cy - py, fz = cz - pz;
  const dd = dx * dx + dy * dy + dz * dz;
  let t = dd > 1e-9 ? (fx * dx + fy * dy + fz * dz) / dd : 0;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  const qx = px + dx * t - cx, qy = py + dy * t - cy, qz = pz + dz * t - cz;
  return qx * qx + qy * qy + qz * qz;
}

/* --- taking damage ------------------------------------------------------- */
function hurt(dmg, why) {
  if (ac.crashed) return;
  ac.hp -= dmg;
  WAR.hitT = clock;
  if (ac.hp <= 0) { ac.hp = 0; crash(why || 'SHOT DOWN OVER THE ISLAND'); }
}

function killTarget(t) {
  if (!t.alive) return;
  t.alive = false;
  t.live.visible = false;
  t.dead.visible = true;
  boom(t.x, t.y + t.r * 0.4, t.z, t.blast);
  WAR.score += t.score;
  if (WAR.phase === 'FIGHT' && WAR.zone && t.zone === WAR.zone.key) WAR.done++;
  flash(t.name + ' DESTROYED   +' + t.score);
  WAR.confirmT = clock;
}

function killFoe(f) {
  f.on = false;
  f.mesh.visible = false;
  boom(f.pos.x, f.pos.y, f.pos.z, 1.5);
  for (let i = 0; i < 6; i++) {
    spawnPart(K_SMOKE, f.pos.x, f.pos.y - i * 12, f.pos.z, 0, -6, 0, 2.2, 3.4);
  }
  WAR.kills++;
  WAR.score += 150;
  WAR.confirmT = clock;
  flash('SPLASH ONE   +150   ' + WAR.kills + ' CONFIRMED');
}

/* --- the player's guns --------------------------------------------------- */
function stepGuns(dt) {
  const want = !!keys[' '] && !ac.crashed && !frozen();
  if (ac.gunJam) {
    ac.heat = Math.max(0, ac.heat - GUN.COOL * dt);
    if (ac.heat <= GUN.CLEAR) { ac.gunJam = false; flash('GUNS COOL — READY'); }
  } else if (want && ac.ammo > 0) {
    ac.heat += GUN.HEAT * dt;
    if (ac.heat >= 1) { ac.heat = 1; ac.gunJam = true; flash('GUNS JAMMED — OVERHEATED'); }
  } else {
    ac.heat = Math.max(0, ac.heat - GUN.COOL * dt);
  }

  if (!want || ac.gunJam) { ac.firing = 0; ac.gunT = 0; return; }
  if (ac.ammo <= 0) {
    ac.firing = 0; ac.gunT = 0;
    if (clock - WAR.warnT > 3) { WAR.warnT = clock; flash('OUT OF AMMUNITION — LAND TO REARM'); }
    return;
  }
  ac.gunT -= dt;
  if (ac.gunT > 0) return;
  ac.gunT += GUN.INTERVAL;
  ac.firing = 1;

  _cfwd.set(0, 0, -1).applyQuaternion(ac.quat);
  const side = (ac.ammo & 1) ? 1 : -1;                 // alternate wing roots
  _cv1.set(side * GUN.MOUNT, -0.1, -1.2).applyQuaternion(ac.quat).add(ac.pos);
  // Converge both guns on a point straight ahead, so the tracers cross where
  // the gunsight says they will.
  _cv2.copy(_cfwd).multiplyScalar(GUN.CONV).add(ac.pos).sub(_cv1).normalize();
  fireBullet(_cv1.x, _cv1.y, _cv1.z, _cv2.x, _cv2.y, _cv2.z, GUN.MUZZLE, 0, GUN.DMG, GUN.SPREAD,
    GUN.LIFE, ac.vel.x, ac.vel.y, ac.vel.z);
  bK[bLast] = B_MG;
  ac.ammo--;
  ac.gunShots++;
  if (!(ac.gunShots & 1)) audio.gun(ac.gunShots);
  if (ac.ammo === 0) flash('AMMUNITION GONE — LAND TO REARM');
}

/* --- the ordnance trigger, on its own key -------------------------------- */
function stepOrdFire(dt) {
  const kind = ac.ord;
  const want = !!keys['x'] && !ac.crashed && !frozen();
  ac.ordT -= dt;
  if (!want) { if (ac.ordT < 0) ac.ordT = 0; return; }
  if (ac.ordAmmo[kind] <= 0) {
    if (clock - WAR.warnT > 3) { WAR.warnT = clock; flash('NO ' + ORD[kind].name + ' LEFT — LAND TO REARM'); }
    return;
  }
  if (ac.ordT > 0) return;
  ac.ordT = ORD[kind].interval;

  if (kind === O_CANNON) {
    const o = ORD[O_CANNON];
    _cfwd.set(0, 0, -1).applyQuaternion(ac.quat);
    // The cannon is in the nose, so it does not need converging.
    _cv1.set(0, -0.16, -3.6).applyQuaternion(ac.quat).add(ac.pos);
    fireBullet(_cv1.x, _cv1.y, _cv1.z, _cfwd.x, _cfwd.y, _cfwd.z, o.muzzle, 0, o.dmg,
      o.spread, o.life, ac.vel.x, ac.vel.y, ac.vel.z);
    bK[bLast] = B_CANNON;
    ac.ordAmmo[kind]--;
    audio.cannon();
    return;
  }

  if (!launchOrd(kind)) { ac.ordT = 0; return; }
  ac.ordAmmo[kind]--;
  if (kind === O_ROCKET) audio.rocket();
  else { audio.release(); flash('BOMB GONE'); }
  if (ac.ordAmmo[kind] === 0) flash(ORD[kind].name + ' EXPENDED');
}

/* --- where an unguided load would land -----------------------------------
   The same integration the round itself uses, run forward from the aeroplane's
   present state until it meets the ground. Rockets and bombs are unguided and
   both fall well short of wherever the nose is pointing, so without this the
   only way to aim them is superstition. It fills a scratch vector and allocates
   nothing.
   -------------------------------------------------------------------------- */
const _pred = new THREE.Vector3();
